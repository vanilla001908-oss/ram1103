สงค์ได้","o":["เพื่อสนับสนุนกิจกรรมทางการตลาด","เพื่อบอกกล่าวให้ทราบ","เพื่อให้ประชาชนยอมรับ","เพื่อสร้างภาพลักษณ์"],"a":2,"e":"นภวรรณ ตินติเวชกุล กล่าวถึง การเขียนเพื่อประชาสัมพันธ์มีวัตถุประสงค์ในการเขียน เพื่อเสนอแนวคิดของ องค์กรประการหนึ่ง ได้แก่ การเขียนเพื่อบอกกล่าวให้ทราบให้เข้าใจ เพื่อส่งข่าวสารข้อเท็จจริงไปยังกลุ่มเป้าหมาย เพื่อ นำเสนอข่าวสารขององค์กรโดยการเสดงให้เห็นรายละเอียด ขั้นตอนการปฏิบัติงาน เพื่อให้ประชาชนรับทราบและเข้าใจ"},{"n":76,"q":"กลุ่มเป้าหมายใด คือ Internal Publics ของบริษัท","o":["ประชาชนที่เข้าร่วมกิจกรรมที่บริษัทจัดขึ้น","หน่วยงานผู้ให้การสนับสนุนกิจกรรมของบริษัท","กรรมการผู้ร่วมวางแผนการตลาดให้กับบริษัท","ทีมงานวิจัยที่รับจ้างวิจัยการตลาดให้กับบริษัท"],"a":3,"e":"กลุ่มเป้าหมายในการประชาสัมพันธ์ แบ่งออกเป็น 1. กลุ่มเป้าหมายภายในองค์กร (Internal Publics) ได้แก่ กลุ่มบุคคล พนักงาน เจ้าหน้าที่ที่ทำงานอยู่ภายในองค์กร สถาบัน หรือหน่วยงาน เช่น กรรมกาผู้ร่วมวางแผนการตลาดให้กับบริษัท เป็นต้น 2. กลุ่มเป้าหมายภายนอกองค์กร (External Publics) ได้แก่ กลุ่มบุคคล ประชาชนทั่วไป ที่อยู่ภายนอกองค์กร สถาบัน หรือหน่วยงาน ทั้งประชาชนผู้มีส่วนเกี่ยวข้องกับองค์กรโดยตรง ประชาชนในชุ่มชัน และประชาชนทั่วไป"},{"n":77,"q":"การเขียนโดยมีวัตถุประสงค์ให้ผู้อ่านเปลี่ยนทัศนคติตามที่ผู้เขียนต้องการจะถ่ายทอด","o":["ข่าวแจก","บทความ","คำบรรยายประกอบภาพ","สิ่งพิมพ์โฆษณาประชาสัมพันธ์"],"a":2,"e":"วัตถุประสงค์ของบทความเพื่อการประชาสัมพันธ์ มีดังนี้ 1. เพื่อแจ้งให้ทราบ คือ บทความมักจะประกอบด้วยเนื้อหาเกี่ยวกับการให้รายละเอียด ข้อเท็จจริงเกี่ยวกับเรื่องที่เขียน อย่างชัดเจน ครบถ้วนทุกประเด็น เพื่อให้ผู้อ่านได้รับ ข้อมูลที่ต้องการสื่อสารอย่างแท้จริง 2. เพื่อโน้มน้าวใจ คือ บทความมีความตั้งใจที่จะให้ผู้อ่านเปลี่ยนทัศนคติตามที่ผู้เขียนต้องการจะถ่ายทอด ซึ่งการที่จะ บรรลุผลเช่นนี้ได้นั้น นอกจากที่ผู้เขียนจะให้รายละเอียดข้อมูลด้าน ต่าง ๆ แล้ว จำเป็นอย่างยิ่งที่จะต้องหาหลักฐานมาใช้ อ้างอิงประกอบการเขียนให้มากพอสมควร หำเหตุผลที่มาสนับสนุนเทคนิคสำหรับการเขียนว่า ต้องการโน้มน้าวใจเรื่อง ใดให้ผู้อ่านตระหนักถึงผลดีและผลเสียที่จะเกิดขึ้น ผ่านการใช้ภาษาที่ต้องกระตุ้นอารมณ์ด้วยเหตุผลนานาประการ"},{"n":78,"q":"เอกสารเพื่อถ่ายทอดข้อมูลผ่านหนังสือพิมพ์ที่เผยแพร่ไปได้อย่างกว้างขวาง","o":["ข่าวแจก","บทความ","คำบรรยายประกอบภาพ","สิ่งพิมพ์โฆษณาประชาสัมพันธ์"],"a":1,"e":"ข่าวแจก (Press Release หรือ News Release) หมายถึง ข่าวเพื่อการประชาสัมพันธ์ที่นักประชาสัมพันธ์ใช้ในการ ถ่ายทอดข้อมูลต่าง ๆ ขององค์กร เพื่อเยแพร่ไป ยังประชาชนกลุ่มเป้าหมาย โดยผ่านสื่อหรือช่องทาง ( Channel) ต่าง ๆ ตามความเหมาะสมโดยนักประชาสัมพันธ์อาจส่งข่าวแจกนี้เพื่อประชาสัมพันธ์ผ่านหนังสือพิมพ์ที่สามารถเผยแพร่ไปได้ อย่างกว้างขวางมากกว่าสื่ออื่น ๆ เนื่องจากนิตยสาร วิทยุกระจายเสียง โทรทัศน์ เป็นสื่อ ที่กลุ่มเป้าหมายเลือกรับ และ ค่อนข้างเป็นสื่อที่เฉพาะเจาะจง จึงแตกต่างจากหนังสือพิมพ์ที่มีประชาชนโดยทั่วไปอ่าน"},{"n":79,"q":"หลักเกณฑ์ในการเขียนข่าวแจก ควรบรรจุเนื้อหาที่ใช้หลักการเขียน 5W1H ไว้ที่ส่วนใด","o":["พาดหัวข่าว","ความน้า","เนื้อหาข่าว","ส่วนสรุปท้ายข่าว"],"a":3,"e":"เนื้อหาข่าว (Body) เป็นส่วนที่บรรจุเนื้อหารายละเอียดของข่าวทั้งหมด โดยตอบคำถาม 5W1H ได้อย่างครบถ้วน"},{"n":80,"q":"บทความประเภทใดที่ผู้เขียนต้องใช้ทักษะการจับประเด็นและเลือกสรรประเด็น เพื่อการนำเสนอ จากการ พูดคุยที่น่าสนใจ","o":["บทความสารคดี","บทความบรรยาย","บทความสัมภาษณ์","บทความวิจารณ์"],"a":3,"e":"บทความสัมภาษณ์ คือ บทความที่ยกคำสัมภาษณ์ของบุคคลมาเขียนเผยแพร่ โดยที่คำสัมภาษณ์อาจเป็นการให้ ข้อมูลเกี่ยวกับบุคคลที่น่าสนใจหรือเหตุการณ์ใหม่ ๆ โครงการใหม่ ๆรวมถึงเป็นการให้รายละเอียดเรื่องหนึ่งเรื่องใดก็ได้ ซึ่งบทความสัมภาษณ์นี้ใช้ได้ในกรณีที่ต้องการแนะนำบุคคล เหตุการณ์ สถานที่ และใช้ในกรณีที่ชี้แจงรายละเอียดให้ ข้อมูลเพิ่มเติมโดยนำไปใช้ได้ทั้งงานประชาสัมพันธ์ภายในและภายนอกองค์กร ทั้งนี้ผู้เขียนสามารถสอดแทรกความ คิดเห็นผสานกับข้อความสัมภาษณ์ เพื่อให้บทความมีชีวิตชีวามากขึ้น และผู้เขียนจำเป็นอย่างยิ่งที่จะต้องมีทักษะในการ จับประเด็นของข้อมูลที่ได้รับจากการสัมภาษณ์ได้อย่างครบถ้วนรวมทั้งเลือกสรรประเด็นในการนำเสนอที่น่าสนใจ"},{"n":81,"q":"ข้อดีของการประชาสัมพันธ์องค์กรผ่านเครือข่ายสังคมออนไลน์ ยกเว้นข้อใด","o":["เกิดการเชื่อมโยงระหว่างกลุ่มเพื่อนหลายรูปแบบ","ทุกคนสามารถเข้ามาดูหรือติดต่อได้โดยไม่จำกัด","สามารถเข้าถึงได้อย่างรวดเร็วทุกเวลา","ชุมชนออนไลน์มีนโยบายความเป็นส่วนตัวที่ชัดเจน"],"a":2,"e":"การประชาสัมพันธ์ผ่านเครือข่ายสังคมออนไลน์ ( Online Social Networking) หรือชุมชนออนไลน์ เป็นช่อง ทางการสื่อสารที่ได้รับความนิยมมากในปัจจุ บัน โดยเริ่มต้นจากการสร้างพื้นที่เพื่อเป็นที่ชุมนุมของกลุ่มคนที่มีความ สนใจหรือความต้องการคล้าย ๆ กัน ทั้งนี้ชุมชนออนไลน์ส่วนใหญ่จะมีนโยบายความเป็นส่วนตัวที่ชัดเจน ซึ่งผู้ใช้บริการ สามารถกำหนดได้ว่า จะให้สมาชิกคนใดเข้ามาดูหรือติดต่อกับตนเองได้ จึงช่วยให้เกิดการเชื่อมโยงระหว่างกลุ่มเพื่อน ในหลายรูปแบบ และเกิดปฏิสัมพันธ์สม ่าเสมอต่อเนื่องจนกลายเป็นสังคมบนโลกออนไลน์ซึ่งทุกคนสามารถเข้าถึงได้ อย่างรวดเร็ว ทุกเวลา ทุกสถานที่อย่างไม่มีขีดจำกัด อีกทั้งยังสามารถสร้างการใช้งานได้หลายรูปแบบทั้งการเขียน ข้อความ เรื่องราว แบ่งปัน รูปภาพ ภาพเคลื่อนไหวโดยการนำเนื้อหาจากสื่อต่าง ๆ มาแชร์ (Share) จะช่วยทำให้ข้อมูล กระจายออกไปในวงกว้างได้อย่างรวดเร็ว"},{"n":82,"q":"หากนักประชาสัมพันธ์วางแผนจะประชาสัมพันธ์ผ่านไฟล์มัลติมีเดียที่มุ่งหวังให้คนเข้าชมได้หลาย ครั้งและเข้าชมได้ตลอดเวลา ควรประชาสัมพันธ์ผ่านสื่อออนไลน์ประเภทใด","o":["Twitter (X)","YouTube","Facebook","Instagram"],"a":2,"e":"การประชาสัมพันธ์ผ่านการฝากและแบ่งปันไฟล์ประเภทมัลติมีเดีย ( Multimedia) คือ การประชาสัมพันธ์ผ่าน เว็บที่เปิดบริการรับฝากหรือแบ่งปันไฟล์ประเภทต่าง ๆ เช่น ภาพคลิป ภาพยนตร์ เพลง โดยเว็บที่นิยมใช้กันมากที่สุด คือ ยูทูบ (YouTube) ซึ่งสามารถเข้าชมได้หลายครั้งเท่าที่ต้องการและเข้าชมได้ตลอดเวลา ทั้งนี้องค์กรต่าง ๆ ได้นำรายการ หรือเนื้อหา ที่เคยแพร่ภาพทางโทรทัศน์หรือในเว็บไซต์ขององค์กรมาเผยแพร่ซ ้าอีกบนยูทูบ โดยปรับเนื้อหาและรูปแบบ ให้เหมาะสม ทั้งยังสามารถสร้างกลุ่มผู้ติดตามในช่องยูทูบนั้น ๆ ได้ตามความสนใจ"},{"n":83,"q":"หากบริษัทต้องการประชาสัมพันธ์ข่าวสารเกี่ยวกับการส่งเสริมการขาย การจัดกิจกรรมพิเศษด้วย ข้อความ สั้นไม่เกิน 280 ตัวอักษร ควรเลือกสื่อออนไลน์ประเภทใด","o":["Twitter (X)","YouTube","Facebook","Instagram"],"a":1,"e":"การเขียนเพื่อการประชาสัมพันธ์ผ่านทาง Twitter หรือ X แต่เดิมกำหนดให้พิมพ์ข้อมูลได้ไม่เกิน 140 ตัวอักษร (ปัจจุบันเปลี่ยนให้ใช้ได้ไม่เกิน 280 ตัวอักษร) ดังนั้นข้อความที่ส่งจึงต้องเน้นความสั้น กระชับ ชัดเจนยิ่งกว่าช่องทางอื่น ๆ โดยผู้เขียนต้องเลือกใช้ตัวอักษรและข้อความให้เหมาะสม เพื่อสามารถสื่อสารได้ตามต้องการ ทั้งนี้ Twitter (X) จะ เหมาะกับการส่งข่าวสารองค์กรที่เกี่ยวกับการส่งเสริมการขาย การนำเสนอสินค้าใหม่การจัดกิจกรรมพิเศษ การแนะนำ เหตุการณ์หรือ Event ที่น่าสนใจ การตอบคำถามหรือแก้ไข ข้อสงสัย ข้อข้องใจ การชวนให้ มาร่วมกิจกรรม โดยเน้น เนื้อหาที่เป็นเรื่องน่ารู้ เป็นประโยชน์ต่อผู้ติดตาม เพื่อให้เกิดการบอกต่อด้วยการ Retweet"},{"n":84,"q":"หากมหาวิทยาลัยต้องการประชาสัมพันธ์กำหนดการลงทะเบียนให้นักศึกษาทราบอย่างทั่วถึงที่สุด และสามารถตอบคำถามได้ทันทวงที่ 1 หาวิทยาลัยควรเลือกใช้สื่อออนไลน์ประเภทใด","o":["Twitter (X)","YouTube","Facebook","Instagram"],"a":3,"e":"การสื่อสารผ่านสื่อสังคมออนไลน์ที่ได้รับความนิยมมากที่สุด คือ เฟซบุ๊ก (Facebook) ซึ่งนักประชาสัมพันธ์ สามารถนำเฟซบุ๊กมาใช้ประชาสัมพันธ์ผ่านรูปแบบเฟซบุ๊กแฟนเพจ ซึ่งเปรียบเสมือนหน้าตาของบริษัท ด้วยการบริหาร จัดการเนื้อหาและปฏิสัมพันธ์ที่เกิดขึ้นระหว่างองค์กรกับกลุ่มเป้าหมาย และยังสามารถเลือกใช้เครือข่ายสังคมออนไลน์ อื่น ๆเข้ามาผสมผสานและเสริมซึ่งกันและกันด้วยระบบการเชื่อมโยงระหว่างเครือข่าย เช่น การใช้เฟซบุ๊กรวมไปกับการ แชร์คลิปภาพจากยูทูปหรือข้อมูลจากลิงก์ต่าง ๆ การถ่ายทอดสดการออกอากาศรายการผ่านเฟซบุ๊ก ไลฟ์ เพื่อเปิดโอกาส ให้ผู้ชมได้มีปฏิสัมพันธ์ในแบบเรียลไทม์ผ่านการแสดงความคิดเห็น และสามารถตอบประเด็นข้อคำถามได้ทันท่วงที"},{"n":85,"q":"ข้อใดคือเป้าหมายสำคัญที่สุดของการโฆษณา","o":["การสร้างความนิยมในกลุ่มผู้บริโภค","การสร้างผลประกอบการให้มีกำไร","การส่งสารถึงมวลชน","การเผยแพร่สินค้าให้เป็นที่รู้จักอย่างทั่วถึง"],"a":2,"e":"การเขียนโฆษณา เป็นการนำเสนอ เผยแพร่สินค้าหรือบริการ เป็นกิจกรรมที่มีการ สื่อสารสู่มวลขน เพื่อให้มีผู้นิยม โดยมีกำไรในสินค้าเป็นเป้าหมายสำคัญที่สุด"},{"n":86,"q":"ส่วนพาดหัวของโปสเตอร์ คือจุดมุ่งหมายใด","o":["Attention","Interest","Desire","Action"],"a":1,"e":"โปสเตอร์เพื่อการโฆษณามีจุดมุ่งหมาย คือ AIDA ซึ่งประกอบด้วย 1. เพื่อก่อให้เกิดความสะดุดใจ (Attention) สามารถหยุดผู้บริโภคได้ด้วยข้อความพาดหัวหรือหัวเรื่องโฆษณา 2. เพื่อกระตุ้นความสนใจ (Interest) ซึ่งความสนใจของผู้บริโภคจะเกิดขึ้นหลังจากที่โฆษณา ตึงดูดความสนใจไว้ได้ และผู้บริโภคจะพยายามหาคำตอบ ได้แก่ ข้อความบอกรายละเอียด ถึงประโยชน์และคุณสมบัติที่ผู้บริโภคจะได้รับจาก การซื้อสินค้า 3. เพื่อสร้างความปรารถนา ( Desire) โดยใช้ภาษามาสร้างแรงกระตุ้น โน้มน้าวใจผู้บริโภค ด้วยเหตุผล และการเร้า อารมณ์ ได้แก่ ข้อความลงท้าย 4. เพื่อให้เกิดการปฏิบัติ (Action) โดยใช้ภาษาที่สร้างความประทับใจ จดจำง่าย ได้แก่คำขวัญโฆษณา"},{"n":87,"q":"หากนักศึกษาอยากจะทราบว่าสินค้าที่กำลังจะซื้อนั้นมีคุณสมบัติพิเศษอย่างไรบ้าง ซื้อไปแล้วคุ้มค่า หรือไม่มีประโยชน์อย่างไร ต้องดูจากรายละเอียดข้อใด","o":["รูปภาพ","พาดหัว","เนื้อหา","ข้อความลงท้าย"],"a":3,"e":"ข้อความบอกรายละเอียด (Body Text) เป็นส่วนของเนื้อหา สำหรับสินค้าใหม่ที่ประชาชนยังไม่เข้าใจประโยชน์ ว่า ใช้ทำอะไร ใช้อย่างไร หรือรู้จักแล้ว แต่การโฆษณาต้องการเน้นถึงประโยชน์เพื่อการจูงใจซื้อ จึงควรชี้ให้เห็นว่า สินค้านี้มีประโยชน์อย่างไร คุ้มค่าอย่างไร ส่วนประโยชน์อื่น ๆ หรือรายละเอียดเกี่ยวกับสินค้านั้น ถ้ามีคุณสมบัติพิเศษ การเขียนข้อความควรมิรายละเอียดส่วนนี้เอาไว้ด้วย เพื่อสร้างความสนใจเป็นพิเศษแก่ผู้อ่าน"},{"n":88,"q":"ข้อความโฆษณา \"โดโซะ คำดี ๆ มีดีได้ทุกวัน\" มีการโฆษณาที่โดดเด่นในด้านใด","o":["ใช้สำนวนที่น่าสนใจ จดจำได้ง่าย","ข้อความกะทัดรัด สละสลวย","อ่านง่าย","ข้อความไม่เกินความจริง"],"a":1,"e":"การใช้ภาษาเพื่อการเขียนโฆษณา มีดังนี้ 1. ใช้สำนวนที่น่าสนใจ จดจำได้ง่าย เช่น โดโซะ คำดี ๆ มีดีได้ทุกวัน, อะไรดี….บุ๋มก็ว่าดี ฯลฯ 2. ใช้ข้อความที่กะทัดรัด สละสลวย เพื่อให้สื่อเรื่องได้ตรงตามวัตถุประสงค์และเข้าใจง่าย 3. เขียนอักษรให้อ่านง่าย เขียนสะกดการันต์เพื่อความถูกต้อง 4. ใช้ภาษาที่บ่งบอกให้รู้ว่า สินค้าที่นำเสนอคืออะไร ใช้ประโยชน์อะไร ทำไมถึงต้องใช้ 5. ไม่เขียนข้อความเกินความจริง และไม่ใส่ร้ายสินค้าชนิดอื่น ๆ"},{"n":89,"q":"สื่อใดเหมาะสมกับการนำเสนอเนื้อหาที่ไม่ให้รายละเอียดปลีกย่อยมาก มีภาพหน้าปกและชื่อเรื่องที่ ต้องเด่นชัดและสื่อความหมายได้ทันที","o":["แผ่นพับ","แผ่นปลิว","โปสเตอร์","แค็ตตาล็อก"],"a":1,"e":"แผ่นพับ หมายถึง กระดาษแผ่นเดียวที่พับแล้วจะมีขนาด 4 x 9 นิ้ว เนื้อที่กระดาษ ค่อนข้างจำกัด จึงบรรจุเนื้อความ ได้น้อย ส่วนที่ให้ข้อมูลจะอยู่ด้านใน ภาพหน้าปกและชื่อเรื่องจะต้องเด่นชัดและสื่อความหมายได้ทันที เนื้อหาต้องไม่ให้ รายละเอียดปลีกย่อยมาก เลือกเสนอเนื้อหาเฉพาะประเด็นสำคัญ โดยใช้ถ้อยคำเรียบง่าย สั้น กระชับ และสื่อความหมาย ได้อย่างตรงไปตรงมา"},{"n":90,"q":"การโฆษณาที่มุ่งบ่งบอกคุณสมบัติของสินค้า บอกรุ่น และราคา จะปรากฏในสื่อโฆษณาใด","o":["แผ่นพับ","แผ่นปลิว","โปสเตอร์","แค็ตตาล็อก"],"a":4,"e":"แค็ตตาล็อก หมายถึง หนังสือ หรือเอกสาร สิ่งพิมพ์ที่มีภาพสินค้า เช่น เสื้อผ้า เครื่องใช้ไฟฟ้า พร้อมรายละเอียด ของสินค้าเพื่อเผยแพร่หรือให้ลูกค้าเลือกซื้อ นิยมใช้ภาพ สีสันสวยงาม มีคำอธิบายประกอบพอสมควร ใช้ภาษาสั้น ๆ ตรงไปตรงมา มีการเขียนบอก คุณสมบัติของสินค้า บอกรุ่น แล ะราคา ตลอดจนให้สถานที่ในการติดต่อสั่งซื้อหรือ สอบถามรายละเอียดเพิ่มเติม"},{"n":91,"q":"หากนักศึกษาจะซื้อชั้นวางหนังสือ เพื่อจะนำไปใช้ในห้องพักของตนเอง นักศึกษาควรต้องเลือกดู จากสื่อใดเป็นเบื้องต้น","o":["แผ่นพับ","แผ่นปลิว","โปสเตอร์","แค็ตตาล็อก"],"a":4,"e":"ดูบรรยายเพิ่มเติมข้อ 90. ประกอบ"},{"n":92,"q":"ข้อใดคือลักษณะของแผ่นพับที่ถูกต้อง","o":["มีภาพประกอบและคำอธิบายอย่างละเอียด","มีเนื้อหาที่สำคัญ ประเด็นสั้นกระชับ","ทำจากกระดาษขนาดใดก็ได้ พับเป็นสามช่วง","สามารถบรรจุข้อมูลได้มากและครบถ้วน"],"a":2,"e":"ดูบรรยายเพิ่มเติมข้อ 89. ประกอบ"},{"n":93,"q":"ข้อใดมิใช่การพูดที่ดี","o":["พูดมีสาระ","พูดน่าฟัง","พูดตามที่คิด","พูดมีประโยชน์"],"a":3,"e":"วัตถุประสงค์ของการเรียนวิชาการพูดประการหนึ่ง ได้แก่ เพื่อสร้างมนุษย์สัมพันธ์คือ การพูดดี พูดมีประโยชน์ พูดน่าฟัง ยอมทำให้ผู้พูดเป็นที่รักและมีมิตรมาก นอกจากนี้การพูด ที่ดียังมีส่วนช่วยคลี่คลายปัญหาความขัดแย้งต่าง ๆ ได้อีกด้วย"},{"n":94,"q":"การประชุม จัดเป็นการพูดแบบใด","o":["การพูดระหว่างบุคคล","การพูดในกลุ่ม","การพูดในที่ชุมนุมชน","การพูดทางสื่อสารมวลชน"],"a":2,"e":"การพูดในกลุ่ม เป็นการพูดที่มีบุคคลเข้าร่วมพูดกันตั้งแต่ 3 คนขึ้นไปจำนวนบุคคลที่พูดในกลุ่มจะสูงสุดเท่าใดยาก ที่จะกำหนดได้ ขึ้นอยู่กับโอกาส สถานที่ และเครื่องอำนวยความสะดวกที่ทำให้การพูดจากันของบุคคลกลุ่มนั้นดำเนิน ไปได้ ซึ่งการพูดในกลุ่มนี้อาจจะเรียกอีกอย่างว่า \"การอภิปรายกลุ่ม\" มักเป็นการพูดจากันในเชิงปรึกษาหารือเพื่อหาทาง แก้ปัญหาร่วมกัน บางทีก็มีการโต้แย้งถกเถียงกันบ้าง แต่บางทีก็เป็นการประชุมที่มีการแลกเปลี่ยนความรู้ ความคิด และ ประสบการณ์ของกันและกัน ทุกคนที่ร่วมอยู่ในกลุ่มผลัดเปลี่ยนกันเป็นผู้พูดและผู้ฟัง อาจจะมีประธานของกลุ่มหรือไม่ มีก็ได้"},{"n":95,"q":"การกล่าวคำปราศรัยในที่สาธารณะ จัดเป็นการพูดแบบใด","o":["การพูดระหว่างบุคคล","การพูดในกลุ่ม","การพูดในที่ชุมนุมชน","การพูดทางสื่อสารมวลชน"],"a":3,"e":"การพูดในที่ชุมนุมชน เป็นการพูดหน้าที่ประชุม อาจเป็นเพียงคนเดียวหรืออาจร่วมคณะกับคนอื่นก็ได้ โดยจะเป็น การพูดกับกลุ่มผู้ฟังที่มีจำนวนมาก ซึ่งจำนวนผู้ฟังจะมาก น้อยเพียงไรขึ้นอยู่กับโอกาส กาลเทศะ และเงื่อนไขต่าง ๆ ทั้งนี้ การพูดในที่ชุมนุมชนแบ่งได้ชัดเจนว่า ใครเป็นผู้พูดหลัก และใครเป็นผู้ฟัง เช่น การปาฐกถา การอภิปรายในที่สาธารณะ การโฆษณาหาเสียง การปราศรัย การกล่าวต้อนรับ การบรรยายสรุป การชี้แจงต่อที่ประชุมและการพูดในโอกาสพิเศษ ต่าง ๆ ต่อหน้าที่ประชุม (เช่น การกล่าวสุนทรพจน์ในพิธีเปิดงาน)"},{"n":96,"q":"การพูดในข้อใดที่ผู้พูดไม่เห็นผู้ฟัง","o":["การพูดระหว่างบุคคล","การพูดในกลุ่ม","การพูดในที่ชุมนุมชน","การพูดทางสื่อสารมวลชน"],"a":4,"e":"การพูดทางสื่อสารมวลชนจะแตกต่างจากการพูดระดับอื่น ๆ ในข้อที่สำคัญที่สุด คือ สามารถพูดให้คนฟังจำนวน มากที่กระจายกันอยู่ทุกทิศทางรับฟังพร้อมกันได้ในเวลาเดียวกัน แต่การพูดทางสื่อสารมวลขนนั้น ผู้พูดไม่สามารถ สังเกตปฏิกิริยาตอบสนองจากผู้ฟังพร้อมกันได้ในขณะที่พูด ทั้งนี้เนื้อหาของการพูดมักจะเป็นการให้ข่าวสาร ให้ความรู้ ให้ข้อคิดให้ความบันเทิง การโฆษณาสินค้า และการบริการต่าง ๆ โดยการพูดทางสื่อสารมวลชนที่ใช้มากที่สุด คือ การ พูดทางโทรทัศน์ ซึ่งบุคคลที่พูดทางสื่อสารมวลชนมี 2 ประเภทใหญ่ ๆ ดังนี้ 1. ผู้ที่มีอาชีพเป็นผู้ประกาศและผู้จัดรายการ ซึ่งพูดอยู่เป็นประจำ บุคคลเหล่านี้ถือว่าประกอบวิชาชีพโดยตรง 2. ผู้ที่ได้รับเชิญให้มาพูดในรายการต่าง ๆ เป็นครั้งคราว และบุคคลในวงการต่าง ๆ ที่มีโอกาสได้รับเชิญให้ไปปรากฏ ตัวทางโทรทัศน์อยู่เนือง ๆ เช่น การที่ดาราจัดแถลงข่าวผ่านโทรทัศน์เพื่อขี้แจงประเด็นร้อนที่ประชาชนสนใจ ฯลฯ"},{"n":97,"q":"การที่ดาราจัดแถลงข่าวผ่านโทรทัศน์ จัดเป็นการพูดประเภทใด","o":["การพูดระหว่างบุคคล","การพูดในกลุ่ม","การพูดในที่ชุมนุมชน","การพูดทางสื่อสารมวลชน"],"a":4,"e":"ดูบรรยายเพิ่มเติมข้อ 96. ประกอบ"},{"n":98,"q":"การบรรยายโดยทั่วไป นิยมใช้การพูดแบบใด","o":["การพูดโดยมีการเตรียมตัวล่วงหน้า","การพูดโดยการท่องจำ","การพูดโดยฉับพลัน","การพูดโดยอ่านจากต้นฉบับ"],"a":1,"e":"การพูดโดยมีการเตรียมตัวล่วงหน้า เป็นการพูดที่ผู้พูดจะพูดจากความเข้าใจเนื้อหาที่ต้องการถ่ายทอดให้แก่ผู้ฟัง โดยผู้พูดจะต้องศึกษาค้นคว้าและเตรียมตัวล่วงหน้ามาเป็นอย่างดี จึงเป็นวิธีที่เหมาะสมที่สุดกับการพูดในแทบทุกโอกาส และเป็นที่นิยมใช้กันมาก เพราะทำให้ผู้พูดไม่สับสน มีการเรียงลำดับเรื่องว่าจะพูดอะไรก่อนหลัง ไม่ทำให้การพูดวกวน ตัวอย่างของการพูดชนิดนี้ ได้แก่ การบรรยาย- การอภิปราย เป็นต้น"},{"n":99,"q":"ข้อใดแสดงให้เห็นว่า ผู้พูดมีความสุขที่ได้ถ่ายทอดความรู้ให้ผู้อื่น","o":["เป็นนักฟังที่ดี","ศึกษาหาความรู้อยู่เสมอ","ไม่หวงความรู้","ยอมรับฟังคำวิจารณ์"],"a":3,"e":"คุณสมบัติที่สำคัญเบื้องต้นของนักพูดที่ดีมีอยู่ 5 ประการ ดังนี้ 1. เป็นนักฟังที่ดี 4. เป็นตัวของตัวเอง 2. ศึกษาหาความรู้อยู่เสมอ 5. มีความสุขในการถ่ายทอดความรู้ให้ผู้อื่น ไม่หวงความรู้ 3. อ่อนน้อมถ่อมตน ยอมรับฟังคำวิจารณ์"},{"n":100,"q":"ข้อใดเป็นการพูดไม่สอดคล้องกับเนื้อหา ซึ่งผู้พูดควรระวัง","o":["พูดคำคมสุภาษิต","พูดอธิบายให้เห็นภาพ","พูดเรื่องส่วนตัว","พูดยกตัวอย่าง"],"a":3,"e":"มารยาทในการพูด มีดังนี้ 1. ผู้พูดต้องพูดให้สอดคล้องกับเนื้อหาที่จะพูด ไม่พูดเรื่องส่วนตัวหากไม่มีใครซักถามและควรลำดับเนื้อหาในการพูด มาเป็นอย่างดี 2. ผู้พูดต้องให้เกียร์ผู้ฟัง ไม่แสดงความอวดรู้ ไม่กล่าวโทษ หรือไม่แสดงอาการดูถูกเยาะเย้ยถากถางผู้ฟัง 3. ผู้พูดที่ดีควรมีความอ่อนน้อมถ่อมตน เปิดใจรับฟังความคิดเห็นของผู้อื่น 4. ผู้พูดต้องไม่กล่าวร้ายกระทบกระเทียบใคร หรือพูดอะไรที่สร้างความเสียหายให้กับผู้อื่น ฯลฯ"},{"n":101,"q":"การพูดแบบกลอนสด หมายถึงข้อใด","o":["การพูดโดยฉับพลัน","การพูดโดยมีการเตรียมตัวล่วงหน้า","การพูดโดยการท่องจำ","การพูดโดยอ่านจากต้นฉบับ"],"a":1,"e":"การพูดโดยฉับพลัน หรือการพูดโดยไม่มีการเตรียมการล่วงหน้า เป็นการพูดแบบ ปัจจุบันทันด่วน ไม่ได้เตรียมตัว มาก่อน ผู้พูดจำเป็นต้องอาศัยปฏิภาณไหวพริบ ประสบการณ์และความรู้ความชำนาญในการพูดหรือโต้ตอบในเวลา รวดเร็ว จึงมักมีผู้เรียกการพูดชนิดนี้ว่า \"การพูดแบบกลอนสด/การพูดแบบกะทันหัน\" ทั้งนี้การพูดโดยฉับพลันมักเป็น การพูดสั้น ๆเช่น การกล่าวอวยพร การกล่าวตอบขอบคุณ การพูดในงานรื่นเริง ในงานสังสรรค์ การตอบ ปัญหาบาง ประการ การแสดงความคิดเห็น หรือให้ข้อคิดเล็ก ๆ น้อย ๆ เพื่อแก้ปัญหา ฯลฯ"},{"n":102,"q":"ผู้ฟังวัยใดที่จะสนใจเกี่ยวกับความปลอดภัยในชีวิตทรัพย์สินและสวัสดิภาพของครอบครัวเป็น พิเศษ","o":["วัยเด็ก","วัยกลางคน","วัยรุ่น","วัยชรา"],"a":4,"e":"วัยชรา เป็นวัยที่ผ่านชีวิตมามาก มีประสบการณ์สูง ชอบหาสิ่งยึดเหนี่ยวจิตใจ มีความคิดแบบอนุรักษนิยม เชื่อใน สิ่งที่ปฏิบัติได้จริง มีความระแวดระวัง เนื่องจากผู้สูงอายุผ่านชีวิตมามาก โอกาสที่จะโน้มน้าวให้เปลี่ยนแปลงความคิด ความเชื่อจะน้อยลง เพราะมักจะ ยึดติดกับความเชื่อเดิม ดังนั้นการพูดกับคนในวัยนี้จึงควรพูดเรื่องความปลอดภัยในชีวิต และทรัพย์สิน, การรักษาพยาบาล, สวัสดิภาพทางครอบครัวและจิตใจ เป็นต้น"},{"n":103,"q":"ข้อใดตรงกับประโยคที่ว่า \"การฟังเป็นการเปิดโลก\" ที่สุด","o":["การฟังช่วยให้ได้เรียนรู้ในสิ่งที่ไม่เคยรู้","การฟังช่วยให้ได้รับความรู้ที่เป็นประโยชน์","การฟังมีส่วนช่วยพักผ่อนหย่อนใจ","การฟังมีส่วนช่วยสร้างมนุษย์สัมพันธ์"],"a":1,"e":"ความสำคัญของการฟังประการหนึ่ง ได้แก่ การฟังเป็นการเปิดโลก คือ การฟังช่วยให้เป็นคนใจกว้าง รู้จักยอมรับ ฟังความคิดเห็นหรือวัฒนธรรมที่แตกต่าง ช่วยให้ได้เรียนรู้ในสิ่งที่ไม่เคยรู้ และทำให้เป็นคนที่มีเหตุมีผล"},{"n":104,"q":"ปัจจัยในการวิเคราะห์ผู้ฟังข้อใดที่เป็นเรื่องละเอียดอ่อน ซึ่งผู้พูดควรต้องระวังที่สุด","o":["เพศ","อายุ","การศึกษา","ศาสนา"],"a":4,"e":"การนับถือศาสนา ความเชื่อ และวัฒนธรรม เป็นสิ่งที่คนเรายึดถือมาตั้งแต่ในอดีต ดังนั้นผู้พูดจึงต้องใช้ความ ระมัดระวังที่สุด อย่าพูดในทำนองดูหมื่น เหยียดหยาม หรือไม่เห็นด้วยกับศาสนาและความเชื่อต่าง ๆ เพราะถือเป็นเรื่อง ละเอียดอ่อน ซึ่งอาจจะก่อให้เกิดความไม่พอใจ หรือความขัดแย้ง และทำให้การพูดไม่ประสบความสำเร็จ"},{"n":105,"q":"คำกล่าวในพิธีเปิดงานเนื่องในสัปดาห์วิทยาศาสตร์แห่งชาติ ควรใช้การพูดแบบใด","o":["การพูดโดยท่องจำ","การพูดโดยฉับพลัน","การพูดโดยอ่านจากต้นฉบับ","การพูดโดยมีการเตรียมตัวล่วงหน้า"],"a":3,"e":"การพูดโดยอ่านจากร่างหรือต้นฉบับ คือ การพูดในลักษณะที่เป็นการอ่านจากร่างหรือต้นฉบับที่จัดเตรียมไว้ ล่วงหน้าโดยไม่มีการเปลี่ยนแปลงข้อความแต่อย่างใด และผู้พูดไม่จำเป็นต้องคิดหาถ้อยคำใดมาใช้ นิยมใช้ในการพูดที่ ต้องการความระมัดระวังเกี่ยวกับการใช้ถ้อยคำแต่ละคำเป็นพิเศษ โดยเฉพาะในโอกาสที่เป็นพิธีการ เช่น กระแสพระราช ดำรัสของพระบาทสมเด็จพระเจ้าอยู่หัวในพระราชพิธีต่าง ๆ, คำปราศรัยของบุคคลสำคัญ, คำกล่าวใน พิธีเปิดงาน, คำ กล่าวในพิธีเปิดและปิดการประชุม, คำแถลงการณ์ของรัฐบาล เป็นต้น"},{"n":106,"q":"การพูดในข้อใดมีอิสระมากกว่าข้ออื่น","o":["การพูดระหว่างบุคคล","การพูดในที่ชุมชน","การพูดในกลุ่ม","การพูดทางสื่อสารมวลชน"],"a":1,"e":"การพูดระหว่างบุคคล เป็นการพูดขั้นพื้นฐานที่สุดของสังคมมนุษย์ไม่ว่าจะมีฐานะอาชีพ หรือหน้าที่การงาน อย่างไรก็ตาม จำเป็นต้องใช้การพูดในระดับนี้อยู่ตลอดเวลา โดยมีลักษณะสำคัญ คือ ไม่มีข้อจำกัดว่าแต่ละช่วงของการ พูดจะต้องใช้เวลามากน้อยเท่าไร ขึ้นอยู่กับกาลเทศะและความเหมาะสม ดังนั้นจึงเป็นการพูดที่มีอิสระและมีความ ยืดหยุ่นด้านเวลาสูง เช่น การทักทาย การถามสารทุกข์สุขดิบ การสนทนา การถกเถียง การปรึกษาหารือ ฯลฯ"},{"n":107,"q":"ในโอกาสกล่าวคำสดุดี หรือคำปราศรัยในงานบันเทิงต่าง ๆ ควรใช้การพูดแบบใด","o":["การพูดเพื่อจูงใจ","การพูดเพื่อบอกให้รู้","การพูดจรรโลงใจ","การพูดเพื่อสร้างแรงบันดาลใจ"],"a":3,"e":"การพูดจรรโลงใจ เป็นการพูดเพื่อความบันเทิง และให้ผู้ฟังเกิดความรู้สึกสนุกสนาน ผ่อนคลายความตึงเครียดจาก สถานการณ์ต่าง ๆ ที่ประสบพบเจอในชีวิตประจำวัน จึงเป็นการ พูดที่ใช้ได้ในหลายโอกาสที่มีการพบปะสั งสรรค์ เช่น การพูดในงานชุมนุมสโมสร หรือสมาคม ต่าง ๆ, งานรื่นเริง, การกล่าวคำสดุดี หรือคำปราศรัยในงานบันเทิงต่าง ๆ, การ พูดหลังอาหารเรื่องเกี่ยวกับสถานที่ท่องเที่ยวต่าง'ๆ หรือประสบการณ์ที่น่าสนใจ เป็นต้น"},{"n":108,"q":"เวลาใดที่ผู้พูดจะให้ความสนใจต่อการพูดมากที่สุด","o":["เช้า","กลางวัน","บ่าย","เย็น"],"a":1,"e":"ผู้พูดต้องวิเคราะห์ว่าจะพูดในช่วงเวลาใด และจะใช้เวลาพูดนานแค่ไหนเพราะการวิเคราะห์ช่วงเวลาที่พูดจะช่วย ให้ผู้พูดทราบความสนใจของผู้ฟัง เช่น ถ้าหากพูดในช่วงเช้า (08.00 - 10.00 น. ผู้ฟังจะมีความสนใจมากและมีความ ตื่นตัวในการฟังที่สุดเพราะยังกระปรี้กระเปร่า แต่หากพูดหลังอาหารกลางวัน (13.00 - 15.00 น. ผู้ฟังมักจะ ง่วงนอน ยิ่ง ถ้าห้องที่พูดนั้นไม่ได้ติดเครื่องปรับอากาศก็จะร้อนอบอ้าว ในกรณีนี้ผู้พูดไม่ควร พูดยึดเยื้อ เพราะจะทำให้ผู้ฟังเกิดความ เบื่อหน่าย ควรจะเตรียมเรื่องเบาๆ หรือสอดแทรกอารมณ์ขันเพื่อช่วยผ่อนคลายความง่วงของผู้ฟัง"},{"n":109,"q":"ข้อใดเป็นคำปฏิสันถารแบบพิธีการ","o":["เพื่อนร่วมชาติทุกท่าน","ท่านผู้อำนวยการและท่านผู้มีเกียรติทั้งหลาย","พี่น้องชาวบ้านที่รักยิ่ง","ท่านผู้ฟังที่เคารพ"],"a":2,"e":"คำทักทายหรือคำปฏิสันถารแบ่งออกเป็น 2 ประเภท ดังนี้ 1. คำปฏิสันถารที่เป็นทางการ จะใช้กับงานพิธีการต่าง ๆ เช่น งานศาสนาพิธี งานวางศิลาฤกษ์ \"งานแจกวุฒิบัตร คำ กล่าวเปิดงาน ฯลฯ จะเรียกเฉพาะตำแหน่ง เช่น \" เรียนท่านผู้อำนวยการ คุณอาจารย์ และท่านผู้มีเกียรติทั้งหลาย\" เมื่อ กล่าวคำปฏิสันถารจบแล้วจึงตามด้วยประโยค ที่ว่า \"ข้าพเจ้ารู้สึกเป็นเกียรติอย่างยิ่งที่ได้มาพูดในวันนี้\" 2. คำปฏิสันถารที่ไม่เป็นทางการ เช่น การประชุมภายในหน่วยงาน การอภิปราย คำปราศรัยคำกล่าวของนักการเมือง ฯลฯ จะมีคำแสดงความรู้สึก เช่น คำว่า \"เคารพ/นับถือ/ที่รัก\"อยู่ด้วย เช่น \"สวัสดีท่านผู้ฟังที่เคารพทุกท่าน\", \"สวัสดีพี่น้อง ขาวบ้านที่รักทั้งหลาย\" ฯลฯเมื่อกล่าวคำปฏิสันถารจบแล้วจึงตามด้วยประโยคที่ว่า \"ผม/กระผม/ดิฉัน รู้สึกเป็นเกียรติ อย่างยิ่งที่ได้มาพูดในวันนี้\" ส่วนสรรพนามที่ใช้แทนผู้ฟังต้องเป็นคำยกย่องให้เกียรติ หรือแสดงความเป็นฝ่ายเดียวกับผู้ พูด เช่น ท่าน พี่น้อง พวกเรา คุณ เพื่อน ฯลฯ"},{"n":110,"q":"หากจะพูดเรื่อง \"เที่ยวทั่วไทยจากเหนือจรดใต้\" ควรใช้การดำเนินเรื่องแบบใด","o":["ดำเนินเรื่องโดยแบ่งเนื้อเรื่องเป็นหมวดหมู่","ดำเนินเรื่องตามเหตุและผล","ดำเนินเรื่องตามลำดับสถานที่","ดำเนินเรื่องตามลำดับเวลา"],"a":3,"e":"การดำเนินเรื่องตามลำดับสถานที่ หมายถึง การพูดโดยลำดับจากจุดใกล้ตัวไปยัง จุดไกลตัว หรือจากทิศเหนือไป ทิศใต้ วิธีนี้เหมาะสำหรับการพูดนำเที่ยว การบรรยายเกี่ยวกับสถานที่ หรือการให้ความรู้ทางภูมิศาสตร์"},{"n":111,"q":"หากผู้พูดมีประสบการณ์น้อย ควรเลือกเรื่องโดยคำนึงถึงข้อใดก่อนเป็นอันดับแรก","o":["กลุ่มผู้ฟัง","ตัวผู้พูด","สถานที่","เวลา"],"a":2,"e":"หลักการเลือกเรื่องพูดประการหนึ่ง คือ เลือกเรื่องให้เหมาะสมกับตัวผู้พูด เพราะนอกจากจะเลือกเรื่องให้เหมาะกับ กลุ่มผู้ฟังแล้ว ผู้พูดควรเลือกหัวข้อที่ตนสนใจและถนัดด้วยโดยเฉพาะสำหรับผู้ทีเริ่มพูดใหม่ ๆ ที่ยังมีประสบการณ์น้อย ทั้งนี้เพื่อให้ผู้พูดมีความเชื่อมั่นใน ตัวเอง และไม่เกิดความประหม่าในขณะที่พูด ซึ่งจะช่วยให้การพูดนั้นน่าเชื่อถือยิ่งขึ้น"},{"n":112,"q":"\"เลือกตั้ง กทม. คึกคัก คนแหใช้สิทธิ์ล้นหลาม\" เป็นการขึ้นต้นคำนำแบบใด","o":["แบบตั้งคำถาม","แบบยกบทกวีหรือคำคม","แบบทำให้ผู้ฟังสงสัย","แบบพาดหัวข่าว"],"a":4,"e":"หลักการขึ้นต้นคำนำประการหนึ่ง คือ ขึ้นต้นแบบพาดหัวข่าว ซึ่งใช้วิธีเดียวกับการพาดหัวข่าวหนังสือพิมพ์ เพื่อดึงดูด ความสนใจของผู้อ่าน โดยเอาผลมาพูดก่อนแล้วจึงอธิบายทีหลัง เช่น \"เลือกตั้ง กทม. คึกคัก คนแห่ใช้สิทธิ์ล้นหลาม\""},{"n":113,"q":"ข้อใดเป็นการสื่อสารทางเดียว","o":["การสนทนา","การสัมภาษณ์","ปาฐกถา","การอภิปราย"],"a":3,"e":"พจนานุกรมฉบับราชบัณฑิตยสถาน พุทธศักราช 2542 ได้อธิบายความหมายของปาฐกถาไว้ว่า ถ้อยคำหรือเรื่องราว ที่บรรยายในที่ชุมชน เป็นต้น หรือกล่าวโดยทั่ว ๆ ไปได้ว่า \"ปาฐกถา\" คือ การพูดต่อหน้าคนจำนวนมาก ถือเป็นการ สื่อสารทางเดียวที่ผู้แสดงปาฐกถาจะพูดตามหัวข้อที่กำหนดไว้ตั้งแต่ต้นจนจบเรื่อง แล้วจึงเปิดโอกาสให้ผู้ฟังซักถาม มัก นิยมใช้สำหรับการพูดในที่ชุมชนทั่ว ๆ ไป เพื่อให้ความรู้หรือข้อเท็จจริง"},{"n":114,"q":"การอภิปรายประเภทใดที่ผู้ร่วมอภิปรายทุกคนมีสิทธิเท่าเทียมกัน","o":["การอภิปรายโต๊ะกลม","การอภิปรายระดมสมอง","การอภิปรายแบบสัมมนา","การอภิปรายแบบปุจฉาวิสัชนา"],"a":1,"e":"การอภิปรายโต๊ะกลม (Round Table Discussion) คือ ผู้ร่วมอภิปรายทุกคนจะมิสิทธิเท่าเทียมกัน และจะมีการจัด โต๊ะเป็นรูปวงกลม โดยผู้ร่วมอภิปรายนั่งเรียงกันตาม รูปโต๊ะ เพื่อให้มีโอกาสเห็นหน้ากันอย่างชัดเจนทุกคน ทั้งนี้ ผู้เข้าร่วมอภิปรายจะมีประมาณ 10 - 20 คน โดยทุกคนเป็นทั้งผู้พูดและผู้ฟัง มีสิทธิในการแสดงความคิดเห็นเท่าเทียมกัน บางที่ประธานในการอภิปรายอาจจะมีหรือไม่มีก็ได้"},{"n":115,"q":"การพูดในโอกาสที่ใดที่นิยมเชิญแขกคนสนิทของเจ้าภาพขึ้นไปพูด","o":["การกล่าวสุนทรพจน์","การกล่าวต้อนรับ","การกล่าวแนะนำ","การกล่าวอวยพร"],"a":4,"e":"บางครั้งในงานที่จัดขึ้นอย่างเป็นกันเอง ผู้พูดอาจถูกเชิญขึ้นไปกล่าวอวยพร เพราะ มีความสนิทสนมกับเจ้าภาพ โดยไม่จำเป็นว่าจะต้องเป็นบุคคลที่มีชื่อเสียงแต่ประการใด ทั้งนี้การกล่าวอวยพรอาจมีได้หลายโอกาส เช่น อวยพรคู่ สมรส อวยพรวันเกิด อวยพรวันขึ้นปีใหม่เป็นต้น ซึ่งผู้พูดควรกล่าวสั้นๆ โดยมีหลักเกณฑ์ต่าง ๆ ดังนี้ 1. ผู้พูดควรกล่าวแสดงความรู้สึกเป็นเกียรติที่ได้ขึ้นมากล่าวอวยพร 2. ผู้พูดควรพูดถึงความสัมพันธ์ของผู้พูดที่มีต่อเจ้าภาพ 3. ผู้พูดควรคำถึงเวลาและเนื้อหาให้เหมาะสมตามโอกาส"},{"n":116,"q":"\"ผมไม่เคยคิดมาก่อนเลยว่าเรื่องแบบนี้จะเกิดขึ้นกับตัวเอง\" เป็นการขึ้นต้นคำนำแบบใด","o":["แบบตั้งคำถาม","แบบทำให้ผู้ฟังสงสัย","แบบพาดหัวข่าว","แบบยกบทกวีหรือคำคม"],"a":2,"e":"หลักการขึ้นต้นคำนำวิธีหนึ่ง คือ ขึ้นต้นด้วยการทำให้ผู้ฟังสงสัย ซึ่งการ ขึ้นต้นด้วยวิธีนี้จะแตกต่างจากวิธีตั้ง คำถาม เนืองจากมิได้ใช้ประโยคคำถาม แต่ใช้ประโยค ที่ฟังแล้วเกิดความสงสัยอยากติดตามต่อไป เช่น \"ผมไม่เคยคิดมา ก่อนเลยว่าเรื่องแบบนี้จะเกิดขึ้นกับตัวเอง\" เป็นต้น"},{"n":117,"q":"ข้อความในโฆษณาชิ้นนี้ใช้หลักการเขียนข้อใด","o":["ใช้ข้อความเกินความจริง เพื่อดึงดูดความสนใจ","ใช้ข้อความที่สื่อความหมายให้เข้าใจง่าย","ใช้สำนวนที่น่าสนใจ จดจำได้ง่าย","ใช้ภาษาที่บ่งบอกให้รู้ว่า สินค้าที่นำเสนอคืออะไร ใช้ประโยชน์อะไร"],"a":4,"e":"ดูบรรยายเพิ่มเติมข้อ 88. ประกอบ","im":["ad"]},{"n":118,"q":"โปสเตอร์ข้างต้นมีจุดมุ่งหมายได้ในการโฆษณา","o":["เพื่อก่อให้เกิดความสะดุดใจ","เพื่อกระตุ้นความสนใจ","เพื่อสร้างความประรถนา","เพื่อให้เกิดการปฏิบัติ"],"a":2,"e":"ดูบรรยายเพิ่มเติมข้อ 86. ประกอบ","im":["ad"]},{"n":119,"q":"ข้อความ \"อะไรดี....บุ๋มก็ว่าดี\" ใช้หลักการเขียนข้อใด","o":["ใช้สำนวนที่น่าสนใจ จดจำได้ง่าย","ใช้ข้อความที่สื่อความหมายให้เข้าใจง่าย","ใช้ข้อความเกินความจริง เพื่อดึงดูดความสนใจ","ใช้ภาษาที่บ่งบอกให้รู้ว่า สินค้าที่นำเสนอคืออะไร ใช้ประโยชน์อะไร"],"a":1,"e":"ดูบรรยายเพิ่มเติมข้อ 88. ประกอบ"},{"n":120,"q":"\"ยิ่งเล่น ยิ่งเรียนรู้ ยิ่งดี\" เป็นการใช้ภาษาโฆษณาเพื่อวัตถุประสงค์ใด","o":["บ่งบอกลักษณะเด่นของผู้ใช้ผลิตภัณฑ์","ชักจูงให้ผู้จัดจำหน่ายรับผลิตภัณฑ์ไปจำหน่าย","ขี้แจงคุณสมบัติของส่วนประกอบผลิตภัณฑ์","สะท้อนคุณสมบัติที่ชัดเจนของผลิตภัณฑ์"],"a":1,"e":"ข้อความที่ว่า \"ยิ่งเล่น ยิ่งเรียนรู้ ยิ่งดี\" เป็นการใช้ภาษาโฆษณาเพื่อวัตถุประสงค์คือ บ่งบอกลักษณะเด่นของผู้ใช้ ผลิตภัณฑ์ ซึ่งผู้ใช้ผลิตภัณฑ์ที่เป็นกลุ่มเป้าหมาย ได้แก่ เด็ก"}]},{"title":"ภาค S ปีการศึกษา 2566","items":[{"n":1,"q":"ข้อใดไม่จัดเป็นภาษา","o":["ท่าทางของมนุษย์","อิโมติคอน (Emoticon)","ตัวอักษร","เสียงหมาเห่า"],"a":4,"e":"ภาษา คือ ระบบการสื่อสารของมนุษย์ที่มีความหมาย ไม่ว่าจะเป็นการสื่อสารในรูปแบบของท่าทาง เครื่องหมาย สัญลักษณ์ การเขียน การพูด เป็นต้น ดังนั้นภาษาจึงเป็นการสื่อสารระหว่างมนุษย์กับมนุษย์โดยใช้วิธีต่าง ๆ ทั้งวัจนภาษา (ภาษาที่ใช้ถ้อยคำ) เช่น คำพูด ตัวอักษร การเขียน ฯลฯ และอวัจนภาษา (ภาษาที่ไม่ใช้ถ้อยคำ) เช่น กิริยาท่าทาง เสียง อี โมติคอน (Emoticon) ฯลฯ เป็นเครื่องมือในการสื่อสาร (เสียงหมาเห่าไม่จัดเป็นภาษาของมนุษย์ แต่เป็นเพียง สัญชาตญาณ)"},{"n":2,"q":"หลักฐานเกี่ยวกับภาษาไทยที่เก่าแก่ที่สุด คือข้อใด","o":["ศิลาจารึกตำรายาวัดพระเชตุพนวิมลมังคลาราม","ศิลาจารึกดงแม่นางเมือง","ลิลิตโองการแข่งน ้า","ศิลาจารึกหลักที่ 1"],"a":4,"e":"ในสังคมและวัฒนธรรมไทยได้เริ่มปรากฏหลักฐานที่เกี่ยวกับภาษาไทยในสมัยสุโขทัย โดยเป็นหลักฐานสำคัญ เกี่ยวกับภาษาไทยที่เก่าแก่ที่สุด คือ ศิลา-จารึกสุโขทัยหลักที่ : ที่พ่อขุนรามคำแหงทรงประดิษฐ์อักษรไทยใช้เป็นครั้งแรก จากการนำ อักษรมอญและอักษรขอมมาปรับปรุงจนเป็นลายสือไทย และในจารึกก็ปรากฏภาษาไทยใน \"สมัยสุโขทัย ซึ่ง มักเป็นคำเดี่ยว บางคำยังใช้ต่อเนื่องมาจนถึงปัจจุบัน บางคำเป็นส่วนหนึ่งของคำประสม บางคำก็เลิกใช้ ฯลฯ"},{"n":3,"q":"เสียงวรรณยุกต์มีความสำคัญอย่างไรในภาษาไทย","o":["ช่วยเพิ่มความไพเราะของคำ","ช่วยแปลความหมายของคำศัพท์","ช่วยกำหนดเสียงหนัก – เบาของคำศัพท์","ช่วยให้น ้าหนักของคำชัดเจนขึ้น"],"a":2,"e":"ในภาษาตระกูลอื่น ๆ เช่น ตระกูลอินโดยูโรเปียน จะไม่ใช้วิธีการเปลี่ยนระดับเสียงวรรณยุกต์ เพื่อแปลความหมาย ของคำเหมือนภาษาไทยและภาษาจีน ซึ่งออกเสียงวรรณยุกต์เปลี่ยนไป ความหมายก็จะเปลี่ยนทันที เช่น กู กู่ กู้เป็นต้น ดังนั้นการเปลี่ยนเสียงวรรณยุกต์แล้วความหมายเปลี่ยนนี้ จึงถือเป็นลักษณะเด่นของภาษาไทย"},{"n":4,"q":"ข้อใดเป็นลักษณะเด่นที่สุดของภาษาไทย","o":["เสียงพยัญชนะควบ","เสียงพยัญชนะสะกด","เสียงพยัญชนะต้น","เสียงวรรณยุกต์"],"a":4,"e":"ดูบรรยายเพิ่มเติมข้อ 3. ประกอบ"},{"n":5,"q":"ข้อใดคือกลวิธีการสร้างคำศัพท์ใหม่ของภาษาไทยที่โดดเด่น","o":["การประสมคำ","การสนธิคำ","การแผลงคำ","การลงอาคม"],"a":1,"e":"ลักษณะสำคัญของภาษาไทยสามารถพิจารณาเป็นประเด็นต่างๆ ได้ดังนี้ 1. คำภาษาไทยเป็นคำโดด 2. ภาษาไทยไม่เปลี่ยนแปลงรูปคำเพื่อบอกเพศ พจน์ กาล การก วาจก เมื่ออยู่ในประโยค 3. ภาษาไทยสร้างคำศัพท์ขึ้นใหม่โดยวิธีประสมคำ 4. ภาษาไทยใช้ระดับเสียงเปลี่ยนความหมายของคำ"},{"n":6,"q":"เรียกลำดับลูกสาวว่า \"อาม\" ตรงกับคำเรียกลำดับลูกชายว่าอย่างไร","o":["อ้าย","ยี่","สาม","ไส"],"a":3,"e":"ภาษาไทยถิ่นเหนือ อีสาน และภาษาลาว เรียกลูกชายลำดับ 1- 6 ว่า \"อ้าย ยี่ สาม ไส งั่ว ลก...\" และเรียกลูกสาว ลำดับ 1 - 6 ว่า \"เอย อี อาม ไอ่ อั้ว อ....\""},{"n":7,"q":"คำว่า \"ลูกสะใภ้\" เป็นการสร้างคำแบบใดในภาษา","o":["คำช้อน","คำซ ้า","คำคู่","คำประสม"],"a":4,"e":"คำประสม คือ การนำคำมูลสองคำขึ้นไปมาประสมกัน เพื่อให้เกิดเป็นคำใหม่มีความหมายใหม่ ซึ่งส่วนใหญ่แล้ว คำมูลเหล่านั้นจะแสดงลักษณะสัณฐานหรือเค้าความหมายหรือความหมายโดยนัยของคำประสมที่เกิดขึ้นใหม่ มีความ หมายใหม่ จึงถือเป็นการสร้างคำและ พัฒนาคำศัพท์ภาษาไทยมากที่สุด เช่น ลวดหนาม แม่ซื้อ แม่บ้าน ลูกสะใภ้ ตู้เย็น รองเท้า ฯลฯ"},{"n":8,"q":"ข้อใดไม่ใช่การสร้างคำใหม่แบบคำประสม","o":["อนามัย","ตู้เย็น","แม่บ้าน","รองเท้า"],"a":1,"e":"คำศัพท์บัญญัติจำนวนมากจะไม่ใช้คำพื้นฐาน แต่มักสร้างขึ้นใหม่จากผู้รู้หรือ ผู้เชี่ยวชาญที่นิยมใช้คำบาลี - สันสกฤต ที่นำมาใช้ในภาษาไทยอยู่ก่อนแล้วมาสร้างเป็นคำใหม่เพื่อใช้เรียกชื่อสิ่งประดิษฐ์ใหม่หรือศัพท์ทางวิชาการ เช่น ญาณวิทยา อภิปรัชญา กลศาสตร์อัตลักษณ์ อนามัย ฯลฯ ซึ่งคำเหล่านี้ไม่ใช่คำประสมตามระบบการสร้างคำแบบ ภาษาคำโดดเพราะคำที่นำมารวมกันเป็นคำภาษาบาลี - สันสกฤต และใช้ไวยากรณ์บาลี - สันสกฤต คือการสร้างคำโดย วิธีสมาสและสนธิ ซึ่งถือเป็นการเปลี่ยนแปลงของภาษาไทยรูปแบบหนึ่ง"},{"n":9,"q":"อักษรไทยสมัยอยุธยาได้รับอิทธิพลจากอักษรใดเป็นสำคัญ","o":["ลายสือไทย","อักษรมอญ","อักษรพราหมี","อักษรธรรมล้านนา"],"a":1,"e":"สมเด็จพระรามาธิบดีที่ 1 ทรงสถาปนากรุงศรีอยุธยาขึ้นมาในปี พ.ศ. 1893 โดยมีความสัมพันธ์ทางการเมืองกับ สุโขทัยและล้านนา ซึ่งสุโขทัยได้ถูกผนวกเข้าเป็นส่วนหนึ่งของอยุธยาในสมัยสมเด็จพระบรมไตรโลกนาถในปี พ.ศ. 2006 ด้วยความสัมพันธ์ดังกล่าวจึงเกิดการถ่ายโอนวัฒนธรรมของสุโขทัย รวมถึงรูปแบบการใช้ตัวอักษรลายสือไทย"},{"n":10,"q":"เครื่องหมายฝนทองใช้เพื่อกำกับเสียงสระใดในยุคอยุธยาตอนต้น","o":["สระเอีย","สระออ","สระอิ","สระเออ"],"a":2,"e":"ในสมัยอยุธยาตอนต้น พบการใช้เครื่องหมายแทนสระ 2 ตัว คือ เครื่องหมายไม้หันอากาศ และเครื่องหมาย ฝนทอง ส่วนเครื่องหมายแทนพยัญชนะมี 1 ตัว คือ นิคหิตและเครื่องหมายประกอบการเขียน 1 ตัว คือ เครื่องหมายไม้ ยมก กล่าวคือ 1. เครื่องหมายไม้หันอากาศ จะพบทั้งการว่างไม้หันอากาศบนพยัญชนะและตัวสะกด ร่วมกับการใช้พยัญชนะ ตัวสะกด 2 ตัว แทนการใช้เครื่องหมายนี้ปะปนอยู่เช่นเดียวกับสมัยสุโขทัย 2. เครื่องหมายฝนทอง พบการใช้น้อยมาก โดยใช้กำกับคำที่มีเสียงสระออ 3. เครื่องหมายนิคหิด ใช้แทนพยัญชนะ \"ม\" ในคำที่มีเสียงสระโอเช่นเดียวกับสมัยสุโขทัย"},{"n":11,"q":"เครื่องหมายทันตมาต ปรากฏการใช้ในยุคใด","o":["อยุธยาตอนต้น","สุโขทัย","อยุธยาตอนปลาย","รัตนโกสินทร์"],"a":3,"e":"ในสมัยอยุธยาตอนปลาย - ธนบุรี เริ่มปรากฏการใช้เครื่องหมายทันตฆาต (การันต์) เป็นครั้งแรก ซึ่งการใช้ เครื่องหมายทันตฆาตในสมัยอยุธยาตอนปลาย - ธนบุรีมักใช้กำกับบนพยัญชนะที่เป็นตัวสะกด โดยลักษณะดังกล่าวนี้จะ ใช้ต่อเนื่องไปจนถึงสมัยรัตนโกสินทร์ตอนต้น"},{"n":12,"q":"พยัญชนะไทยพบรูปอักษรครบ 44 ตัว ในยุคใด","o":["สุโขทัย","อยุธยาตอนต้น","อยุธยาตอนปลาย","รัตนโกสินทร์"],"a":3,"e":"จำนวนตัวอักษรในสมัยอยุธยาตอนปลาย - ธนบุรี เพิ่มมาจากสมัยอยุธยาตอนกลาง 2 ตัว คือ ท และ ฮ ถือว่ามี พยัญชนะครบ 44 ตัว ส่วนสระเพิ่มขึ้นจากสมัยอยุธยาตอนกลาง 5 ตัว คือ สระเอะ เอียะ เอือะ อัวะ และเออะ ถือว่ามีสระ ครบ 32 ตัว โดยการใช้พยัญชนะในสมัยอยุธยาตอนปลายปรากฏการใช้ตัวเชิง ซึ่งเป็นอักขรวิธีแบบขอมร่วมอยู่ด้วย"},{"n":13,"q":"ข้อใดเป็นอวัจนภาษา","o":["ก้อยเขียนจดหมายลางาน","แนนไลน์หาแป้มเพื่อบอกเรื่องสอบ","แหม่มพยักหน้าและยิ้มให้เก๋","ก้อยโทรคุยกับแนน"],"a":3,"e":"ประเภทของภาษาสามารถแบ่งได้ 2 ลักษณะ ดังนี้ 1. วัจนภาษา (Verbal Language) คือ ภาษาที่ใช้สื่อสารผ่านถ้อยคำ ภาษาพูด ภาษาเขียน ซึ่งอาจเป็นภาษาไทย ภาษาอังกฤษ ภาษาฝรั่งเศส ภาษาจีน ฯลฯ 2. อวัจนภาษา (Non Verbal Language) คือ ภาษาที่ใช้ในการแสดงออก อาจจะผ่านท่าทาง น ้าเสียง หรือบริบทที่แวด ล้อมในการใช้ภาษา หรือเป็นภาษาที่ใช้ในการสื่อสารโดยกำหนด ผ่านระบบสัญญาณ ภาษาท่าทาง ภาษามือ ภาษากาย"},{"n":14,"q":"ข้อใดไม่ใช่อวัจนภาษา","o":["ก้อยโทรคุยกับแนน","อ้อมถอนหายใจเมื่องานเสร็จ","ครูพยักหน้าให้แนนเข้าห้องสอบได้","แหม่มโบกมืออำลาทุกคน"],"a":1,"e":"ดูบรรยายเพิ่มเติมข้อ 13. ประกอบ"},{"n":15,"q":"ปัทมาได้กลิ่นน ้าอบร ่าหอมเย็นขณะเดินเข้าซอยบ้านกลางดึก เธออดนึกถึงสิ่งลี้ลับเหนือธรรมชาติ ไม่ได้กลิ่นที่เป็นเหตุให้ปัทมานึกถึงสิ่งสี้ลับเป็นอวัจนภาษาชนิด","o":["เทศภาษา","วัตถุภาษา","กาลภาษา","สัมผัสภาษา"],"a":2,"e":"วัตถุภาษา หมายถึง อวัจนภาษาที่สื่อความหมายถึงข้าวของ และสิ่งของเครื่องใช้ในชีวิตประจำวัน โดยวัตถุภาษา สามารถสื่อถึงรสนิยม ความเป็นตัวตนส่วนบุคคล ตลอดจนอาชีพและสถานภาพ ได้แก่ เครื่องแต่งกายตามอาชีพ (ข้าราชการ/ทหาร/ตำรวจ) กระเป๋า เพชร ทอง เสื้อผ้า รองเท้า เครื่องสำอาง ฯลฯ นอกจากนี้วัตถุภาษายังรวมถึง องค์ประกอบที่ให้ความรู้สึกในเชิงรูป รส กลิ่น สี เช่น สีดำให้ความรู้สึกน่ากลัว โศกเศร้า, สีแดงให้ความรู้สึก คึกคัก มี พลัง, สีเขียวให้ความรู้สึกสดชื่น สบายตา เป็นต้น หรือวัตถุภาษาที่สื่อผ่านทางกลิ่นเช่น กลิ่นน ้าอบน ้าปรุง ทำให้นึกถึงสิ่ง ลี้ลับ วิญญาณ, กลิ่นรูป ทำให้นึกถึงพิธีกรรม เป็นต้น"},{"n":16,"q":"ชัยยุทธไปร่วมฟังสวดอภิธรรมศพของประธานบริษัท เขาเดินไปนั่งแถวที่ 2 เพราะเขาสังเกตว่าแถว หน้าสุดเป็นชุดรับแขกทำด้วยหนังแท้เป็นเงาวับ และเก้าอี้ข้างกันนั้นก็เป็นเบาะหุ้มหนังอย่างดี การจัดวาง เก้าอี้ที่แตกต่างกันเป็นอวัจนภาษาชนิดใด","o":["เทศภาษา","วัตถุภาษา","กาลภาษา","สัมผัสภาษา"],"a":1,"e":"เทศภาษา หมายถึง อวัจนภาษาที่แสดงออกผ่านทางพื้นที่ และระยะห่างของพื้นที่โดยการเสดงอวัจนภาษาแบบนี้ จะเกี่ยวข้องกับความสัมพันธ์ของบุคคลหรือสถานภาพของบุคคลด้วย ได้แก่ ในงานพิธีการ เก้าอี้แถวหน้าส่วนใหญ่จะ ว่างเว้นไว้ให้แขกผู้ใหญ่ ขณะที่เราเมื่อเดินเข้าไปก็จะรับรู้ว่า เก้าอี้แถวหน้าสำหรับแขกผู้มีเกียรติหรือผู้ใหญ่ เราก็จะมานั่ง ลำดับแถวที่ถัดมาหรือเลี่ยงไปนั่งแถวตรงกลางหรือแถวหลังสุด ดังนั้นการเลือกที่นั่งของบุคคลก็จะ บ่งบอกได้ถึงการ แสดงออกทางพื้นที่ตัวตนของบุคคลผู้นั้น"},{"n":17,"q":"บริษัทจัดกิจกรรมส่งเสริมการขายวันที่ 12 เดือน 12 ปี 2012 เป็นอวัจนภาษาชนิดใด","o":["เทศภาษา","วัตถุภาษา","กาลภาษา","สัมผัสภาษา"],"a":3,"e":"กาลภาษา หมายถึง การแสดงออกทางภาษาที่สื่อความหมายถึงเรื่องของเวลา เช่นการยืนตรงเคารพธงชาติ เวลา 8.00 น. และเวลา 18.00 น. บางตำราก็กล่าวว่ารวมถึงเวลา สื่อสารที่ผู้ส่งสารมีการสร้างความหมายพิเศษแก่ผู้รับสาร ดัง ตัวอย่างที่เห็นได้จากสื่อสังคมออนไลน์ในปัจจุบัน เช่น การจัดช่วงเวลาส่งเสริมการขายวันที่ 12 เดือน 12 ปี 2012 ฯลฯ"},{"n":18,"q":"นักเรียนชั้นอนุบาล 1 ร้องให้เมื่อคุณแม่ส่งให้ครู คุณครูเข้ามากอดพร้อมทั้งลูบศีรษะนักเรียนคนนั้น การกระทำของครูจัดเป็นอวัจนภาษาข้อใด","o":["เทศภาษา","วัตถุภาษา","กาลภาษา","สัมผัสภาษา"],"a":4,"e":"สัมผัสภาษา หมายถึง การแสดงออกของภาษาท่าทางในลักษณะสัมผัสใกล้ชิด และขณะเดียวกันการแสดงออกของ ภาษาดังกล่าวนี้ก็จะมีอารมณ์ความรู้สึกเข้ามาเกี่ยวข้องด้วยเช่น นักเรียนชั้นอนุบาล ร้องไห้เมื่อคุณแม่ส่งให้ครู คุณครูจึง เข้ามากอดพร้อมทั้งลูบศีรษะ นักเรียนคนนั้น, เมื่อ,เห็นเพื่อนร้องไห้ เพื่อนอีกคนเดินเข้ามาปลอบ พร้อมโอบกอดให้ กำลังใจ,เด็กน้อยทำความดีบางอย่าง ผู้ใหญ่เห็นจึงใช้มือลูบศีรษะด้วยความเอ็นดู เป็นต้น"},{"n":19,"q":"ภาษาในการเขียนรายงานวิจัย จัดเป็นภาษาระดับใด","o":["ภาษาแบบแผน","ภาษากึ่งทางการ","ภาษาเฉพาะกลุ่ม","ภาษาเฉพาะกลุ่ม"],"a":1,"e":"ภาษาแบบแผน คือ ภาษาที่ใช้ในสถานการณ์ที่เป็นทางการหรือเป็นพิธีการ ส่วนใหญ่มักเป็นงานพระราชพิธีหรือ งานพิธีสำคัญ เช่น การกล่าวรายงานเปิดการประชุม บางครั้งอาจเป็นงานที่ต้องมีการใช้ภาษาอย่างประณีต เช่น การกล่าว สุนทรพจน์ ฯลฯ โดยภาษาแบบแผนหรือภาษาระดับทางการนี้สามารถแบ่งระดับของภาษาลงไปได้อีก คือ ภาษาระดับ พิธีการ และภาษาระดับมาตรฐานราชการ นอกจากนี้ภาษาแบบแผน ยังมีความหมายรวมถึง ภาษาที่ใช้ในการเรียบเรียง วิทยานิพนธ์ รายงานวิจัย บทคัดย่อผลงานทางวิชาการ บทความวิชาการ และบทความวิจัยด้วย เนื่ องจากถือว่ามีการคิด และกลั่นกรองภาษาที่มีความถูกต้องตามหลักภาษา มีการใช้คำที่ประณีตบรรจง ทั้งนี้เพื่อสื่อความคิดและความหมายตาม จุดประสงค์ของผู้เขียนที่ต้องการถ่ายทอดความรู้"},{"n":20,"q":"ข้อใดเป็นอุปสรรคที่เกิดจากการสื่อสารจากภายใน","o":["ผอ. กล่าวปฐมนิเทศนักเรียนอย่างรวบรัด เพราะเครื่องปรับอากาศในห้องประชุมไม่ทำงาน","ธนเดชไม่สามารถจับใจความที่ภาณุบอกได้ เพราะสัญญาณโทรศัพท์ขาดหาย","ภูริรู้สึกประหม่าในการประกวดพูดสุนทรพจน์ จึงพูดเสียงเบาทำให้ผู้ฟังหลังห้องไม่ได้ยิน","ธีระไม่มีสมาธิอ่านหนังสือ เพราะข้างบ้านเสียงดังจากการต่อเติมซ่อมบ้าน"],"a":3,"e":"อุปสรรคของการสื่อสารแบ่งออกเป็น 2 ประเภท ได้แก่ 1. อุปสรรคการสื่อสารจากภายใน หมายถึง ปัญหา การติดขัด ความขัดข้องที่เกิดจากระบบการสื่อสารภายใน อาจจะ เป็นผู้ส่งสาร/ผู้รับสารอยู่ในสภาพที่ไม่พร้อม หรือมีความขัดข้อง ที่เกิดมาจากร่างกาย สภาพจิตใจที่เป็นทุกข์ เกิดความ กดดัน ทำให้เกิดความรู้สึกประหม่า มีความรู้สึกกลัว หรือเกิดอาการที่พูดไม่รู้เรื่องหรือเขียนวกไปวนมา 2. อุปสรรคการสื่อสารจากภายนอก หมายถึง อุปสรรคที่เกิดขึ้นมาจากปัญหา ความขัดข้องความไม่ชัดเจนของสาร สื่อหรือช่องทาง ซึ่งอาจจะได้รับผลกระทบมาจากดินฟ้าอากาศบริบทสภาพแวดล้อม การกระทำของมนุษย์ และอื่น ๆ ที่ ทำให้เกิดอุปสรรคขึ้นมา ทำให้การสื่อสารล้มเหลว ไม่ประสบความสำเร็จ"},{"n":21,"q":"\"หนุ่มโวยประกันชั้น 1 เมาแล้วขับชน กลับพาลูกค้าส่งตำรวจ\" ข้อความนี้เป็นภาษาระดับใด","o":["ภาษาพูด","ภาษาแบบแผน","ภาษากึ่งแบบแผน","ภาษาโฆษณา"],"a":1,"e":"ภาษาพูด หรือเรียกอีกอย่างหนึ่งว่า \"ภาษาปาก หรือภาษาที่ไม่เป็นทางการ\" คือระดับภาษาแรกที่เราสามารถ สัมผัสและรับรู้ได้อย่างใกล้ชิด เพราะภาษาพูดเป็นระดับภาษา ที่ แสดงความเป็นกัน เอง เป็นภาษาที่เราใช้ใน ชีวิตประจำวัน ตลอดจนแสดงถึงสถานะของผู้ที่ใช้ภาษาที่มีความใกล้ชิดและสนิทสนมกันในระดับหนึ่ง เช่น เพื่อนสนิท พี่น้อง ฯลฯ โดยคำที่ปรากฎในภาษาพูดจะเป็นคำเรียบง่าย หรือบางครั้งอาจมีคำที่ไม่สุภาพ คำสแลง คำภาษาถิ่นคำทับ ศัพท์ภาษาต่างประเทศ เข้ามาปะปนในภาษาพูดก็ได้ นอกจากนี้ภาษาพูดยังใช้สื่อสาร ผ่านสื่อสิ่งพิมพ์ได้ เช่น ภาษา สนทนาของตัวละครในวรรณกรรม ภาษาบทละคร ภาษาพาดหัว ข่าวในหน้าหนังสือพิมพ์ หรือสื่อออนไลน์"},{"n":22,"q":"ข้อใดเป็นคำกล่าวที่ไม่ถูกต้อง","o":["สื่อและช่องทาง เป็นองค์ประกอบหนึ่งของการสื่อสาร","ภาพสัญลักษณ์การห้ามสูบบุหรี่ จัดเป็นสาร","ผู้ส่งสารสามารถเปลี่ยนเป็นผู้รับสารได้","สภาพจิตใจที่เป็นทุกข์ เกิดความกดตัน เป็นอุปสรรคการสื่อสารภายนอก"],"a":4,"e":"ดูบรรยายเพิ่มเติมข้อ 20. ประกอบ"},{"n":23,"q":"นักศึกษาต้องอ่านวรรณคดีโบราณ มีศัพท์โบราณหลายคำที่นักศึกษาไม่เข้าใจ ทำให้ไม่เข้าใจ วรรณคดีเรื่องดังกล่าวอย่างถ่องแท้ การอ่านไม่เข้าใจเพราะติดปัญหาเรื่องคำศัพท์นี้ จัดเป็นอุปสรรคของการ สื่อสารด้านใด","o":["ด้านสื่อและช่องทาง ด้านสภาพดินฟ้าอากาศ","ด้านสาร","ด้านบริบทและสภาพแวดล้อม","ด้านสื่อและช่องทาง"],"a":2,"e":"อุปสรรคการสื่อสารจากภายนอกที่เกิดจากสาร คือ สารอาจจะมีความยากง่ายไม่เท่ากัน และผู้รับสารมีข้อจำกัดใน การรับสาร เช่น มีความแตกต่างด้านเชื้อชาติ วัฒนธรรมการศึกษา ความเชื่อ ค่านิยม ซึ่งอาจทำให้ผู้รับสารเข้าใจสารผิด ไป หรือตีความเนื้อหาของสารไม่ตรงกับความหมายที่ผู้ส่งสารส่งมา นอกจากนี้อุปสรรคที่เกิดจากสารอาจมาจากการที่ผู้ ส่งสารขาดการลำดับสาร ดังนั้นจึงทำให้ผู้รับสารเกิดความสับสนกับสารที่ได้รับมาว่าจะเรียงลำดับสารอย่างไร หรือ บางขณะสารที่ส่งมานั้นมีลักษณะการใช้ภาษาที่ยาก อาจเป็นภาษาโบราณ ภาษา-วรรณคดี ทำให้ผู้รับสารไม่เข้าใจเพราะ ติดปัญหาเรื่องคำศัพท์นี้"},{"n":24,"q":"ข้อใดเป็นระดับภาษาที่จัดอยู่ในหมวดเดียวกับภาษาแบบแผน","o":["ภาษาระดับพิธีการ และภาษาระดับมาตรฐานราชการ","ภาษาระดับพิธีการ และภาษาระดับกึ่งทางการ","ภาษาระดับมาตรฐานราชการ และภาษากึ่งแบบแผน","ภาษาระดับพิธีการ และภาษากึ่งแบบแผน"],"a":1,"e":"ดูบรรยายเพิ่มเติมข้อ 19. ประกอบ"},{"n":25,"q":"ภาษามลายู จัดอยู่ในกลุ่มภาษาใด","o":["กลุ่มภาษามอญ – เขมร","กลุ่มภาษาออสโตรนีเซียน","กลุ่มภาษาจีน – ทิเบต","กลุ่มภาษาไท – กะได"],"a":2,"e":"กลุ่มชาติพันธุ์หลัก ๆ ในสังคมไทย อาจจำแนกได้ดังนี้ 1. กลุ่มภาษาไท - กะได หรือไทย - ลาว ได้แก่ ภาษาของไทย ภาษาลาว (โซ่ง ดำ แดง ขาว)กะเหรี่ยง ไทยใหญ่ ไทยลื้อ ฯลฯ ซึ่งถือว่าเป็นกลุ่มภาษาที่ใช้มากที่สุดในสังคมไทย 2. กลุ่มภาษามอญ - เขมร ถือเป็นภาษาที่ปะปนอยู่ในภาษาไทยปัจจุบัน 3. กลุ่มภาษาจีน - ทิเบต ได้แก่ ภาษาจีนแขนงต่าง ๆ และภาษาพม่า รวมไปถึงภาษาของขาวเขาอีกหลายเม่า 4. กลุ่มภาษาออสโตรนีเซียน ได้แก่ ภาษามลายู ภาษาของกลุ่มชาวเล (มอแกน มอเกลนและอูรักลาโว้ย)"},{"n":26,"q":"ภาษากลุ่มชาวเล เช่น มอแกน อูรักลาโว้ย จัดอยู่ในกลุ่มภาษาใด","o":["กลุ่มภาษามอญ – เขมร","กลุ่มภาษาออสโตรนีเซียน","กลุ่มภาษาจีน – ทิเบต","กลุ่มภาษาไท – กะได"],"a":2,"e":"ดูบรรยายเพิ่มเติมข้อ 25. ประกอบ"},{"n":27,"q":"ภาษาลาว จัดอยู่ในกลุ่มภาษาใด","o":["กลุ่มภาษามอญ – เขมร","กลุ่มภาษาออสโตรนีเซียน","กลุ่มภาษาจีน – ทิเบต","กลุ่มภาษาไท – กะได"],"a":4,"e":"ดูบรรยายเพิ่มเติมข้อ 25. ประกอบ"},{"n":28,"q":"กลุ่มภาษาใดถือว่าเป็นกลุ่มภาษาที่ใช้มากที่สุดในสังคมไทย","o":["กลุ่มภาษามอญ – เขมร","กลุ่มภาษาออสโตรนีเซียน","กลุ่มภาษาจีน – ทิเบต","กลุ่มภาษาไท – กะได"],"a":4,"e":"ดูบรรยายเพิ่มเติมข้อ 25. ประกอบ"},{"n":29,"q":"ข้อใดไม่ได้เป็นปัจจัยสำคัญในการแปรภาษา","o":["ปัจจัยด้านฐานะ","ปัจจัยด้านวัย","ปัจจัยด้านสถานภาพ","ปัจจัยด้านการศึกษา"],"a":1,"e":"ภาษาไทยถือเป็นภาษาหลักที่ใช้ในสังคมไทย ซึ่งผู้ใช้สามารถปรับเปลี่ยนได้ตามวัตถุประสงค์ โดยมีปัจจัยสำคัญใน การแปรภาษาดังนี้ 1. วัย 2. เพศ 3. สถานภาพบุคคล 4. การศึกษา"},{"n":30,"q":"\"แชร์โลมา ปังมากแม่ สวยแบบตะโกน\" เป็นการแปรภาษาในปัจจัยใด","o":["ปัจจัยด้านฐานะ","ปัจจัยด้านวัย","ปัจจัยด้านสถานภาพ","ปัจจัยด้านการศึกษา"],"a":2,"e":"ความต่างของการใช้ภาษาที่เกิดจากวัย ทำให้เกิดความหลากหลายไม่ว่าจะเป็นคำเสียง ข้อความ หรือสำนวน โดยเฉพาะการแปรภาษาของกลุ่มวัยรุ่น ซึ่งนิยมใช้คำสแลง เน้นที่ความหมายมากกว่าความสมบูรณ์ทางไวยากรณ์ เช่น หัวจะปวด ขอให้พระทำโทษอย่างหนัก ปังมากแม่ สวยแบบทะโกน ฯลฯ บางคำจะมีการตัดคำ เช่น แชร์โลมา (แชร์ โลเคชั่นมา) ฯลฯหรือบางคำมีความหมายเฉพาะกลุ่ม เช่น ตีป้อม ตัวแทงค์ ฮีล (กลุ่มผู้เล่นเกมออนไลน์) ฯลฯโดยผู้ สื่อสารในวัยหรือกลุ่มเดียวกันจึงจะเข้าใจความหมาย"},{"n":31,"q":"“พรุ่งนี้ผมมีงาน คงแวะไปหาคุณไม่ได้แล้ว\" เป็นการแปรภาษาในปัจจัยใดเป็นสำคัญ","o":["ปัจจัยด้านฐานะ","ปัจจัยด้านวัย","ปัจจัยด้านสถานภาพ","ปัจจัยด้านการศึกษา"],"a":3,"e":"การแปรภาษาที่เกิดจากปัจจัยด้านสถานภาพบุคคล คือ สังคมไทยเป็นสังคมที่มีผู้คนหลากหลายระดับ หลากหลายอาชีพ ซึ่งมีผลต่อการแปรภาษา โดยระดับการใช้ภาษานั้นจะขึ้นอยู่กับสถานะของผู้ที่สื่อสารด้วย ได้แก่ 1. สถานภาพของผู้ส่งสารและผู้รับสารอยู่ในระดับเดียวกันและสนิทกัน หรือผู้ส่งสารอาจเป็น รุ่นพี่ชิสนิทกับผู้รับสาร ที่เป็นรุ่นน้อง เช่น \"พรุ่งนี้กูติดงานตอนบ่ายว่ะ แวะไปหามึงไม่ได้ละ\" 2. สถานภาพของผู้ส่งสารและผู้รับสารมีความใกล้เคียงกัน และมีความกึ่งทางการ เช่น \"พรุ่งนี้ผมมีงานตอนบ่าย คง แวะไปหาคุณไม่ได้แล้ว\" 3. สถานภาพของผู้ส่งสารและผู้รับสารมีความสัมพันธ์อย่างเป็นทางการ ทำให้การสื่อสารเป็นทางการด้วย เช่น “พรุ่งนี้ผมติดภารกิจเวลาบ่ายโมงตรง คงไม่สามารถไปพบคุณได้แล้ว”"},{"n":32,"q":"วรรณคดีเรื่องใดไม่ได้ใช้พุทธศาสนาเป็นเครื่องมือในการควบคุมความประพฤติผู้คนในสังคม","o":["ไตรภูมิพระร่วง","พระมาลัยคำหลวง","พระเวสสันดรชาดก","ลิลิตตะเลงพ่าย"],"a":4,"e":"เมื่อสังคมไทยได้รับคติความเชื่อจากอินเดียโดยเฉพาะพุทธศาสนา ซึ่งสังคมไทยได้ใช้พุทธศาสนาเป็นเครื่องมือใน การควบคุมพฤติกรรมผู้คนในสังคม ปรากฏอยู่ในรูปแบบของวรรณกรรม เช่น ไตรภูมิพระร่วง พระมาลัยคำหลวง พระ เวสสันดรชาดก เป็นต้น ซึ่งเนื้อหาในวรรณกรรมดังกล่าวเน้นเรื่องบุญ - บาป ความเชื่อเรื่องนรก - สวรรค์ และเรื่องกฎ แห่งกรรม ที่เชื่อว่า หากกระทำความดีก็จะได้รับผลที่ดีตามมา แต่หากกระทำชั่วก็จะได้รับผลร้ายตามมา"},{"n":33,"q":"สำนวน \"คนดีผีคุ้ม , ผีซ ้าด ้าพลอย\" สะท้อนถึงแนวคิดเรื่องใด","o":["ภาษามีการหลากคำ","การแปรภาษา","ความหลากหลายของภาษาและวัฒนธรรม","ภาษากับความเชื่อในสังคมและวัฒนธรรม"],"a":4,"e":"ภาษาสะท้อนคติความเชื่อในสังคมและวัฒนธรรม โดยในส่วนของความเชื่อทางศาสนาที่คนไทยมีความเชื่อเรื่องผี ค่อนข้างเหนียวแน่นและชัดเจน ซึ่งเชื่อว่าผีสามารถบันดาล คุณโทษให้กับผู้คนได้ และสะท้อนผ่านทางการใช้ภาษาด้วย เช่น การใช้สำนวน \"คนดีผีคุ้ม, ผีซ ้าด ้าพลอย, ผีถึงป่าช้า, ผีเห็นผี\" เป็นต้น"},{"n":34,"q":"ความเชื่อเรื่องนรก - สวรรค์ แสดงถึงแนวคิดเรื่องใดในสังคมไทย","o":["ศาสนาเป็นเครื่องมือควบคุมความประพฤติ","สังคมไทยให้ความสำคัญกับผลที่ตามมา","ใครทำสิ่งใดก็ได้สิ่งนั้น","ความดี ความชั่ว มีน ้าหนักเท่าเทียมกัน"],"a":1,"e":"ดูบรรยายเพิ่มเติมข้อ 32. ประกอบ"},{"n":35,"q":"ข้อใดเป็นตัวอย่างของภาษาไทยที่สะท้อนวิถีชีวิตเกษตรกรรม","o":["ทำงานผิดที่ สิบปีก็ไม่เจริญ","แชร์โลมาเลย","น ้ามาปลากินมด น ้าลดมดกินปลา","อิ่มจัง ตังค์อยู่ครบ"],"a":3,"e":"ภาษาสะท้อนความเป็นอยู่ คือ วิถีชีวิตของคนไทยมีความผูกพันเกี่ยวกับ น ้าเป็นอย่างมาก เพราะสังคมไทยเป็น สังคมเกษตรกรรม น ้าจึงเป็นปัจจัยหลักที่ทำให้ผลผลิตทางการเกษตรสมบูรณ์ และในน ้ามีผลต่อการดำรงชีวิต ไม่ว่าจะ เป็นที่อยู่อาศัย การคมนาคมภาษาไทยจึงสะท้อนวิถีชีวิตการอยู่ร่วมกับน ้าของคนไทย ดังตัวอย่างสำนวนสุภาษิตดังนี้ 1. ฝนตกไม่ทั่วฟ้า 4. น ้ามาปลากินมด น ้าลดมดกินปลา 2. ฝนแปดแดดสี 5. น ้าขึ้นให้รีบตัก น ้าลดตอผุด 3. น ้าท่วมทุ่ง ผักบุ้งโหรงเหรง 6. ตำน ้าพริกละลายแม่น ้า ฯลฯ"},{"n":36,"q":"สำนวนในข้อใดไม่ได้สะท้อนถึงชีวิตการอยู่ร่วมกับน ้าของคนไทย","o":["ฝนแปดแดดสี่","ปากปราศรัย น ้าใจเชือดคอ","น ้ามาปลากินมด น ้าลดมดกินปลา","น ้าท่วมทุ่ง ผักบุ้งโหรงเหรง"],"a":2,"e":"ดูบรรยายเพิ่มเติมข้อ 35. ประกอบ"},{"n":37,"q":"\"นก\" ในข้อใดมีความหมายแฝง","o":["นกแอร์มีชุดพนักงานเป็นสีเหลือง","นกเขาใหญ่เสียงใสขันเก่งเสียงดัง","นกอยู่ข้างพีตาค่ะ","นกทุกครั้งเมื่อเจอเขา"],"a":4,"e":"คำที่มีความหมายแฝง หมายถึง คำที่เราต้องเข้าใจความความหมายที่ซ่อนไว้อยู่ในคำ ดังที่สุนันท์ อัญชลีนุกูล กล่าว ว่า \"คำที่มีความหมายอีกความหมายหนึ่ง นอกเหนือจากความหมายตรงหรือความหมายประจำคำ\" แสดงว่า คำที่มี ความหมายแฝงนั้น ความจริง ก็คือ คำที่มีความหมายโดยตรงมาก่อน แต่เมื่อคำ ๆ นั้นอยู่ในบริบทแวดล้อมที่อาจทำให้ ต้อง มีการเข้าใจความหมายอื่นที่แฝงมาในบริบทแวดล้อมด้วย เช่น คำว่า. \"นก\" ในตัวเลือกข้อ 4 มีความหมายแฝง คือ วีด ไม่ได้ หลุดมือ พลาดท่า ฯลฯ"},{"n":38,"q":"คำศัพท์ข้อใดมีความหมายตรง","o":["เสือผู้หญิง","ใจเพชร","เหล็กกล้า","หัวใจศิลา"],"a":3,"e":"คำที่มีความหมายตรง หมายถึง คำที่มีการแสดงความหมายตรงตามรูปคำไม่ได้มีความหมายอื่นแฝงอยู่ในคำ ดังที่ สุนันท์ อัญชลีนุกูล ได้อธิบายความหมายของคำที่มีความหมายตรงเพิ่มเติมอีกว่า คือ คำที่มีความหมายหลักของคำที่ใช้ สื่อสารในชีวิตประจำวันนอกจากนี้เขายังกล่าวว่า คำที่มีความหมายตรง เรียกอีกอย่างหนึ่งได้ว่า \"คำที่มีความหมายประจำ คำ หรือคำที่มีความหมายนัยตรง (Denotative Meaning or Lexical Meaning)\" เช่น คำว่า \"เหล็กกล้า\" ในพจนานุกรมฉบับ ราชบัณฑิตย สถาน พ.ศ. 2554 ให้ความหมายว่า \"น. เหล็กที่มีธาตุคาร์บอนเจืออยู่ประมาณร้อยละ 0.15 - 1.5 โดยสมบัติ ของเหล็กกล้าจะแตกต่างกันไปตามจำนวนร้อยละขอธาตุคาร์บอนและของโลหะอื่นที่เจือปนอยู่ และยังขึ้นอยู่กับ อุณหภูมิที่ใช้ในการเตรียมเหล็กกล้านั้น ๆ ด้วย\""},{"n":39,"q":"คำศัพท์ในข้อใดเขียนถูกต้องทั้งหมด","o":["โควตา ดิจิทัล","เคเบิ้ล แชต","ดาวโหลด คลินิก","ไลค์ คอลัมน์"],"a":1,"e":"คำที่เขียนผิด ได้แก่ เคเบิ้ล แชต ดาวโหลด ไลค์ ซึ่งที่ถูกต้องคือ เคเบิล แซ็ต ดาวน์โหลด ไลก์"},{"n":40,"q":"คำศัพท์ในข้อใดเขียนผิดทั้งหมด","o":["เท่ เสน่ห์","ผูกพัน ประติดประดอย","สู่สุคติ นานัปการ","น ้าแข็งใส กลิ่นไอ"],"a":4,"e":"คำที่เขียนผิด ได้แก่ น ้าแข็งใส กลิ่นไอ ซึ่งที่ถูกต้องคือ น ้าแข็งไส กลิ่นอาย"},{"n":41,"q":"\"นักศึกษากินข้าวหมดจนไม่เหลือข้าวสักเม็ดเลย\" ประโยคดังกล่าวมีข้อบกพร่องในเรื่องอะไร","o":["การใช้คำกำกวม","การใช้คำออกเสียงผิด","การใช้คำความหมายแฝง","การใช้คำฟุ่มเฟือย"],"a":4,"e":"คำฟุ่มเฟือย คือ คำที่มีความหมายเดียวกันมาวางไว้ในประโยคเดียวกัน จึงทำให้คำในประโยคเพิ่มขึ้นอย่างไม่ จำเป็น ซึ่งการใช้คำพุ่มเฟือยในการสื่อสารนอกจากจะทำให้ประโยครกรุงรังด้วยคำที่มีความหมายเดียวกันแล้ว ยังทำให้ ความชัดเจนของถ้อยคำลดน ้าหนักลงอีกด้วยเพราะผู้รับสารอาจจะไม่เข้าใจว่าผู้ส่งสารต้องการให้น ้าหนักกับคำหลักที่ สำคัญในประโยค คือคำใด ตัวอย่างการใช้คำฟุ่มเฟือย เช่น นักศึกษากินข้าวหมดจนไม่เหลือข้าวสักเม็ดเลย, ตำรวจ สามารถทำการจับกุมคนร้ายได้ เป็นต้น"},{"n":42,"q":"\"เจ้าหน้าที่เข็นรถคนไข้ออกไปแล้ว\" ประโยคดังกล่าวมีข้อบกพร่องในเรื่องอะไร","o":["การใช้คำกำกวม","การใช้คำออกเสียงผิด","การใช้คำความหมายแฝง","การใช้คำฟุ่มเฟือย"],"a":1,"e":"คำที่มีความหมายกำกวม คือ การสื่อสารโดยใช้คำผิดความหมาย เว้นวรรคคำผิด ขาดคำขยายที่เข้ามาทำให้ ความหมายชัดเจนขึ้น หรือมีการใช้คำในลักษณะคำพ้องรูปคำพ้องเสียง ก็อาจทำให้เกิดความหมายกำกวมขึ้นมาได้ ซึ่ง ก่อให้เกิดปัญหาการตีความหมายได้หลายแง่ เช่น \"เจ้าหน้าที่เข็นรถคนไข้ออกไปแล้ว\" อาจหมายถึง เจ้าหน้าที่/ได้เข็นรถ ของคนไข้ออกไปแล้ว หรือเจ้าหน้าที่เข็นรถคนไข้/ได้ออกไปแล้ว (เจ้าหน้าที่ไม่อยู่) เป็นต้น"},{"n":43,"q":"\"ข้าวต้มอุ่นหรือยัง\" ประโยคดังกล่าวมีข้อบกพร่องในเรื่องอะไร","o":["การใช้คำกำกวม","การใช้คำออกเสียงผิด","การใช้คำความหมายแฝง","การใช้คำฟุ่มเฟือย"],"a":1,"e":"ดูบรรยายเพิ่มเติมข้อ 42. ประกอบ"},{"n":44,"q":"\"ตำรวจสามารถทำการจับกุมคนร้ายได้\" ประโยคดังกล่าวมีข้อบกพร่องในเรื่องอะไร","o":["การใช้คำกำกวม","การใช้คำออกเสียงผิด","การใช้คำความหมายแฝง","การใช้คำฟุ่มเฟือย"],"a":4,"e":"ดูบรรยายเพิ่มเติมข้อ 41. ประกอบ"},{"n":45,"q":"\"การเขียนย่อหน้าต้องมุ่งเขียนประเด็นความคิดหลักเพียงประเด็นเดียวให้ชัดเจน\" จัดว่าเป็นลักษณะ การเขียนย่อหน้าที่ดีอย่างไร","o":["เอกภาพ","สัมพันธภาพ","สารัตถภาพ","ความกระจ่าง"],"a":1,"e":"พจนานุกรมฉบับราชบัณฑิตยสถาน พ.ศ. 2554 ได้ให้ความหมายคำว่า \"เอกภาพ\"ไว้ว่า ความเป็นอันหนึ่งอัน เดียวกัน ความสอดคล้องกลมกลืนกัน ดังนั้นการเขียนย่อหน้าจะเป็นในย่อหน้าเดียวกันก็ดี หรือหลายย่อหน้าก็ดี ต้องมุ่ง ไปที่ประเด็นความคิดหลักเพียงประเด็นเดียวให้ชัดเจน ซึ่งการเขียนประโยคภายในย่อหน้าจะต้องสอดคล้องกัน เป็นเหตุ เป็นผล สนับสนุนความคิดหลัก และรวมไปถึงหัวข้อเรื่อง ชื่อเรื่อง"},{"n":46,"q":"\"การเขียนเน้นใจความสำคัญในย่อหน้าเพื่อชี้ให้เห็นประเด็นความคิดสำคัญ\" จัดว่าเป็นลักษณะการ เขียน ย่อหน้าที่ดีอย่างไร","o":["เอกภาพ","สัมพันธภาพ","สารัตถภาพ","ความกระจ่าง"],"a":3,"e":"สารัตถภาพ คือ การเน้นใจความสำคัญของย่อหน้าเพื่อชี้ให้เห็นประเด็นความคิดสำคัญ อาจจะปรากฏอยู่ใน ตำแหน่งของประโยคใจความสำคัญ ซึ่งสามารถอยู่ได้ทั้งตอนต้นตอนท้าย โดยเฉพาะถ้าการเน้นประโยคใจความสำคัญ อยู่ตอนท้าย ผู้อ่านจะสนใจมาก เพราะตำแหน่งที่อยู่ตอนท้ายจะดึงดูดความสนใจผู้อ่านได้ดีกว่าตอนต้นของย่อหน้า แต่ สิ่งสำคัญ คือ ข้อความที่เน้นย ้านั้นจะต้องมีน ้าหนักน่าเชื่อถือและคล้ายกับเป็นการกล่าวปิดท้ายย่อหน้าด้วย"},{"n":47,"q":"ย่อหน้าดังกล่าว ผู้เขียนวางตำแหน่งใจความสำคัญไว้ที่ตำแหน่งใด (1) ความเครียดทำให้เพิ่มฮอร์โมนอะดรีนาลีนในเลือด (2) ทำให้หัวใจเต้นเร็ว เส้นเลือดบีบตัว กล้ามเนื้อเขม่งตึง (3) ระบบย่อยอาหารผิดปกติ เกิดอาการปวดหัว ปวดท้อง ใจสั่น แข้งขาอ่อนแรง (4) ความเครียดจึงเป็นตัวการให้แก่เร็ว","o":["(1)","(2)","(3)","(4)"],"a":4,"e":"ย่อหน้าที่มีประโยคใจความสำคัญหรือความคิดสำคัญอยู่ตอนท้าย คือ ย่อหน้า ที่เริ่มต้นจากประโยคขยายความ บอกเล่าไปเรื่อย ๆ จนถึงตอนท้าย และก่อนจะจบย่อหน้า มีประโยคกล่าวถึงความคิดสำคัญหรือประโยคสรุปความคิด สำคัญของย่อหน้า ซึ่งบางครั้งราเรียกประโยคใจความสำคัญตอนท้ายนี้ว่า \"ประโยคสรุปความ\" ส่วนรูปแบบของย่อหน้า จะเรียกว่า \"ย่อหน้าแบบสามเหลี่ยมหน้าจั่วหัวกลับ\""},{"n":48,"q":"ย่อหน้าดังกล่าว ผู้เขียนวางตำแหน่งใจความสำคัญไว้ที่ตำแหน่งใด (1) โดยทั่วไปผักที่ข่ายตามท้องตลาดส่วนใหญ่ เกษตรกรมักใช้สารกำจัดศัตรูพืช (2) หากไม่มีความ รอบคอบในการใช้จะทำให้เกิดสารตกค้าง ทำให้มีปัญหาต่อสุขภาพ (3) ฉะนั้นเมื่อซื้อผักไป รับประทานจึง ควรล้างฝักด้วยน ้าหลายครั้ง (4) เพราะจะช่วยกำจัดสารตกค้างไปได้บ้าง","o":["(1)","(2)","(3)","(4)"],"a":1,"e":"ย่อหน้าที่มีประโยคใจความสำคัญหรือความคิดสำคัญอยู่ตอนต้น คือ ย่อหน้าที่มีประโยคใจความสำคัญหรือ ความคิดสำคัญอยู่ตอนต้น ถัดจากประโยคใจความสำคัญหรือความคิดสำคัญก็จะเป็นประโยคขยายความหรือประโยค สนับสนุน ซึ่งเรียกอีกอย่างหนึ่งว่า \"ย่อหน้าแบบสามเหลี่ยมหน้าจั่ว\""},{"n":49,"q":"ข้อใดต่อไปนี้ไม่ถือเป็นหนังสือสั่งการ","o":["ข้อบังคับ","คำสั่ง","ประกาศ","ระเบียบ"],"a":3,"e":"หนังสือสังการมี 3 ชนิด ได้แก่ 1. คำสั่ง หมายถึง ข้อความต่าง ๆ ที่ผู้บังคับบัญชาสั่งการให้ปฏิบัติโดยชอบด้วยกฎหมายใช้กระดาษตราครุฑ 2. ระเบียบ หมายถึง ข้อความต่าง ๆ ที่ผู้มีอำนาจหน้าที่ได้วางไว้ โดยอาศัยอำนาจของกฎหมายหรือไม่ก็ได้ เพื่อถือเป็น หลักปฏิบัติงานเป็นการประจำ ใช้กระดาษตราครุฑ 3. ข้อบังคับ หมายถึง ข้อความต่าง ๆ ที่ผู้มีอำนาจหน้าที่กำหนดให้ใช้ โดยอาศัยอำนาจของกฎหมายที่บัญญัติให้กระทำ ได้ ใช้กระดาษตราครุฑ"},{"n":50,"q":"ข้อใดต่อไปนี้ไม่ใช่หนังสือประชาสัมพันธ์","o":["ข่าว","แถลงการณ์","ประกาศ","ระเบียบ"],"a":4,"e":"หนังสือประชาสัมพันธ์มี 3 ชนิด ได้แก่ 1. ประกาศ หมายถึง ข้อความต่าง ๆ ที่ทางราชการประกาศหรือขี้แจงให้ทราบ หรือแนะแนวทางปฏิบัติ ใช้กระดาษตรา ครุฑ 2. แถลงการณ์ หมายถึง ข้อความต่าง ๆ ที่ทางราชการแถลง เพื่อทำความเข้าใจในกิจการของราชการ หรือเหตุกรณีใด ๆ ให้ทราบชัดเจนทั่วกัน ใช้กระดาษตราครุท 3. ข่าว หมายถึง ข้อความต่าง ๆ ที่ราชการเห็นสมควรเผยแพร่ให้ทราบ"},{"n":51,"q":"สัญญา เป็นหนังสือราชการประเภทใด","o":["หนังสืออื่น","หนังสือประทับตรา","หนังสือภายนอก","หนังสือภายใน"],"a":1,"e":"หนังสืออื่น หมายถึง หนังสือหรือเอกสารใดๆ ที่เกิดขึ้นเนื่องจากการปฏิบัติงานของเจ้าหน้าที่ เพื่อเป็นหลักฐาน ในทางราชการ รวมถึงภาพถ่าย ฟิล์ม แถบบันทึกเสียง (เทป)แถบบันทึกภาพ (วิดี โอ) หรือหนังสือของบุคคลภายนอกที่ ยื่นต่อเจ้าหน้าที่ และเจ้าหน้าที่ได้รับเข้าทะเบียนรับหนังสือทางราชการแล้ว มีรูปแบบตามที่กระทรวง ทบวง กรุ่ม จะ กำหนดขึ้นใช้ตามความเหมาะสม เว้นแต่มีแบบตามกฎหมายเฉพาะเรื่องให้ทำตามแบบ เช่น โฉนด แผนที่ สัญญา หลักฐานการสืบสวนและสอบสวน และคำร้อง เป็นต้น"},{"n":52,"q":"หนังสือภายนอก ต้องใช้กระดาษตราครุฑขนาดเท่าใด","o":["1 เซนติเมตร","1.5 เซนติเมตร","3 เซนติเมตร","3.5 เซนติเมตร"],"a":3,"e":"หนังสือภายนอก คือ หนังสือติดต่อราชการที่มีความเป็นทางการสูง เป็นหนังสือ ที่ติดต่อกันระหว่างสวนราชการ หรือส่วนราชการติดต่อหน่วยงานอื่นที่ไม่ใช่ราชการ หรือ บุคคลภายนอก ใช้กระดาษตราครุฑ 3 เซนติเมตร"},{"n":53,"q":"หนังสือข้อใดต่อไปนี้ไม่จำเป็นต้องใช้กระดาษตราครุฑ","o":["ข้อบังคับ","จดหมายข่าว","แถลงการณ์","ประกาศ"],"a":2,"e":"ดูบรรยายเพิ่มเติมข้อ 49.-50. ประกอบ"},{"n":54,"q":"หนังสือที่สั่งการให้เจ้าหน้าที่ปฏิบัติในทันทีที่ได้รับหนังสือนั้น เป็นชั้นความเร็วประเภทใด","o":["ด่วน","ด่วนที่สุด","ด่วนมาก","เร่งด่วน"],"a":2,"e":"ชั้นความเร็วของหนังสือราชการแบ่งออกเป็น 3 ประเภท ได้แก่ 1. ด่วนที่สุด ให้เจ้าหน้าที่ปฏิบัติในทันทีที่ได้รับหนังสือนั้น 2. ด่วนมาก ให้เจ้าหน้าที่ปฏิบัติโดยเร็ว 3. ด่วน ให้เจ้าหน้าที่ปฏิบัติเร็วกว่าปกติเท่าที่จะทำได้"},{"n":55,"q":"หนังสือที่ต้องส่งถึงผู้รับจำนวนมากและมีเนื้อหาอย่างเดียวกัน คือหนังสือชนิดใด","o":["หนังสือข่าว","หนังสือคำสั่ง","หนังสือประกาศ","หนังสือเวียน"],"a":4,"e":"หนังสือเวียน คือ หนังสือที่มีถึงผู้รับเป็นจำนวนมาก มีเนื้อหาอย่างเดียวกันโดยให้เพิ่มรหัสตัวพยัญชนะ \"หน้าเลข ทะเบียนหนังสือส่ง ซึ่งกำหนดเป็นเลขที่หนังสือเวียนโดยเฉพาะ เริ่มตั้งแต่เลข 1 เรียงเป็นลำดับไปจนถึงสิ้นปีปฏิทิน หรือ ใช้เลขที่ของหนังสือทั่วไปตามแบบหนังสือภาย นอกอย่างใดอย่างหนึ่ง"},{"n":56,"q":"หนังสือที่มีคุณค่าทางประวัติศาสตร์ให้เก็บรักษาไว้กี่ปี","o":["10 ปี","20 ปี","30 ปี","เก็บรักษาไว้ตลอดไป"],"a":4,"e":"หนังสือที่มีคุณค่าทางประวัติศาสตร์ทุกสาขาวิชา และมีคุณค่าต่อการศึกษา ค้นคว้าวิจัย ให้เก็บไว้เป็นหลักฐาน สำคัญทางประวัติศาสตร์ของชาติตลอดไป หรือตามที่สำนักหอจดหมายเหตุแห่งชาติ กรมศิลปากร กำหนด"},{"n":57,"q":"การจัดเก็บหนังสืออิเล็กทรอนิกส์ให้จัดเก็บในรูปแบบไฟล์ใด","o":["EXE","PDF","PSD","WORD"],"a":2,"e":"หนังสืออิเล็กทรอนิกส์ที่เก็บไว้ในการสำรองข้อมูล และที่ส่งให้สำนักหอจดหมายเหตุแห่งชาติ กรมศิลปากร ให้อยู่ ในรูปแบบมาตรฐาน เช่น PDF ความละเอียกไม่น้อยกว่า 150 dpi และให้ตั้งชิอไฟล์ตามหลักเกณฑ์ที่กำหนด"},{"n":58,"q":"หนังสือใดต่อไปนี้ห้ามส่งผ่านงานสารบรรณอิเล็กทรอนิกส์","o":["หนังสือชั้นด่วน","หนังสือชั้นด่วนที่สุด","หนังสือขั้นลับ","หนังสือชั้นลับที่สุด"],"a":4,"e":"ตามระเบียบสำนักนายกรัฐมนตริว่าด้วยงานสารบรรณ ฉบับที่ 4 พ.ศ. 2564หมวด 5 กำหนดให้ส่วนราชการ จัดระบบสารบรรณอิเล็กทรอนิกส์เพื่อปฏิบัติงานสารบรรณหรืออย่างน้อยต้องมีที่อยู่ไปรษณีย์อิเล็กทรอนิกส์กลาง ( E- mail) เพื่อใช้รับ - ส่งหนังสือ อิเล็กทรอนิกส์ข
