ละเข้าใจ"},{"n":76,"q":"การเขียนโดยมีวัตถุประสงค์ให้ผู้อ่านเปลี่ยนทัศนคติตามที่ผู้เขียนต้องการจะถ่ายทอด","o":["ข่าวแจก","บทความ","คำบรรยายประกอบภาพ","สิ่งพิมพ์โฆษณาประชาสัมพันธ์"],"a":2,"e":"วัตถุประสงค์ของบทความเพื่อการประชาสัมพันธ์ มีดังนี้ 1. เพื่อแจ้งให้ทราบ คือ บทความมักจะประกอบด้วยเนื้อหาเกี่ยวกับการให้รายละเอียด ข้อเท็จจริงเกี่ยวกับเรื่องที่เขียน อย่างชัดเจน ครบถ้วนทุกประเด็น เพื่อให้ผู้อ่านได้รับ ข้อมูลที่ต้องการสื่อสารอย่างแท้จริง 2. เพื่อโน้มน้าวใจ คือ บทความมีความตั้งใจที่จะให้ผู้อ่านเปลี่ยนทัศนคติตามที่ผู้เขียนต้องการจะถ่ายทอด ซึ่งการที่จะ บรรลุผลเช่นนี้ได้นั้น นอกจากที่ผู้เขียนจะให้รายละเอียดข้อมูลด้าน ต่าง ๆ แล้ว จำเป็นอย่างยิ่งที่จะต้องหาหลักฐานมาใช้ อ้างอิงประกอบการเขียนให้มากพอสมควร หำเหตุผลที่มาสนับสนุนเทคนิคสำหรับการเขียนว่า ต้องการโน้มน้าวใจเรื่อง ใดให้ผู้อ่านตระหนักถึงผลดีและผลเสียที่จะเกิดขึ้น ผ่านการใช้ภาษาที่ต้องกระตุ้นอารมณ์ด้วยเหตุผลนานาประการ"},{"n":77,"q":"เอกสารเพื่อถ่ายทอดข้อมูลผ่านหนังสือพิมพ์ที่เผยแพร่ไปได้อย่างกว้างขวาง","o":["ข่าวแจก","บทความ","คำบรรยายประกอบภาพ","สิ่งพิมพ์โฆษณาประชาสัมพันธ์"],"a":1,"e":"ข่าวแจก (Press Release หรือ News Release) หมายถึง ข่าวเพื่อการประชาสัมพันธ์ที่นักประชาสัมพันธ์ใช้ในการ ถ่ายทอดข้อมูลต่าง ๆ ขององค์กร เพื่อเยแพร่ไป ยังประชาชนกลุ่มเป้าหมาย โดยผ่านสื่อหรือช่องทาง ( Channel) ต่าง ๆ ตามความเหมาะสมโดยนักประชาสัมพันธ์อาจส่งข่าวแจกนี้เพื่อประชาสัมพันธ์ผ่านหนังสือพิมพ์ที่สามารถเผยแพร่ไปได้ อย่างกว้างขวางมากกว่าสื่ออื่น ๆ เนื่องจากนิตยสาร วิทยุกระจายเสียง โทรทัศน์ เป็นสื่อ ที่กลุ่มเป้าหมายเลือกรับ และ ค่อนข้างเป็นสื่อที่เฉพาะเจาะจง จึงแตกต่างจากหนังสือพิมพ์ที่มีประชาชนโดยทั่วไปอ่าน"},{"n":78,"q":"กลุ่มเป้าหมายใด คือ Internal Publics ของบริษัท","o":["ประชาชนที่เข้าร่วมกิจกรรมที่บริษัทจัดขึ้น","หน่วยงานผู้ให้การสนับสนุนกิจกรรมของบริษัท","กรรมการผู้ร่วมวางแผนการตลาดให้กับบริษัท","ทีมงานวิจัยที่รับจ้างวิจัยการตลาดให้กับบริษัท"],"a":3,"e":"กลุ่มเป้าหมายในการประชาสัมพันธ์ แบ่งออกเป็น 1. กลุ่มเป้าหมายภายในองค์กร (Internal Publics) ได้แก่ กลุ่มบุคคล พนักงาน เจ้าหน้าที่ที่ทำงานอยู่ภายในองค์กร สถาบัน หรือหน่วยงาน เช่น กรรมกาผู้ร่วมวางแผนการตลาดให้กับบริษัท เป็นต้น 2. กลุ่มเป้าหมายภายนอกองค์กร (External Publics) ได้แก่ กลุ่มบุคคล ประชาชนทั่วไป ที่อยู่ภายนอกองค์กร สถาบัน หรือหน่วยงาน ทั้งประชาชนผู้มีส่วนเกี่ยวข้องกับองค์กรโดยตรง ประชาชนในชุ่มชัน และประชาชนทั่วไป"},{"n":79,"q":"หลักเกณฑ์ในการเขียนข่าวแจก ควรบรรจุเนื้อหาที่ใช้หลักการเขียน 5W1H ไว้ที่ส่วนใด","o":["พาดหัวข่าว","ความน้า","เนื้อหาข่าว","ส่วนสรุปท้ายข่าว"],"a":3,"e":"เนื้อหาข่าว (Body) เป็นส่วนที่บรรจุเนื้อหารายละเอียดของข่าวทั้งหมด โดยตอบคำถาม 5W1H ได้อย่างครบถ้วน"},{"n":80,"q":"ข้อดีของการประชาสัมพันธ์องค์กรผ่านเครือข่ายสังคมออนไลน์ ยกเว้นข้อใด","o":["เกิดการเชื่อมโยงระหว่างกลุ่มเพื่อนหลายรูปแบบ","ทุกคนสามารถเข้ามาดูหรือติดต่อได้โดยไม่จำกัด","สามารถเข้าถึงได้อย่างรวดเร็วทุกเวลา","ชุมชนออนไลน์มีนโยบายความเป็นส่วนตัวที่ชัดเจน"],"a":2,"e":"การประชาสัมพันธ์ผ่านเครือข่ายสังคมออนไลน์ ( Online Social Networking) หรือชุมชนออนไลน์ เป็นช่อง ทางการสื่อสารที่ได้รับความนิยมมากในปัจจุ บัน โดยเริ่มต้นจากการสร้างพื้นที่เพื่อเป็นที่ชุมนุมของกลุ่มคนที่มีความ สนใจหรือความต้องการคล้าย ๆ กัน ทั้งนี้ชุมชนออนไลน์ส่วนใหญ่จะมีนโยบายความเป็นส่วนตัวที่ชัดเจน ซึ่งผู้ใช้บริการ สามารถกำหนดได้ว่า จะให้สมาชิกคนใดเข้ามาดูหรือติดต่อกับตนเองได้ จึงช่วยให้เกิดการเชื่อมโยงระหว่างกลุ่มเพื่อน ในหลายรูปแบบ และเกิดปฏิสัมพันธ์สม ่าเสมอต่อเนื่องจนกลายเป็นสังคมบนโลกออนไลน์ซึ่งทุกคนสามารถเข้าถึงได้ อย่างรวดเร็ว ทุกเวลา ทุกสถานที่อย่างไม่มีขีดจำกัด อีกทั้งยังสามารถสร้างการใช้งานได้หลายรูปแบบทั้งการเขียน ข้อความ เรื่องราว แบ่งปัน รูปภาพ ภาพเคลื่อนไหวโดยการนำเนื้อหาจากสื่อต่าง ๆ มาแชร์ (Share) จะช่วยทำให้ข้อมูล กระจายออกไปในวงกว้างได้อย่างรวดเร็ว"},{"n":81,"q":"บทความประเภทใดที่ผู้เขียนต้องใช้ทักษะการจับประเด็นและเลือกสรรประเด็น เพื่อการนำเสนอจาก การ พูดคุยที่น่าสนใจ","o":["บทความสารคดี","บทความบรรยาย","บทความสัมภาษณ์","บทความวิจารณ์"],"a":3,"e":"บทความสัมภาษณ์ คือ บทความที่ยกคำสัมภาษณ์ของบุคคลมาเขียนเผยแพร่ โดยที่คำสัมภาษณ์อาจเป็นการให้ ข้อมูลเกี่ยวกับบุคคลที่น่าสนใจหรือเหตุการณ์ใหม่ ๆ โครงการใหม่ ๆรวมถึงเป็นการให้รายละเอียดเรื่องหนึ่งเรื่องใดก็ได้ ซึ่งบทความสัมภาษณ์นี้ใช้ได้ในกรณีที่ต้องการแนะนำบุคคล เหตุการณ์ สถานที่ และใช้ในกรณีที่ชี้แจงรายละเอียดให้ ข้อมูลเพิ่มเติมโดยนำไปใช้ได้ทั้งงานประชาสัมพันธ์ภายในและภายนอกองค์กร ทั้งนี้ผู้เขียนสามารถสอดแทรกความ คิดเห็นผสานกับข้อความสัมภาษณ์ เพื่อให้บทความมีชีวิตชีวามากขึ้น และผู้เขียนจำเป็นอย่างยิ่งที่จะต้องมีทักษะในการ จับประเด็นของข้อมูลที่ได้รับจากการสัมภาษณ์ได้อย่างครบถ้วนรวมทั้งเลือกสรรประเด็นในการนำเสนอที่น่าสนใจ"},{"n":82,"q":"หากนักประชาสัมพันธ์วางแผนจะประชาสัมพันธ์ผ่านไฟล์มัลติมีเดียที่มุ่งหวังให้คนเข้าชมได้หลาย ครั้งและเข้าชมได้ตลอดเวลา ควรประชาสัมพันธ์ผ่านสื่อออนไลน์ประเภทใด","o":["Twitter (X)","YouTube","Facebook","Instagram"],"a":2,"e":"การประชาสัมพันธ์ผ่านการฝากและแบ่งปันไฟล์ประเภทมัลติมีเดีย ( Multimedia) คือ การประชาสัมพันธ์ผ่าน เว็บที่เปิดบริการรับฝากหรือแบ่งปันไฟล์ประเภทต่าง ๆ เช่น ภาพคลิป ภาพยนตร์ เพลง โดยเว็บที่นิยมใช้กันมากที่สุด คือ ยูทูบ (YouTube) ซึ่งสามารถเข้าชมได้หลายครั้งเท่าที่ต้องการและเข้าชมได้ตลอดเวลา ทั้งนี้องค์กรต่าง ๆ ได้นำรายการ หรือเนื้อหา ที่เคยแพร่ภาพทางโทรทัศน์หรือในเว็บไซต์ขององค์กรมาเผยแพร่ซ ้าอีกบนยูทูบ โดยปรับเนื้อหาและรูปแบบ ให้เหมาะสม ทั้งยังสามารถสร้างกลุ่มผู้ติดตามในช่องยูทูบนั้น ๆ ได้ตามความสนใจ"},{"n":83,"q":"หากบริษัทต้องการประชาสัมพันธ์ข่าวสารเกี่ยวกับการส่งเสริมการขาย การจัดกิจกรรมพิเศษด้วย ข้อความ สั้นไม่เกิน 280 ตัวอักษร ควรเลือกสื่อออนไลน์ประเภทใด","o":["Twitter (X)","YouTube","Facebook","Instagram"],"a":1,"e":"การเขียนเพื่อการประชาสัมพันธ์ผ่านทาง Twitter หรือ X แต่เดิมกำหนดให้พิมพ์ข้อมูลได้ไม่เกิน 140 ตัวอักษร (ปัจจุบันเปลี่ยนให้ใช้ได้ไม่เกิน 280 ตัวอักษร) ดังนั้นข้อความที่ส่งจึงต้องเน้นความสั้น กระชับ ชัดเจนยิ่งกว่าช่องทางอื่น ๆ โดยผู้เขียนต้องเลือกใช้ตัวอักษรและข้อความให้เหมาะสม เพื่อสามารถสื่อสารได้ตามต้องการ ทั้งนี้ Twitter (X) จะ เหมาะกับการส่งข่าวสารองค์กรที่เกี่ยวกับการส่งเสริมการขาย การนำเสนอสินค้าใหม่การจัดกิจกรรมพิเศษ การแนะนำ เหตุการณ์หรือ Event ที่น่าสนใจ การตอบคำถามหรือแก้ไข ข้อสงสัย ข้อข้องใจ การชวนให้มา ร่วมกิจกรรม โดยเน้น เนื้อหาที่เป็นเรื่องน่ารู้ เป็นประโยชน์ต่อผู้ติดตาม เพื่อให้เกิดการบอกต่อด้วยการ Retweet"},{"n":84,"q":"หากมหาวิทยาลัยต้องการประชาสัมพันธ์กำหนดการลงทะเบียนให้นักศึกษาทราบอย่างทั่วถึงที่สุด และสามารถตอบคำถามได้ทันทวงที่ 1 หาวิทยาลัยควรเลือกใช้สื่อออนไลน์ประเภทใด","o":["Twitter (X)","YouTube","Facebook","Instagram"],"a":3,"e":"การสื่อสารผ่านสื่อสังคมออนไลน์ที่ได้รับความนิยมมากที่สุด คือ เฟซบุ๊ก (Facebook) ซึ่งนักประชาสัมพันธ์ สามารถนำเฟซบุ๊กมาใช้ประชาสัมพันธ์ผ่านรูปแบบเฟซบุ๊กแฟนเพจ ซึ่งเปรียบเสมือนหน้าตาของบริษัท ด้วยการบริหาร จัดการเนื้อหาและปฏิสัมพันธ์ที่เกิดขึ้นระหว่างองค์กรกับกลุ่มเป้าหมาย และยังสามารถเลือกใช้เครือข่ายสังคมออนไลน์ อื่น ๆเข้ามาผสมผสานและเสริมซึ่งกันและกันด้วยระบบการเชื่อมโยงระหว่างเครือข่าย เช่น การใช้เฟซบุ๊กรวมไปกับการ แชร์คลิปภาพจากยูทูปหรือข้อมูลจากลิงก์ต่าง ๆ การถ่ายทอดสดการออกอากาศรายการผ่านเฟซบุ๊ก ไลฟ์ เพื่อเปิดโอกาส ให้ผู้ชมได้มีปฏิสัมพันธ์ในแบบเรียลไทม์ผ่านการแสดงความคิดเห็น และสามารถตอบประเด็นข้อคำถามได้ทันท่วงที"},{"n":85,"q":"ข้อใดคือเป้าหมายสำคัญที่สุดของการโฆษณา","o":["การสร้างความนิยมในกลุ่มผู้บริโภค","การสร้างผลประกอบการให้มีกำไร","การส่งสารถึงมวลชน","การเผยแพร่สินค้าให้เป็นที่รู้จักอย่างทั่วถึง"],"a":2,"e":"การเขียนโฆษณา เป็นการนำเสนอ เผยแพร่สินค้าหรือบริการ เป็นกิจกรรมที่มีการ สื่อสารสู่มวลขน เพื่อให้มีผู้นิยม โดยมีกำไรในสินค้าเป็นเป้าหมายสำคัญที่สุด"},{"n":86,"q":"ส่วนพาดหัวของโปสเตอร์ คือจุดมุ่งหมายใด","o":["Attention","Interest","Desire","Action"],"a":1,"e":"โปสเตอร์เพื่อการโฆษณามีจุดมุ่งหมาย คือ AIDA ซึ่งประกอบด้วย 1. เพื่อก่อให้เกิดความสะดุดใจ (Attention) สามารถหยุดผู้บริโภคได้ด้วยข้อความพาดหัวหรือหัวเรื่องโฆษณา 2. เพื่อกระตุ้นความสนใจ (Interest) ซึ่งความสนใจของผู้บริโภคจะเกิดขึ้นหลังจากที่โฆษณา ตึงดูดความสนใจไว้ได้ และผู้บริโภคจะพยายามหาคำตอบ ได้แก่ ข้อความบอกรายละเอียด ถึงประโยชน์และคุณสมบัติที่ผู้บริโภคจะได้รับจาก การซื้อสินค้า 3. เพื่อสร้างความปรารถนา ( Desire) โดยใช้ภาษามาสร้างแรงกระตุ้น โน้มน้าวใจผู้บริโภค ด้วยเหตุผล และการเร้า อารมณ์ ได้แก่ ข้อความลงท้าย 4. เพื่อให้เกิดการปฏิบัติ (Action) โดยใช้ภาษาที่สร้างความประทับใจ จดจำง่าย ได้แก่คำขวัญโฆษณา"},{"n":87,"q":"หากนักศึกษาอยากจะทราบว่าสินค้าที่กำลังจะซื้อนั้นมีคุณสมบัติพิเศษอย่างไรบ้าง ซื้อไปแล้วคุ้มค่า หรือไม่มีประโยชน์อย่างไร ต้องดูจากรายละเอียดข้อใด","o":["รูปภาพ","พาดหัว","เนื้อหา","ข้อความลงท้าย"],"a":3,"e":"ข้อความบอกรายละเอียด (Body Text) เป็นส่วนของเนื้อหา สำหรับสินค้าใหม่ที่ประชาชนยังไม่เข้าใจประโยชน์ ว่า ใช้ทำอะไร ใช้อย่างไร หรือรู้จักแล้ว แต่การโฆษณาต้องการเน้นถึงประโยชน์เพื่อการจูงใจซื้อ จึงควรชี้ให้เห็นว่า สินค้านี้มีประโยชน์อย่างไร คุ้มค่าอย่างไร ส่วนประโยชน์อื่น ๆ หรือรายละเอียดเกี่ยวกับสินค้านั้น ถ้ามีคุณสมบัติพิเศษ การเขียนข้อความควรมิรายละเอียดส่วนนี้เอาไว้ด้วย เพื่อสร้างความสนใจเป็นพิเศษแก่ผู้อ่าน"},{"n":88,"q":"ข้อความโฆษณา \"โดโซะ คำดี ๆ มีดีได้ทุกวัน\" มีการโฆษณาที่โดดเด่นในด้านใด","o":["ใช้สำนวนที่น่าสนใจ จดจำได้ง่าย","ข้อความกะทัดรัด สละสลวย","อ่านง่าย","ข้อความไม่เกินความจริง"],"a":1,"e":"การใช้ภาษาเพื่อการเขียนโฆษณา มีดังนี้ 1. ใช้สำนวนที่น่าสนใจ จดจำได้ง่าย เช่น โดโซะ คำดี ๆ มีดีได้ทุกวัน, อะไรดี….บุ๋มก็ว่าดี ฯลฯ 2. ใช้ข้อความที่กะทัดรัด สละสลวย เพื่อให้สื่อเรื่องได้ตรงตามวัตถุประสงค์และเข้าใจง่าย 3. เขียนอักษรให้อ่านง่าย เขียนสะกดการันต์เพื่อความถูกต้อง 4. ใช้ภาษาที่บ่งบอกให้รู้ว่า สินค้าที่นำเสนอคืออะไร ใช้ประโยชน์อะไร ทำไมถึงต้องใช้ 5. ไม่เขียนข้อความเกินความจริง และไม่ใส่ร้ายสินค้าชนิดอื่น ๆ"},{"n":89,"q":"สื่อใดเหมาะสมกับการนำเสนอเนื้อหาที่ไม่ให้รายละเอียดปลีกย่อยมาก มีภาพหน้าปกและชื่อเรื่องที่ ต้องเด่นชัดและสื่อความหมายได้ทันที","o":["แผ่นพับ","แผ่นปลิว","โปสเตอร์","แค็ตตาล็อก"],"a":1,"e":"แผ่นพับ หมายถึง กระดาษแผ่นเดียวที่พับแล้วจะมีขนาด 4 x 9 นิ้ว เนื้อที่กระดาษ ค่อนข้างจำกัด จึงบรรจุเนื้อความ ได้น้อย ส่วนที่ให้ข้อมูลจะอยู่ด้านใน ภาพหน้าปกและชื่อเรื่องจะต้องเด่นชัดและสื่อความหมายได้ทันที เนื้อหาต้องไม่ให้ รายละเอียดปลีกย่อยมาก เลือกเสนอเนื้อหาเฉพาะประเด็นสำคัญ โดยใช้ถ้อยคำเรียบง่าย สั้น กระชับ และสื่อความหมาย ได้อย่างตรงไปตรงมา"},{"n":90,"q":"การโฆษณาที่มุ่งบ่งบอกคุณสมบัติของสินค้า บอกรุ่น และราคา จะปรากฏในสื่อโฆษณาใด","o":["แผ่นพับ","แผ่นปลิว","โปสเตอร์","แค็ตตาล็อก"],"a":4,"e":"แค็ตตาล็อก หมายถึง หนังสือ หรือเอกสาร สิ่งพิมพ์ที่มีภาพสินค้า เช่น เสื้อผ้า เครื่องใช้ไฟฟ้า พร้อมรายละเอียด ของสินค้าเพื่อเผยแพร่หรือให้ลูกค้าเลือกซื้อ นิยมใช้ภาพ สีสันสวยงาม มีคำอธิบายประกอบพอสมควร ใช้ภาษาสั้น ๆ ตรงไปตรงมา มีการเขียนบอก คุณสมบัติของสินค้า บอกรุ่น แล ะราคา ตลอดจนให้สถานที่ในการติดต่อสั่งซื้อหรือ สอบถามรายละเอียดเพิ่มเติม"},{"n":91,"q":"หากนักศึกษาจะซื้อชั้นวางหนังสือ เพื่อจะนำไปใช้ในห้องพักของตนเอง นักศึกษาควรต้องเลือกดู จากสื่อใดเป็นเบื้องต้น","o":["แผ่นพับ","แผ่นปลิว","โปสเตอร์","แค็ตตาล็อก"],"a":4,"e":"ดูบรรยายเพิ่มเติมข้อ 90. ประกอบ"},{"n":92,"q":"ข้อใดคือลักษณะของแผ่นพับที่ถูกต้อง","o":["มีภาพประกอบและคำอธิบายอย่างละเอียด","มีเนื้อหาที่สำคัญ ประเด็นสั้นกระชับ","ทำจากกระดาษขนาดใดก็ได้ พับเป็นสามช่วง","สามารถบรรจุข้อมูลได้มากและครบถ้วน"],"a":2,"e":"ดูบรรยายเพิ่มเติมข้อ 89. ประกอบ"},{"n":93,"q":"ข้อความในโฆษณาชิ้นนี้ใช้หลักการเขียนข้อใด","o":["ใช้ข้อความเกินความจริง เพื่อดึงดูดความสนใจ","ใช้ข้อความที่สื่อความหมายให้เข้าใจง่าย","ใช้สำนวนที่น่าสนใจ จดจำได้ง่าย","ใช้ภาษาที่บ่งบอกให้รู้ว่า สินค้าที่นำเสนอคืออะไร ใช้ประโยชน์อะไร"],"a":4,"e":"ดูบรรยายเพิ่มเติมข้อ 88. ประกอบ","im":["ad"]},{"n":94,"q":"โปสเตอร์ข้างต้นมีจุดมุ่งหมายได้ในการโฆษณา","o":["เพื่อก่อให้เกิดความสะดุดใจ","เพื่อกระตุ้นความสนใจ","เพื่อสร้างความประรถนา","เพื่อให้เกิดการปฏิบัติ"],"a":2,"e":"ดูบรรยายเพิ่มเติมข้อ 86. ประกอบ","im":["ad"]},{"n":95,"q":"ข้อความ \"อะไรดี....บุ๋มก็ว่าดี\" ใช้หลักการเขียนข้อใด","o":["ใช้สำนวนที่น่าสนใจ จดจำได้ง่าย","ใช้ข้อความที่สื่อความหมายให้เข้าใจง่าย","ใช้ข้อความเกินความจริง เพื่อดึงดูดความสนใจ","ใช้ภาษาที่บ่งบอกให้รู้ว่า สินค้าที่นำเสนอคืออะไร ใช้ประโยชน์อะไร"],"a":1,"e":"ดูบรรยายเพิ่มเติมข้อ 88. ประกอบ"},{"n":96,"q":"\"ยิ่งเล่น ยิ่งเรียนรู้ ยิ่งดี\" เป็นการใช้ภาษาโฆษณาเพื่อวัตถุประสงค์ใด","o":["บ่งบอกลักษณะเด่นของผู้ใช้ผลิตภัณฑ์","ชักจูงให้ผู้จัดจำหน่ายรับผลิตภัณฑ์ไปจำหน่าย","ขี้แจงคุณสมบัติของส่วนประกอบผลิตภัณฑ์","สะท้อนคุณสมบัติที่ชัดเจนของผลิตภัณฑ์"],"a":1,"e":"ข้อความที่ว่า \"ยิ่งเล่น ยิ่งเรียนรู้ ยิ่งดี\" เป็นการใช้ภาษาโฆษณาเพื่อวัตถุประสงค์คือ บ่งบอกลักษณะเด่นของผู้ใช้ ผลิตภัณฑ์ ซึ่งผู้ใช้ผลิตภัณฑ์ที่เป็นกลุ่มเป้าหมาย ได้แก่ เด็ก"},{"n":97,"q":"ข้อใดมิใช่การพูดที่ดี","o":["พูดมีสาระ","พูดน่าฟัง","พูดตามที่คิด","พูดมีประโยชน์"],"a":3,"e":"วัตถุประสงค์ของการเรียนวิชาการพูดประการหนึ่ง ได้แก่ เพื่อสร้างมนุษย์สัมพันธ์คือ การพูดดี พูดมีประโยชน์ พูด น่าฟัง ยอมทำให้ผู้พูดเป็นที่รักและมีมิตรมาก นอกจากนี้การพูด ที่ดียังมีส่วนช่วยคลี่คลายปัญหาความขัดแย้งต่าง ๆ ได้"},{"n":98,"q":"การประชุม จัดเป็นการพูดแบบใด","o":["การพูดระหว่างบุคคล","การพูดในกลุ่ม","การพูดในที่ชุมนุมชน","การพูดทางสื่อสารมวลชน"],"a":2,"e":"การพูดในกลุ่ม เป็นการพูดที่มีบุคคลเข้าร่วมพูดกันตั้งแต่ 3 คนขึ้นไปจำนวนบุคคลที่พูดในกลุ่มจะสูงสุดเท่าใดยาก ที่จะกำหนดได้ ขึ้นอยู่กับโอกาส สถานที่ และเครื่องอำนวยความสะดวกที่ทำให้การพูดจากันของบุคคลกลุ่มนั้นดำเนิน ไปได้ ซึ่งการพูดในกลุ่มนี้อาจจะเรียกอีกอย่างว่า \"การอภิปรายกลุ่ม\" มักเป็นการพูดจากันในเชิงปรึกษาหารือเพื่อหาทาง แก้ปัญหาร่วมกัน บางทีก็มีการโต้แย้งถกเถียงกันบ้าง แต่บางทีก็เป็นการประชุมที่มีการแลกเปลี่ยนความรู้ ความคิด และ ประสบการณ์ของกันและกัน ทุกคนที่ร่วมอยู่ในกลุ่มผลัดเปลี่ยนกันเป็นผู้พูดและผู้ฟัง อาจจะมีประธานของกลุ่มหรือไม่ มีก็ได้"},{"n":99,"q":"การกล่าวคำปราศรัยในที่สาธารณะ จัดเป็นการพูดแบบใด","o":["การพูดระหว่างบุคคล","การพูดในกลุ่ม","การพูดในที่ชุมนุมชน","การพูดทางสื่อสารมวลชน"],"a":3,"e":"การพูดในที่ชุมนุมชน เป็นการพูดหน้าที่ประชุม อาจเป็นเพียงคนเดียวหรืออาจร่วมคณะกับคนอื่นก็ได้ โดยจะเป็น การพูดกับกลุ่มผู้ฟังที่มีจำนวนมาก ซึ่งจำนวนผู้ฟังจะมาก น้อยเพียงไรขึ้นอยู่กับโอกาส กาลเทศะ และเงื่อนไขต่าง ๆ ทั้งนี้ การพูดในที่ชุมนุมชนแบ่งได้ชัดเจนว่า ใครเป็นผู้พูดหลัก และใครเป็นผู้ฟัง เช่น การปาฐกถา การอภิปรายในที่สาธารณะ การโฆษณาหาเสียง การปราศรัย การกล่าวต้อนรับ การบรรยายสรุป การชี้แจงต่อที่ประชุมและการพูดในโอกาสพิเศษ ต่าง ๆ ต่อหน้าที่ประชุม (เช่น การกล่าวสุนทรพจน์ในพิธีเปิดงาน)"},{"n":100,"q":"การพูดในข้อใดที่ผู้พูดไม่เห็นผู้ฟัง","o":["การพูดระหว่างบุคคล","การพูดในกลุ่ม","การพูดในที่ชุมนุมชน","การพูดทางสื่อสารมวลชน"],"a":4,"e":"การพูดทางสื่อสารมวลชนจะแตกต่างจากการพูดระดับอื่น ๆ ในข้อที่สำคัญที่สุด คือ สามารถพูดให้คนฟังจำนวน มากที่กระจายกันอยู่ทุกทิศทางรับฟังพร้อมกันได้ในเวลาเดียวกัน แต่การพูดทางสื่อสารมวลขนนั้น ผู้พูดไม่สามารถ สังเกตปฏิกิริยาตอบสนองจากผู้ฟังพร้อมกันได้ในขณะที่พูด ทั้งนี้เนื้อหาของการพูดมักจะเป็นการให้ข่าวสาร ให้ความรู้ ให้ข้อคิดให้ความบันเทิง การโฆษณาสินค้า และการบริการต่าง ๆ โดยการพูดทางสื่อสารมวลชนที่ใช้มากที่สุด คือ การ พูดทางโทรทัศน์ ซึ่งบุคคลที่พูดทางสื่อสารมวลชนมี 2 ประเภทใหญ่ ๆ ดังนี้ 1. ผู้ที่มีอาชีพเป็นผู้ประกาศและผู้จัดรายการ ซึ่งพูดอยู่เป็นประจำ บุคคลเหล่านี้ถือว่าประกอบวิชาชีพโดยตรง 2. ผู้ที่ได้รับเชิญให้มาพูดในรายการต่าง ๆ เป็นครั้งคราว และบุคคลในวงการต่าง ๆ ที่มีโอกาสได้รับเชิญให้ไปปรากฏ ตัวทางโทรทัศน์อยู่เนือง ๆ เช่น การที่ดาราจัดแถลงข่าวผ่านโทรทัศน์เพื่อขี้แจงประเด็นร้อนที่ประชาชนสนใจ ฯลฯ"},{"n":101,"q":"การที่ดาราจัดแถลงข่าวผ่านโทรทัศน์ จัดเป็นการพูดประเภทใด","o":["การพูดระหว่างบุคคล","การพูดในกลุ่ม","การพูดในที่ชุมนุมชน","การพูดทางสื่อสารมวลชน"],"a":4,"e":"ดูบรรยายเพิ่มเติมข้อ 100. ประกอบ"},{"n":102,"q":"ข้อใดแสดงให้เห็นว่า ผู้พูดมีความสุขที่ได้ถ่ายทอดความรู้ให้ผู้อื่น","o":["เป็นนักฟังที่ดี","ศึกษาหาความรู้อยู่เสมอ","ไม่หวงความรู้","ยอมรับฟังคำวิจารณ์"],"a":3,"e":"คุณสมบัติที่สำคัญเบื้องต้นของนักพูดที่ดีมีอยู่ 5 ประการ ดังนี้ 1. เป็นนักฟังที่ดี 4. เป็นตัวของตัวเอง 2. ศึกษาหาความรู้อยู่เสมอ 5. มีความสุขในการถ่ายทอดความรู้ให้ผู้อื่น ไม่หวงความรู้ 3. อ่อนน้อมถ่อมตน ยอมรับฟังคำวิจารณ์"},{"n":103,"q":"การบรรยายโดยทั่วไป นิยมใช้การพูดแบบใด","o":["การพูดโดยมีการเตรียมตัวล่วงหน้า","การพูดโดยการท่องจำ","การพูดโดยฉับพลัน","การพูดโดยอ่านจากต้นฉบับ"],"a":1,"e":"การพูดโดยมีการเตรียมตัวล่วงหน้า เป็นการพูดที่ผู้พูดจะพูดจากความเข้าใจเนื้อหาที่ต้องการถ่ายทอดให้แก่ผู้ฟัง โดยผู้พูดจะต้องศึกษาค้นคว้าและเตรียมตัวล่วงหน้ามาเป็นอย่างดี จึงเป็นวิธีที่เหมาะสมที่สุดกับการพูดในแทบทุกโอกาส และเป็นที่นิยมใช้กันมาก เพราะทำให้ผู้พูดไม่สับสน มีการเรียงลำดับเรื่องว่าจะพูดอะไรก่อนหลัง ไม่ทำให้การพูดวกวน ตัวอย่างของการพูดชนิดนี้ ได้แก่ การบรรยาย- การอภิปราย เป็นต้น"},{"n":104,"q":"ข้อใดเป็นการพูดไม่สอดคล้องกับเนื้อหา ซึ่งผู้พูดควรระวัง","o":["พูดคำคมสุภาษิต","พูดอธิบายให้เห็นภาพ","พูดเรื่องส่วนตัว","พูดยกตัวอย่าง"],"a":3,"e":"มารยาทในการพูด มีดังนี้ 1. ผู้พูดต้องพูดให้สอดคล้องกับเนื้อหาที่จะพูด ไม่พูดเรื่องส่วนตัวหากไม่มีใครซักถามและควรลำดับเนื้อหาในการพูด มาเป็นอย่างดี 2. ผู้พูดต้องให้เกียร์ผู้ฟัง ไม่แสดงความอวดรู้ ไม่กล่าวโทษ หรือไม่แสดงอาการดูถูกเยาะเย้ยถากถางผู้ฟัง 3. ผู้พูดที่ดีควรมีความอ่อนน้อมถ่อมตน เปิดใจรับฟังความคิดเห็นของผู้อื่น 4. ผู้พูดต้องไม่กล่าวร้ายกระทบกระเทียบใคร หรือพูดอะไรที่สร้างความเสียหายให้กับผู้อื่น ฯลฯ"},{"n":105,"q":"ข้อใดมิใช่องค์ประกอบของกระบวนการฟัง","o":["ตอบสนอง","ตีความ","ได้ยิน","สั่งการ"],"a":4,"e":"การฟัง ถือเป็นกระบวนการของการสื่อสาร ซึ่งประกอบด้วย 1. การได้ยิน 2. การตีความ 3. การเข้าใจ 4. การตอบสนอง"},{"n":106,"q":"ข้อใดเป็นการให้เกียรติผู้พูดด้วยการแสดงให้เห็นถึงความกระตือรือร้นในการฟัง","o":["เงยหน้ามองผู้พูด","ปิดโทรศัพท์มือถือ","ยกมือขึ้นซักถาม","ก้มหน้าก้มตาบันทึก"],"a":1,"e":"มารยาทในการฟังประการหนึ่ง คือ ผู้ฟังควรให้เกียรติผู้พูด โดยแสดงให้เห็นถึงความกระตือรือร้นในการฟังด้วยการเงย หน้ามองผู้พูด และไม่ควรก้มหน้ากดโทรศัพท์มือถือ คุยกัน หรือส่งเสียงรบกวนในขณะที่ผู้พูดกำลังพูดในห้องประชุม"},{"n":107,"q":"สำนวน \"ฟังหูไว้หู\" สื่อถึงการฟังประเภทใด","o":["ฟังเพื่อความรู้","ฟังเพื่อวิพากษ์วิจารณ์","ฟังเพื่อเปิดโลก","ฟังเพื่อความบันเทิง"],"a":2,"e":"วัตถุประสงค์ของการฟังประการหนึ่ง คือ การฟังเพื่อวิพากษ์วิจารณ์ เป็นการฟังที่ก่อให้เกิดวิจารณญาณแก่ผู้ฟัง เป็นสำคัญ ผู้ฟังจะต้องใช้ความคิดและการ ตัดสินใจเลือกในสิ่งที่ควรเชื่อและปฏิเสธในสิ่งที่ไม่เห็นด้วย ซึ่งตรงกับ สำนวนที่ว่า \"ฟังหูไว้หู\" (รับฟังไว้ แต่ยังไม่เชื่อทั้งหมด)"},{"n":108,"q":"ข้อใดมีผลต่อประสิทธิภาพการฟัง","o":["การแต่งกาย","การเลือกตำแหน่งที่นั่ง","การรักษามารยาท","การจดบันทึก"],"a":2,"e":"ลักษณะของการฟังที่ดีประการหนึ่ง คือ เลือกตำแหน่งที่นั่งให้เหมาะสมสามารถได้ยินเสียงผู้พูดขัดเจน และมอง เห็นหน้าของผู้พูด โดยการเลือกตำแหน่งที่นั่งฟังจะ มีความสัมพันธ์กับประสิทธิภาพของการฟัง เพราะการฟังได้ไม่ขัด เจน จับใจความได้ไม่หมดหรือมองไม่เห็นหน้าผู้พูด ก็สามารถทำให้ผู้ฟังหมดสมาธิในการฟังได้"},{"n":109,"q":"ผู้ฟังกลุ่มใดที่สมาธิสั้น เบื่อง่าย ชอบแต่เรื่องสนุกสนาน","o":["เด็ก","ผู้สูงอายุ","ผู้ใหญ่","วัยรุ่น"],"a":1,"e":"วัยเด็ก เป็นวัยที่มีลักษณะซุกชน ไม่อยู่นิ่ง ไม่มีความตั้งใจในการฟังเรื่องได้นานเบื่อง่าย ชอบแต่เรื่องสนุกสนาน ตื่นเต้น อยากรู้อยากเห็น ชอบการรับประทาน มีพื้นฐานความรู้ ความสนใจ และประสบการณ์น้อย ดังนั้นจึงควรใช้ภาษา ที่ง่ายกว่าการสื่อสารกับ ผู้ใหญ่ และต้องไม่พูดนานจนเกินไป โดยเรื่องที่จะพูดควรเป็นเรื่องสนุกสนาน เร้าอารมณ์สร้าง ความตื่นเต้น น ้าเสียงในการพูดจะต้องแสดงความตื่นเต้นสนุกสนาน แฝงด้วยมุกตลก"},{"n":110,"q":"ปัจจัยในการวิเคราะห์ผู้ฟังข้อใดที่เป็นเรื่องละเอียดอ่อน ซึ่งผู้พูดควรต้องระวังที่สุด","o":["เพศ","อายุ","การศึกษา","ศาสนา"],"a":4,"e":"การนับถือศาสนา ความเชื่อ และวัฒนธรรม เป็นสิ่งที่คนเรายึดถือมาตั้งแต่ในอดีต ดังนั้นผู้พูดจึงต้องใช้ความ ระมัดระวังที่สุด อย่าพูดในทำนองดูหมื่น เหยียดหยาม หรือไม่เห็นด้วยกับศาสนาและความเชื่อต่าง ๆ เพราะถือเป็นเรื่อง ละเอียดอ่อน ซึ่งอาจจะก่อให้เกิดความไม่พอใจ หรือความขัดแย้ง และทำให้การพูดไม่ประสบความสำเร็จ"},{"n":111,"q":"ในโอกาสกล่าวคำสดุดี หรือคำปราศรัยในงานบันเทิงต่าง ๆ ควรใช้การพูดแบบใด","o":["การพูดเพื่อจูงใจ","การพูดเพื่อบอกให้รู้","การพูดจรรโลงใจ","การพูดเพื่อสร้างแรงบันดาลใจ"],"a":3,"e":"การพูดจรรโลงใจ เป็นการพูดเพื่อความบันเทิง และให้ผู้ฟังเกิดความรู้สึกสนุกสนาน ผ่อนคลายความตึงเครียดจาก สถานการณ์ต่าง ๆ ที่ประสบพบเจอในชีวิตประจำวัน จึงเป็นการ พูดที่ใช้ได้ในหลายโอกาสที่มีการพบปะสั งสรรค์ เช่น การพูดในงานชุมนุมสโมสร หรือสมาคม ต่าง ๆ, งานรื่นเริง, การกล่าวคำสดุดี หรือคำปราศรัยในงานบันเทิงต่าง ๆ, การ พูดหลังอาหารเรื่องเกี่ยวกับสถานที่ท่องเที่ยวต่าง'ๆ หรือประสบการณ์ที่น่าสนใจ เป็นต้น"},{"n":112,"q":"เวลาใดที่ผู้พูดจะให้ความสนใจต่อการพูดมากที่สุด","o":["เช้า","กลางวัน","บ่าย","เย็น"],"a":1,"e":"ผู้พูดต้องวิเคราะห์ว่าจะพูดในช่วงเวลาใด และจะใช้เวลาพูดนานแค่ไหนเพราะการวิเคราะห์ช่วงเวลาที่พูดจะช่วย ให้ผู้พูดทราบความสนใจของผู้ฟัง เช่น ถ้าหากพูดในช่วงเช้า (08.00 - 10.00 น. ผู้ฟังจะมีความสนใจมากและมีความ ตื่นตัวในการฟังที่สุดเพราะยังกระปรี้กระเปร่า แต่หากพูดหลังอาหารกลางวัน (13.00 - 15.00 น. ผู้ฟังมักจะ ง่วงนอน ยิ่ง ถ้าห้องที่พูดนั้นไม่ได้ติดเครื่องปรับอากาศก็จะร้อนอบอ้าว ในกรณีนี้ผู้พูดไม่ควร พูดยึดเยื้อ เพราะจะทำให้ผู้ฟังเกิดความ เบื่อหน่าย ควรจะเตรียมเรื่องเบาๆ หรือสอดแทรกอารมณ์ขันเพื่อช่วยผ่อนคลายความง่วงของผู้ฟัง"},{"n":113,"q":"หากจะพูดเรื่อง \"เที่ยวทั่วไทยจากเหนือจรดใต้\" ควรใช้การดำเนินเรื่องแบบใด","o":["ดำเนินเรื่องโดยแบ่งเนื้อเรื่องเป็นหมวดหมู่","ดำเนินเรื่องตามเหตุและผล","ดำเนินเรื่องตามลำดับสถานที่","ดำเนินเรื่องตามลำดับเวลา"],"a":3,"e":"การดำเนินเรื่องตามลำดับสถานที่ หมายถึง การพูดโดยลำดับจากจุดใกล้ตัวไปยัง จุดไกลตัว หรือจากทิศเหนือไป ทิศใต้ วิธีนี้เหมาะสำหรับการพูดนำเที่ยว การบรรยายเกี่ยวกับสถานที่ หรือการให้ความรู้ทางภูมิศาสตร์"},{"n":114,"q":"ข้อใดเป็นคำปฏิสันถารแบบพิธีการ","o":["เพื่อนร่วมชาติทุกท่าน","ท่านผู้อำนวยการและท่านผู้มีเกียรติทั้งหลาย","พี่น้องชาวบ้านที่รักยิ่ง","ท่านผู้ฟังที่เคารพ"],"a":2,"e":"คำทักทายหรือคำปฏิสันถารแบ่งออกเป็น 2 ประเภท ดังนี้ 1. คำปฏิสันถารที่เป็นทางการ จะใช้กับงานพิธีการต่าง ๆ เช่น งานศาสนาพิธี งานวางศิลาฤกษ์ \"งานแจกวุฒิบัตร คำ กล่าวเปิดงาน ฯลฯ จะเรียกเฉพาะตำแหน่ง เช่น \" เรียนท่านผู้อำนวยการ คุณอาจารย์ และท่านผู้มีเกียรติทั้งหลาย\" เมื่อ กล่าวคำปฏิสันถารจบแล้วจึงตามด้วยประโยค ที่ว่า \"ข้าพเจ้ารู้สึกเป็นเกียรติอย่างยิ่งที่ได้มาพูดในวันนี้\" 2. คำปฏิสันถารที่ไม่เป็นทางการ เช่น การประชุมภายในหน่วยงาน การอภิปราย คำปราศรัยคำกล่าวของนักการเมือง ฯลฯ จะมีคำแสดงความรู้สึก เช่น คำว่า \"เคารพ/นับถือ/ที่รัก\"อยู่ด้วย เช่น \"สวัสดีท่านผู้ฟังที่เคารพทุกท่าน\", \"สวัสดีพี่น้อง ขาวบ้านที่รักทั้งหลาย\" ฯลฯเมื่อกล่าวคำปฏิสันถารจบแล้วจึงตามด้วยประโยคที่ว่า \"ผม/กระผม/ดิฉัน รู้สึกเป็นเกียรติ อย่างยิ่งที่ได้มาพูดในวันนี้\" ส่วนสรรพนามที่ใช้แทนผู้ฟังต้องเป็นคำยกย่องให้เกียรติ หรือแสดงความเป็นฝ่ายเดียวกับผู้ พูด เช่น ท่าน พี่น้อง พวกเรา คุณ เพื่อน ฯลฯ"},{"n":115,"q":"หากผู้พูดมีประสบการณ์น้อย ควรเลือกเรื่องโดยคำนึงถึงข้อใดก่อนเป็นอันดับแรก","o":["กลุ่มผู้ฟัง","ตัวผู้พูด","สถานที่","เวลา"],"a":2,"e":"หลักการเลือกเรื่องพูดประการหนึ่ง คือ เลือกเรื่องให้เหมาะสมกับตัวผู้พูด เพราะนอกจากจะเลือกเรื่องให้เหมาะกับ กลุ่มผู้ฟังแล้ว ผู้พูดควรเลือกหัวข้อที่ตนสนใจและถนัดด้วยโดยเฉพาะสำหรับผู้ทีเริ่มพูดใหม่ ๆ ที่ยังมีประสบการณ์น้อย ทั้งนี้เพื่อให้ผู้พูดมีความเชื่อมั่นใน ตัวเอง และไม่เกิดความประหม่าในขณะที่พูด ซึ่งจะช่วยให้การพูดนั้นน่าเชื่อถือยิ่งขึ้น"},{"n":116,"q":"\"เลือกตั้ง กทม. คึกคัก คนแหใช้สิทธิ์ล้นหลาม\" เป็นการขึ้นต้นคำนำแบบใด","o":["แบบตั้งคำถาม","แบบยกบทกวีหรือคำคม","แบบทำให้ผู้ฟังสงสัย","แบบพาดหัวข่าว"],"a":4,"e":"หลักการขึ้นต้นคำนำประการหนึ่ง คือ ขึ้นต้นแบบพาดหัวข่าว ซึ่งใช้วิธีเดียวกับการพาดหัวข่าวหนังสือพิมพ์ เพื่อดึงดูด ความสนใจของผู้อ่าน โดยเอาผลมาพูดก่อนแล้วจึงอธิบายทีหลัง เช่น \"เลือกตั้ง กทม. คึกคัก คนแห่ใช้สิทธิ์ล้นหลาม\""},{"n":117,"q":"ข้อใดเป็นการสื่อสารทางเดียว","o":["การสนทนา","การสัมภาษณ์","ปาฐกถา","การอภิปราย"],"a":3,"e":"พจนานุกรมฉบับราชบัณฑิตยสถาน พุทธศักราช 2542 ได้อธิบายความหมายของปาฐกถาไว้ว่า ถ้อยคำหรือเรื่องราว ที่บรรยายในที่ชุมชน เป็นต้น หรือกล่าวโดยทั่ว ๆ ไปได้ว่า \"ปาฐกถา\" คือ การพูดต่อหน้าคนจำนวนมาก ถือเป็นการ สื่อสารทางเดียวที่ผู้แสดงปาฐกถาจะพูดตามหัวข้อที่กำหนดไว้ตั้งแต่ต้นจนจบเรื่อง แล้วจึงเปิดโอกาสให้ผู้ฟังซักถาม มัก นิยมใช้สำหรับการพูดในที่ชุมชนทั่ว ๆ ไป เพื่อให้ความรู้หรือข้อเท็จจริง"},{"n":118,"q":"การอภิปรายประเภทใดที่ผู้ร่วมอภิปรายทุกคนมีสิทธิเท่าเทียมกัน","o":["การอภิปรายโต๊ะกลม","การอภิปรายระดมสมอง","การอภิปรายแบบสัมมนา","การอภิปรายแบบปุจฉาวิสัชนา"],"a":1,"e":"การอภิปรายโต๊ะกลม (Round Table Discussion) คือ ผู้ร่วมอภิปรายทุกคนจะมิสิทธิเท่าเทียมกัน และจะมีการจัด โต๊ะเป็นรูปวงกลม โดยผู้ร่วมอภิปรายนั่งเรียงกันตาม รูปโต๊ะ เพื่อให้มีโอกาสเห็นหน้ากันอย่างชัดเจนทุกคน ทั้งนี้ ผู้เข้าร่วมอภิปรายจะมีประมาณ 10 - 20 คน โดยทุกคนเป็นทั้งผู้พูดและผู้ฟัง มีสิทธิในการแสดงความคิดเห็นเท่าเทียมกัน บางที่ประธานในการอภิปรายอาจจะมีหรือไม่มีก็ได้"},{"n":119,"q":"การพูดในโอกาสที่ใดที่นิยมเชิญแขกคนสนิทของเจ้าภาพขึ้นไปพูด","o":["การกล่าวสุนทรพจน์","การกล่าวต้อนรับ","การกล่าวแนะนำ","การกล่าวอวยพร"],"a":4,"e":"บางครั้งในงานที่จัดขึ้นอย่างเป็นกันเอง ผู้พูดอาจถูกเชิญขึ้นไปกล่าวอวยพร เพราะ มีความสนิทสนมกับเจ้าภาพ โดยไม่จำเป็นว่าจะต้องเป็นบุคคลที่มีชื่อเสียงแต่ประการใด ทั้งนี้การกล่าวอวยพรอาจมีได้หลายโอกาส เช่น อวยพรคู่ สมรส อวยพรวันเกิด อวยพรวันขึ้นปีใหม่เป็นต้น ซึ่งผู้พูดควรกล่าวสั้นๆ โดยมีหลักเกณฑ์ต่าง ๆ ดังนี้ 1. ผู้พูดควรกล่าวแสดงความรู้สึกเป็นเกียรติที่ได้ขึ้นมากล่าวอวยพร 2. ผู้พูดควรพูดถึงความสัมพันธ์ของผู้พูดที่มีต่อเจ้าภาพ 3. ผู้พูดควรคำถึงเวลาและเนื้อหาให้เหมาะสมตามโอกาส"},{"n":120,"q":"\"ผมไม่เคยคิดมาก่อนเลยว่าเรื่องแบบนี้จะเกิดขึ้นกับตัวเอง\" เป็นการขึ้นต้นคำนำแบบใด","o":["แบบตั้งคำถาม","แบบทำให้ผู้ฟังสงสัย","แบบพาดหัวข่าว","แบบยกบทกวีหรือคำคม"],"a":2,"e":"หลักการขึ้นต้นคำนำวิธีหนึ่ง คือ ขึ้นต้นด้วยการทำให้ผู้ฟังสงสัย ซึ่งการ ขึ้นต้นด้วยวิธีนี้จะแตกต่างจากวิธีตั้ง คำถาม เนืองจากมิได้ใช้ประโยคคำถาม แต่ใช้ประโยค ที่ฟังแล้วเกิดความสงสัยอยากติดตามต่อไป เช่น \"ผมไม่เคยคิดมา ก่อนเลยว่าเรื่องแบบนี้จะเกิดขึ้นกับตัวเอง\" เป็นต้น"}]},{"title":"ภาค S ปีการศึกษา 2565","items":[{"n":1,"q":"ข้อใดไม่ใช่การสื่อสาร","o":["ลูกนกร้องจิ๊บ ๆ ขออาหารจากแม่นก","มานะส่งสัญญาณภาษามือกับมานี","สิงโตสองตัวต่างคลอเคลียกันไปมา","ฟ้าผ่าดังเปรี้ยงสัญญาณโทรทัศน์จึงดับ"],"a":4,"e":"การสื่อสาร คือ ขั้นตอนหรือกระบวนการของการรับรู้ข้อมูลหรือข่าวสาร เพื่อให้เกิดความเข้าใจที่ตรงกัน ซึ่งมนุษย์ จะสื่อสารโดยใช้ภาษาพูด ภาษาเขียนภาษาท่าทาง หรือสัญญาณ/สัญลักษณ์ต่างๆ เช่น มานะส่งสัญญาณภาษามือกับมานี ฯลฯในขณะที่สัตว์ก็สื่อสารกันโดยใช้วิธีการแสดงพฤติกรรมต่าง ๆ เพื่อเป็นการสื่อความหมายกัน เช่น ลูกนกร้องจิ๊บ - ขออาหารจากแม่นก, สิงโตสองตัวต่างคลอเคลียกันไปมา ฯลฯ"},{"n":2,"q":"เหตุผลใดที่ภาษามีความสำคัญที่สุดในการสื่อสาร","o":["ภาษา คือ การทำความเข้าใจกับสิ่งแวดล้อม","ภาษา คือ การแสดงออกของมนุษย์","ภาษา คือ เครื่องมือทำให้เข้าใจสารหรือข้อมูล","ภาษา คือ ตัวแทนของการสื่อสาร"],"a":4,"e":"ภาษา คือ เครื่องมือหรือสิ่งที่มนุษย์กำหนดขึ้นเป็นระบบสัญญาณ เพื่อทำให้เข้าใจสารหรือข้อมูลให้ตรงกัน ทั้งนี้ ภาษาทุกภาษาจะต้องประกอบขึ้นมาจากเสียงและความหมาย ซึ่งต้องผ่านมาถึงกระบวนการสร้างคำเสียก่อนจึงจะมี ความหมายขึ้นมาได้ ดังนั้นการใช้ภาษาเพื่อการสื่อสารจึงเกิดขึ้นมาจากการเปล่งเสียง และเข้าสู่กระบวนการสร้างคำ มี ความหมายใช้สื่อสาร เกิดการรับรู้ ตีความ เข้าใจ จึงจะบรรลุผลของการสื่อสาร"},{"n":3,"q":"ภาษาไทยมีความแตกต่างจากภาษาต่างประเทศในการสื่อสารอย่างไร","o":["ภาษาไทยมีความไพเราะเหมือนเสียงดนตรี","ภาษาไทยมีระเบียบและระดับของการใช้","ภาษาไทยมีความเป็นกันเองเรียบง่ายสื่อสารได้ทุกที่","ภาษาไทยเป็นหนึ่งในภาษาที่มีภาษาเป็นของตนเอง"],"a":2,"e":"ภาษาไทยจัดว่าเป็นภาษาที่มีความรุ่มรวยคำ มีทั้งคำมูล คำประสม คำซ้อน ฯลฯ นอกจากนี้ยังมีวัฒนธรรมการใช้ ภาษาทีไม่เหมือนภาษาต่างประเทศชาติอื่น กล่าวคือ การใช้ภาษาของคนไทยนั้นสามารถแบ่งเป็นระดับของภาษาได้ เพื่อ แสดงถึงความเป็นขั้นของภาษาหรือความมีระเบียบของภาษา"},{"n":4,"q":"วัจนภาษาและอวัจนภาษามีความแตกต่างกันหรือไม่ อย่างไร","o":["แตกต่าง : เพราะวัจนภาษารูปธรรม อวัจนภาษาคือนามธรรม","ไม่แตกต่าง : เพราะวัจนภาษาและอวัจนภาษาก็คือ ภาษาที่ใช้ในการสื่อสาร","แตกต่าง : เพราะวัจนภาษาคือภาษาพูด-เขียน อวัจนภาษาคือ ภาษาท่าทาง","ไม่แตกต่าง : เพราะวัจนภษาและอวัจนภาษาคือ การแสดงออกของมนุษย์"],"a":3,"e":"ประเภทของภาษาสามารถแบ่งได้ 2 ลักษณะ ดังนี้ 1. วัจนภาษา (Vertal Language) คือ ภาษาที่ใช้สื่อสารผ่านถ้อยคำ ภาษาพูด ภาษาเขียน ซึ่งอาจเป็นภาษาไทย ภาษาอังกฤษ ภาษาฝรั่งเศส ภาษาจีน ฯลฯ 2. อวัจนภาษา (Non Verbal Language) คือ ภาษาที่ใช้ในการแสดงออก อาจจะผ่านท่าทาง น ้าเสียง หรือบริบทที่ แวดล้อมในการใช้ภาษา หรือเป็นภาษาที่ใช้ในการสื่อสารโดยกำหนด ผ่านระบบสัญญาณ ภาษาท่าทาง ภาษามือ ภาษากาย"},{"n":5,"q":"จากวลีที่ว่า “ทรงอย่าแบด แซดอย่างบอย” คือภาษาแบบใด","o":["ภาษาพูด","ภาษาวัยรุ่น","ภาษาสแลง","ภาษาเพลง"],"a":1,"e":"ภาษาพูด หรือเรียกอีกอย่างหนึ่งว่า \"ภาษาปาก หรือภาษาที่ไม่เป็นทางการ\" คือระดับภาษาแรกที่เราสามารถสัมผัส และรับรู้ได้อย่างใกล้ชิด เพราะภาษาพูดเป็นระดับภาษา ที่แสดงความเป็นกันเอง เป็นภาษาที่เราใช้ในชีวิตประจำวัน ตลอดจนแสดงถึงสถานะของผู้ที่ใช้ภาษาที่มีความใกล้ชิดและสนิทสนมกันในระดับหนึ่ง เช่น เพื่อนสนิท พี่น้อง ฯลฯ โดยคำที่ปรากฏในภาษาพูดจะเป็นคำเรียบง่าย หรือบางครั้งอาจมีคำที่ไม่สุภาพ คำสแลง คำภาษาถิ่นคำทับศัพท์ ภาษาต่างประเทศ เข้ามาปะปนในภาษาพูดก็ได้"},{"n":6,"q":"งานราตรีคืนนี้ คนดังในแวดวงสังคมต่าง “ห่มเพชร” กันมาทั้งงาน","o":["กาลภาษา","วัตถุภาษา","เทศภาษา","กายภาษา"],"a":2,"e":"วัตถุภาษา หมายถึง อวัจนภาษาที่สื่อความหมายถึงข้าวของ และสิ่งของเครื่องใช้ในชีวิตประจำวัน โดยวัตถุภาษา สามารถสื่อถึงรสนิยม ความเป็นตัวตนส่วนบุคคล ตลอดจนอาชีพและสถานภาพ ได้แก่ เครื่องแต่งกายตามอาชีพ (ข้าราชการ/ทหาร/ตำรวจ) กระเป๋าเพชร ทอง เสื้อผ้า รองเท้า เครื่องสำอาง ฯลฯ นอกจากนี้วัตถุภาษายังรวมถึงองค์ ประกอบที่ให้ความรู้สึกในเชิงรูป รส กลิ่น สี เช่น สีดำให้ความรู้สึกน่ากลัว โศกเศร้า, สีแดงให้ความรู้สึก คึกคัก มีพลัง, สีเขียวให้ความรู้สึกสดชื่น สบายตา เป็นต้น หรือวัตถุภาษาที่สื่อผ่านทางกลิ่นเช่น กลิ่นน ้าอบน ้าปรุง ทำให้นึกถึงสิ่งลี้ลับ วิญญาณ, กลิ่นรูป ทำให้นึกถึงพิธีกรรม เป็นต้น"},{"n":7,"q":"ปุ๊กปิ๊กไปเรียนต่อเมืองนอก เมื่อเดินเข้าประตูผู้โดยสารที่สนามบิน ปุ๊กปิ๊กหันมาโบกมืออำลา","o":["กาลภาษา","วัตถุภาษา","เทศภาษา","กายภาษา"],"a":4,"e":"กายภาษา หมายถึง การแสดงออกของอวัจนภาษาที่สื่อสารผ่านทางภาษากาย โดยจะแสดงออกผ่านทางสายตา ศีรษะ มือ ปาก รวมไปถึงอวัยวะอื่น ๆ ในร่างกาย เช่น การเบิกตาเพราะตกใจกลัวหรือประหลาดใจ, การพยักหน้าแสดง ความเห็นด้วย, การยิ้มแสดงความพอใจ,การโบกมืออำลาหรือทักทาย เป็นต้น"},{"n":8,"q":"สมศรีเป็นประธานทอดกฐินที่วัดแห่งหนึ่ง เจ้าภาพได้จัดเก้าอี้ให้สมศรีนั่งข้างหน้า","o":["กาลภาษา","วัตถุภาษา","เทศภาษา","กายภาษา"],"a":3,"e":"เทศภาษา หมายถึง อวัจนภาษาที่แสดงออกผ่านทางพื้นที่ และระยะห่างของพื้นที่โดยการแสดงอวัจนภาษาแบบนี้ จะเกี่ยวข้องกับความสัมพันธ์ของบุคคลหรือสถานภาพของ บุคคลด้วย ได้แก่ ในงานพิธีการ เก้าอี้แถวหน้าส่วนใหญ่จะ ว่างเว้นไว้ให้แขกผู้ใหญ่ ขณะที่เราเมื่อเดินเข้าไปก็จะรับรู้ว่า เก้าอี้แถวหน้าสำหรับแขกผู้มีเกียรติหรือผู้ใหญ่ เราก็จะมานั่ง ลำดับแถวที่ถัดมาหรือเลี่ยงไปนั่งแถวตรงกลางหรือแถวหลังสุด ดังนั้นการเลือกที่นั่งของบุคคลก็จะ บ่งบอกได้ถึงการ แสดงออกทางพื้นที่ตัวตนของบุคคลผู้นั้น"},{"n":9,"q":"อ.สาหะโรจน์กำหนดให้ส่งข้อสอบอัตนัยภายในวันและเวลา คือ วันที่ 23 เดือน 3 ปี 2023","o":["กาลภาษา","วัตถุภาษา","เทศภาษา","กายภาษา"],"a":1,"e":"กาลภาษา หมายถึง การแสดงออกทางภาษาที่สื่อความหมายถึงเรื่องของเวลา เช่น จากสื่อสังคมออนไลน์ใน ปัจจุบัน การจัดช่วงเวลาส่งเสริมการขาย วันที่ 2 เดือน 2 ปี 2022 เป็นต้น"},{"n":10,"q":"ทุกวันศุกร์ หน่วยงานราชการมักใส่ผ้าไทยเพื่อแสดงออกถึงวันผ้าไทย","o":["กาลภาษา","วัตถุภาษา","เทศภาษา","กายภาษา"],"a":2,"e":"ดูบรรยายเพิ่มเติมข้อ 6. ประกอบ"},{"n":11,"q":"ข้อใดใช้ภาษาผิดระดับ","o":["ครูครับ ไปทานข้าวกันดีกว่าครับ","คุณคะ จะรับของชิ้นนี้หรือไม่รับคะ","ตุ้มจ๊ะ อาราธนาพระให้ฉันเพลได้แล้ว","พ่อ เกรดผมเทอมนี้อย่างแซดเลย"],"a":4,"e":"ระดับภาษาเป็นการแสดงลักษณะการใช้ภาษาของคนไทยที่มีความเป็นระบบ รวมทั้งแสดงให้เห็นถึงภาษามี “ชั้น” และมี “ศักดิ์” ของคำบ่งบอกถึงความมีวัฒนธรรมเรื่องของภาษาด้วย อาจกล่าวได้ว่าภาษาของไทยเรามีวัฒนธรรมเป็น เครื่องกำหนดความแตกตางของคำและการใช้คำให้เหมาะสมและสอดคล้องกับสถานการณ์"},{"n":12,"q":"กิจกรรมการสื่อสารในข้อใดถือว่าผู้ส่งสารและผู้รับสาร มีปฏิกิริยาตอบสนองกันและกันได้","o":["การปาฐกถา","การประกาศแจ้ง","การเขียนหนังสือ","การบรรยาย"],"a":1,"e":"ผู้ส่งสารได้ส่งสารมาเป็นคำพูด (วัจนภาษา) ผู้รับสารจะรับสารและจะมีปฏิกิริยาตอบสนองโดยรับฟัง ขณะเดียว กันผู้รับสารก็สามารถทำหน้าที่เป็นผู้ส่งสารได้เช่นกัน ถ้าผู้รับสารเปลี่ยนบทบาทมาเป็นผู้ส่งสารแทน กรณีนี้ผู้ส่งสารจะ ทำหน้าที่เป็นผู้รับสารคือหยุดรับฟัง ทั้งนี้ผู้ส่งสารสามารถส่งสารมายังผู้รับสารได้ทั้งภาษาพูดและภาษาเขียน ทักษะการ ส่งสารจะเป็นกระบวนการพูดและการเขียน ตัวอย่าง เช่น การบรรยายในห้องเรียนของอาจารย์กระบวนวิชา RAM 1103"},{"n":13,"q":"ข้อใดจับคู่ไม่ถูกต้องระหว่าง “สื่อ” กับ “ช่องทาง”","o":["ไมโครโฟน ลำโพง","หนังสือ กระดาษ","โทรทัศน์ จอฉาย","วิทยุ สัญญาณรับ"],"a":2,"e":"สื่อ (Media) คือ พาหะหรือตัวการที่จะนำสารเดินทางจากผู้ส่งสารมายังผู้รับสาร สื่อมีทั้งที่เป็นสื่อธรรมชาติ เช่น คลื่น สื่อมนุษย์ เช่น บุคคลผู้มีบทบาทเป็นตัวแทนของสื่อ อาจจะหมายถึงผู้อ่านข่าว พิธีกร ถ้วยกาแฟกระดาษ สื่อ อิเล็กทรอนิกส์ เช่น วิทยุ โทรทัศน์ คอมพิวเตอร์ ไมโครโฟน เป็นต้น ส่วนคำว่าช่องทาง (Channel) หมายถึง แหล่งหรือ วิธีการที่ทำหน้าที่ถ่ายทอดคลื่นออกมาส่งตรงไปถึงผู้รับสารช่องทางในที่นี้ เช่น หนังสือ ผ้า แผ่นไม้ ลำโพง จอฉาย"},{"n":14,"q":"ประโยคในข้อใดมีการใช้คำที่มีความหมายโดยตรง","o":["ซื่อกินไม่หมด คดกินไม่นาน","เสื้อตัวขนาดนี้หมูยังใสได้เลย","ดาวค้างฟ้ายังคงเจิดจรัส","ฉันเคยนั่งเก้าอี้ตัวนั้นมาก่อน"],"a":4,"e":"คำที่มีความหมายตรง หมายถึง คำที่มีการแสดงความหมายตรงตามรูปคำ ไม่ได้มีความหมายอื่นแฝงอยู่ในคำ สุนันท์ อัญชลีนุกูล ได้อธิบายความหมายของคำที่มีความหมายตรงเพิ่มเติมว่าคือคำที่มีความหมายหลักของคำที่ใช้ สื่อสารในชีวิตประจำวัน สามารถเรียกอีกอย่างหนึ่งว่าคำที่มีความหมาประจำคำหรือคำที่มีความหมายนัยตรง (denotative meaning หรือ lexical meaning) เช่น คำว่า ดาว เสือ หมู ทกล้วย กุหลาบ นกพิราบ เป็นต้น"},{"n":15,"q":"ประโยคที่มีคำฟุ่มเฟือย มีประโยชน์หรือไม่มีประโยชน์","o":["มี เพราะทำให้เราได้รู้จักคำในภาษาไทยมีมากน้อยเพียงใด","ไม่มี เพราะเป็นคำที่ทุกคนคุ้นเคยอยู่แล้วไม่ต้องใส่ลงไป","มี เพราะทำให้เห็นว่าภาษาไทยมีคำให้เลือกใช้ได้หลายคำ","ไม่มี เพราะทำให้ประโยคเต็มไปด้วยคำที่มีความหมายเหมือนกัน"],"a":4,"e":"คำพุ่มเฟือย คือ คำที่มีความหมายเดียวกันมาวางไว้ในประโยคเดียวกัน จึงทำให้คำในประโยคเพิ่มขึ้นอย่างไม่ จำเป็น ซึ่งการใช้คำฟุ่มเฟือยในการสื่อสารนอกจากจะทำให้ประโยครกรุงรังด้วยคำที่มีความหมายเดียวกันแล้ว ยังทำให้ ความชัดเจนของถ้อยคำลดน ้าหนักลงอีกด้วยเพราะผู้รับสารอาจจะไม่เข้าใจว่าผู้ส่งสารต้องการให้น ้าหนักกับคำหลักที่ สำคัญในประโยค คือคำใด ตัวอย่างการใช้คำพุ่มเฟือย เช่น เด็กหนุ่มสาววัยรุ่นนั้นเป็นกำลังสำคัญของชาติ ฯลฯ"},{"n":16,"q":"ประโยคที่ว่า “เธอจะไปเลย” เป็นการสื่อสารที่แสดงถึงความบกพร่องในเรื่องของ “คำ” ข้อใด","o":["คำที่มีแนวเทียบเสียงผิด","คำฟุ่มเฟือย","คำที่มีความหมายกำกวม","คำที่ออกเสียงผิด ความหมายเปลี่ยน"],"a":3,"e":"คำที่มีความหมายกำกวม คือ การสื่อสารโดยใช้คำผิดความหมาย เว้นวรรคคำผิด ขาดคำขยายที่เข้ามาทำให้ ความหมายชัดเจนขึ้น หรือมีการใช้คำในลักษณะคำพ้องรูปคำพ้องเสียง ก็อาจทำให้เกิดความหมายกำกวมขึ้นมาได้ ซึ่ง ก่อให้เกิดปัญหาการตีความหมายได้หลายแง่ เช่น \"เธอจะไปเลย\" อาจหมายถึง เธอจะไปจังหวัดเลย หรือเธอจะไปทันที"},{"n":17,"q":"ย่อหน้าแบบสามเหลี่ยมมีฐานบรรจบกัน","o":["ย่อหน้าที่มีประโยคใจความสำคัญอยู่ต้นและท้าย","ย่อหน้าที่มีประโยคใจความสำคัญอยู่ตอนกลาง","ย่อหน้าที่มีประโยคใจความสำคัญอยู่ตอนต้น","ย่อหน้าที่มีประโยคใจความสำคัญอยู่ตอนท้าย"],"a":1,"e":"ย่อหน้าที่มีประโยคใจความสำคัญหรือความคิดสำคัญอยู่ตอนต้นและตอนท้าย คือ \"ย่อหน้าที่มีประโยคใจความ สำคัญอยู่ทั้งย่อหน้าตอนต้นและตอนท้าย หมายความว่า ย่อหน้า รูปแบบนี้จะนำด้วยประโยคใจความสำคัญหรือความคิด สำคัญ ถัดมาคือ ประโยคขยายความหรือประโยคสนับสนุน จนถึงท้ายย่อหน้าก็จะเป็นประโยคใจความสำคัญหรือ ความคิดสำคัญ อีกครั้ง เราเรียกรูปแบบย่อหน้านี้ว่า \"สามเหลี่ยมมีฐานบรรจบกัน\""},{"n":18,"q":"ย่อหน้าแบบสามเหลี่ยมหน้าจั่ว","o":["ย่อหน้าที่มีประโยคใจความสำคัญอยู่ต้นและท้าย","ย่อหน้าที่มีประโยคใจความสำคัญอยู่ตอนกลาง","ย่อหน้าที่มีประโยคใจความสำคัญอยู่ตอนต้น","ย่อหน้าที่มีประโยคใจความสำคัญอยู่ตอนท้าย"],"a":3,"e":"ย่อหน้าที่มีประโยคใจความสำคัญหรือความคิดสำคัญอยู่ตอนต้น คือ ย่อหน้าที่มีประโยคใจความสำคัญหรือ ความคิดสำคัญอยู่ตอนต้น ถัดจากประโยคใจความสำคัญหรือความคิดสำคัญก็จะเป็นประโยคขยายความหรือประโยค สนับสนุน ซึ่งเรียกอีกอย่างหนึ่งว่า \"ย่อหน้าแบบสามเหลี่ยมหน้าจั่ว\""},{"n":19,"q":"ย่อหน้าแบบสามเหลี่ยมหน้าจั่วหัวกลับ","o":["ย่อหน้าที่มีประโยคใจความสำคัญอยู่ต้นและท้าย","ย่อหน้าที่มีประโยคใจความสำคัญอยู่ตอนกลาง","ย่อหน้าที่มีประโยคใจความสำคัญอยู่ตอนต้น","ย่อหน้าที่มีประโยคใจความสำคัญอยู่ตอนท้าย"],"a":4,"e":"ย่อหน้าที่มีประโยคใจความสำคัญหรือความคิดสำคัญอยู่ตอนท้าย คือ ย่อหน้า ที่เริ่มต้นจากประโยคขยายความ บอกเล่าไปเรื่อย ๆ จนถึงตอนท้าย และก่อนจะจบย่อหน้า มีประโยคกล่าวถึงความคิดสำคัญหรือประโยคสรุปความคิด สำคัญของย่อหน้า ซึ่งบางครั้งเราเรียกประโยคใจความสำคัญตอนท้ายนี้ว่า \"ประโยคสรุปความ\" ส่วนรูปแบบของย่อหน้า จะเรียกว่า \"ย่อหน้าแบบสามเหลี่ยมหน้าจั่วหัวกลับ\""},{"n":20,"q":"ย่อหน้าแบบสามเหลี่ยมมียอดบรรจบกัน","o":["ย่อหน้าที่มีประโยคใจความสำคัญอยู่ต้นและท้าย","ย่อหน้าที่มีประโยคใจความสำคัญอยู่ตอนกลาง","ย่อหน้าที่มีประโยคใจความสำคัญอยู่ตอนต้น","ย่อหน้าที่มีประโยคใจความสำคัญอยู่ตอนท้าย"],"a":2,"e":"ย่อหน้าที่มีประโยคใจความสำคัญหรือความคิดสำคัญอยู่ตอนกลาง คือ ย่อหน้า ที่มีประโยคใจความสำคัญหรือ ความ คิดสำคัญอยู่ตรงกลางย่อหน้า หรือเรียกว่า \"ตอนกลาง\"โดยย่อหน้านี้จะนำด้วยประโยคขยายความหรือประโยค สนับสนุ่นไล่มาเรื่อย ๆ จนกระทั่ง ถึงตรงกลางย่อหน้าก็จะเป็นประโยคใจความสำคัญหรือความคิดสำคัญ และถัดจาก ประโยคใจความสำคัญก็จะเป็นประโยคขยายความหรือประโยคสนับสนุนจนจบย่อหน้า ซึ่งเราเรียก ย่อหน้าแบบนี้ว่า \"สามเหลี่ยมมียอดบรรจบกัน\""},{"n":21,"q":"ข้อใดไม่ใช่รูปแบบ “การคิด” ในการเขียนตอบข้อสอบอัตนัย","o":["การคิดแก้ปัญหา","การคิดเชิงวิพากษ์","การคิดสังเคราะห์","การคิดสร้างสรรค์"],"a":2,"e":"การเขียนตอบข้อสอบอัตนัย คือ การฝึกให้นักศึกษาเกิดการเรียนรู้และการคิดในระดับขั้นสูง ซึ่งตัวอย่างการคิด ระดับขั้นสูง เช่น การคิดวิเคราะห์ การคิดแก้ปัญหา การคิดสร้างสรรค์ และการคิดสังเคราะห์ โดยกระบวนการคิด ดังกล่าวแสดงให้เห็นถึงวิธีการแสวงหาความรู้ระดับอุดมศึกษาที่ต้องอาศัยทักษะการฟัง การพูด การอ่าน และการเขียน"},{"n":22,"q":"ข้อใดอธิบายถูกที่สุดเกี่ยวกับการเขียนตอบข้อสอบอัตนัย","o":["การเขียนตอบจะต้องกำหนดเขียนเป็นโครงเรื่องก่อน","การเขียนตอบจะมีส่วนสรุปทุกครั้งเพื่อยืนยันความคิด","การเขียนตอบจะมีกี่ย่อหน้าก็ได้ไม่จำกัดจนกว่าอธิบายจบ","การเขียนตอบจะต้องใช้คำ เขียนประโยคมีความไพเราะ สละสลวย"],"a":2,"e":"การเขียนตอบเนื้อเรื่องของข้อสอบอัตนัย ผู้ตอบสามารถจัดแบ่งเป็นย่อหน้า 1โดยในแต่ละย่อหน้าจะต้องมี ความคิดสำคัญเพื่อชี้ว่า คำตอบในย่อหน้านี้ต้องการกล่าวถึงอะไร ทั้งนี้การเขียนตอบข้อสอบอัตนัยในส่วนเนื้อเรื่องไม่มี การจำกัดว่า จะมีย่อหน้ากี่ย่อหน้า ผู้ตอบสามารถเขียนอธิบายได้จนกว่าจะสิ้นสุดประเด็นของคำตอบ แต่ก็มีข้อควรระวัง คือ อย่าเขียนอธิบายยาวเกินไปโดยไม่มีสาระสำคัญหรือปราศจากความรู้ที่เกี่ยวข้องกับคำตอบ"},{"n":23,"q":"แนวคำถามใดที่จะต้องมีการแสดงความคิดเห็นเชิงประเมินค่า","o":["จงวิจารณ์","จงบรรยาย","จงอธิบาย","จงอภิปราย"],"a":1,"e":"จงวิจารณ์ หมายถึง การตอบข้อสอบอัตนัยโดยผู้ตอบจะต้องแสดงความคิดเห็นเชิง ตัดสินและประเมินคุณค่าจาก ความรู้และข้อมูลที่ประกอบในการตอบ โดยลักษณะคำถามที่ว่าจงวิจารณ์ อาจจะนึกไปถึงคำถามที่ถามในเชิงการแสดง ความคิดเห็น ตัดสิน ประเมินค่าคุณค่าทางวรรณคดี แต่ในความเป็นจริงแล้วแนวคำถามจงวิจารณ์ อาจจะใช้ในคำถามที่ มุ่งให้ตัดสินประเมินคุณค่าเชิงสังคม วัฒนธรรม หรือความรู้ด้านอื่นที่เกี่ยวข้องก็ได้"},{"n":24,"q":"จุดมุ่งหมายของการเขียนข้อความขนาดสั้นคืออะไร","o":["เพื่อระบาย","เพื่อบันทึกเรื่องราว","เพื่อปรึกษา","เพื่อบอกเล่า"],"a":3,"e":"การเขียนข้อความขนาดสั้น หรือเรียกว่า \"โน้ตย่อ\" เป็นการเขียนข้อความเพื่อสื่อสารไปยังผู้รับสาร โดยมี จุดมุ่งหมายเพื่อแจ้งความประสงค์ที่ผู้ส่งสารต้องการพบกับ ผู้รับสารด้วยจุดประสงค์อะไร เช่น ปรึกษา รับคำชี้แนะ หรือ ติดต่อกิจธุระอื่น ๆ ซึ่งถึงแม้ว่าในปัจจุบันจะมีการสื่อสารออนไลน์เกิดขึ้น แต่ถ้าอุปกรณ์ชำรุดเสียหาย หรือมีสภาพไม่ พร้อมใช้งาน เช่น ไฟดับ หลังงานสำรองหมด การสื่อสารออนไลน์ก็จะไม่สัมฤทธิ์ผล ดังนั้นการเขียน ข้อความขนาดสั้น ในกระดาษนั้นจึงยังคงมีความจำเป็นอยู่ในปัจจุบัน"},{"n":25,"q":"ปัจจุบันนี้ การเขียนข้อความขนาดสั้นมีความจำเป็นหรือไม่","o":["มี เพราะเป็นการฝึกให้ตนเองมีสมาธิ คอยเรียบเรียงข้อความ","ไม่มี เพราะการสื่อสารพัฒนาก้าวไกล ไม่ต้องเขียนใส่กระดาษ","มี เพราะช่วยผู้ส่งสารที่ไม่สะดวกในการส่งข้อความโดยวิธีอื่น","ไม่มี เพราะเสียเวลามาคิดถ้อยคำและหาอุปกรณ์ในการเขียน"],"a":3,"e":"ดูบรรยายเพิ่มเติมข้อ 24. ประกอบ"},{"n":26,"q":"ข้อใดไม่ใช่รายละเอียดที่ต้องใส่ลงในจดหมายสมัครงาน","o":["ประสบการณ์การฝึกงาน","ประสบการณ์การทำกิจกรรม","สถานภาพและการศึกษา","ความสามารถพิเศษ"],"a":2,"e":"เนื้อหาในจดหมายสมัครงานส่วนใหญ่แล้ว จะเป็นการกล่าวถึงการทราบข่าวเรื่องการรับสมัคร รายละเอียดเกี่ยวกับ ผู้สมัคร เช่น ชื่อ-นามสกุล สถานภาพการศึกษา ประสบการณ์การฝึกงาน ความสามารถพิเศษ ถ้าเป็นเพศชายควรระบุ ด้วยว่า ได้ผ่านการเกณฑ์ทหารมาเรียบร้อย รวมทั้งความเห็นของบุคคลที่จะรับรองความประพฤติของผู้สมัครเช่น อาจารย์ที่ปรึกษา อดีตนายจ้าง ฯลฯ นอกเหนือจากนี้อาจจะเป็นเนื้อความที่เกี่ยวกับความสนใจของผู้สมัครว่า ทำไมจึง สนใจตำแหน่งที่เปิดรับสมัคร มีความรู้และประสบการณ์ที่เกี่ยวข้องกับตำแหน่งมี่สมัครด้วยหรือไม่อย่างไร"},{"n":27,"q":"ในการเขียนจดหมายสมัครงาน ควรห้ามเขียนสิ่งใดมากที่สุด","o":["เงินเดือน","ชมเชยที่ทำงานใหม่","ปัญหาส่วนตัว","กล่าวถึงหัวหน้างานเก่า"],"a":4,"e":"ข้อควรระวังของการเขียนจดหมายสมัครงาน คือ ผู้สมัครอย่าใช้ภาษาในลักษณะที่โฆษณาชวนเชื่อหรือกล่าวเกิน ความเป็นจริง ตลอดจนอวดอ้างคุณสมบัติของตนเอง นอกจากนี้อย่าเขียนข้อความในลักษณะการขอความเห็นใจอัน เนื่องมาจากปัญหาส่วนตัว ไม่ควรกล่าวถึงความไม่ดีของอดีตหัวหน้าและสถานที่ทำงานเก่า รวมไปถึงไม่ควรเรียก เงินเดือน แต่ถ้ามีการระบุเงินเดือนในจดหมายสมัครงานควรศึกษาถึงอัตราและขั้นเงินเดือนที่ควรได้รับให้เหมาะสม"},{"n":28,"q":"ข้อใดไม่ใช่กิจกรรมที่ต้องใช้ประวัติย่อเป็นองค์ประกอบ","o":["การสมัครแข่งขัน","การสมัครงาน","การสมัครขอทุน","การสมัครชิงทุน"],"a":4,"e":"การเขียนประวัติย่อ (Resume) เป็นการเขียนแนะนำตัวเองเพื่อนำไปใช้ประโยชน์ในชีวิตประจำวันทั่ว ๆ ไป ทั้งการ สมัครงาน การสมัครขอทุน หรือการสมัครแข่งขันในทักษะต่างๆ รวมทั้งอาจจะหมายถึง การสมัครเรียนต่อด้วยก็ได้ ดัง นั้นการเขียนประวัติย่อจึงไม่ได้หมายถึงแต่การแนะนำตัวเองเพื่อใช้ในการสมัครงานเท่านั้น หากแต่ยังรวมไปถึงการแนะ นำ ตัวเองต่อกิจกรรมต่าง ๆ ที่จะต้องมีการบอกเล่าความเป็นตัวตนแก่ผู้ที่เราจะต้องแนะนำให้รู้จักตัวตนของเราได้ทราบ"},{"n":29,"q":"การทำรายงานมีความแตกต่างจากการทำวิทยานิพนธ์อย่างไร","o":["หัวข้อไม่ลึกมาก","อาจารย์ที่ปรึกษาดี","ข้อมูลต้องแน่น","ความหนาของเล่ม"],"a":1,"e":"รายงานมีความแตกต่างจากวิทยานิพนธ์ตรงที่รายงานวิชาการในระดับที่ผู้เรียน ต้องเรียบเรียงนั้น เป็นส่วนประ กอบในวิชาที่นักศึกษาลงทะเบียนเรียน และยังเป็นการศึกษาที่เปิดกว้างให้นักศึกษาสามารถเลือกศึกษาได้อย่างอิสระ โดยอาจจะมาขอคำแนะนำปรึกษาจากอาจารย์ผู้สอนในรายวิชา สำหรับหัวข้อที่เลือกศึกษาก็ไม่จำเป็นต้องมีความลึกซึ้ง เกินไป ยกเว้นเสีย แต่ถ้าเป็นรายงานก่อนสำเร็จการศึกษาระดับปริญญาบัณฑิตที่เราเรียกว่า \" ภาคนิพนธ์ หรือสารนิพนธ์\" ก็จะต้องมีแนวทางปฏิบัติเหมือนกับการทำวิทยานิพนธ์"},{"n":30,"q":"หลักในการเลือกหัวข้อเรื่องรายงาน จะต้องขึ้นอยู่กับสิ่งใดเป็นสำคัญ","o":["ความสงสัย","ความใส่ใจ","ความตั้งใจ","ความอยากรู้"],"a":1,"e":"หัวข้อเรื่อง หรือประเด็นในการศึกษา คือ หัวใจสำคัญของการจัดทำรายงานเพราะถ้านักศึกษาไม่มีหัวข้อเรือง นักศึกษาก็จะไม่สามารถไปสืบค้นข้อมูล เพื่อนำมาอ่านและเรียบเรียงเป็นโครงเรืองของการทำรายงานต่อไปได้ ซึ่งหัวข้อ เรื่องนั้นจะเกิดมาจากความสงสัยความสนใจของนักศึกษาที่มีต่อเรื่องราว เหตุการณ์ แต่บางครั้งหัวข้อเรื่องก็อาจเกิดมา จากการ อ่านมาก รู้มาก จึงทำให้นักศึกษามีประเด็นหรือมีข้อสงสัยใครอยากจะได้คำตอบ"},{"n":31,"q":"ข้อใดต่อไปนี้ไม่ใช่ความหมายของหนังสือราชการ","o":["ข้อมูลข่าวสารหรือหนังสือที่ได้รับจากระบบสารบรรณอิเล็กทรอนิกส์","เอกสารที่หน่วยงานราชการทำขึ้น เพื่อใช้เป็นหลักฐานราชการ","หนังสือที่หน่วยงานอื่นที่ไม่ใช่ส่วนราชการหรือบุคคลภายนอกส่งถึงส่วนราชการ","ไม่มีข้อใดถูก"],"a":4,"e":"หนังสือราชการ หมายถึง เอกสารที่เป็นหลักฐานในราชการ สามารถจำแนกรูปแบบนอกเหนือจากตัวเลือกข้อ 1 - 3 ได้ดังนี้ 1. หนังสือที่มีไปมาระหว่างส่วนราชการ 2. หนังสือที่ส่วนราชการมีไปถึงหน่วยงานอื่นที่ไม่ใช่ส่วนราชการหรือส่งถึงบุคคลภายนอก 3. เอกสารที่หน่วยงานราชการทำขึ้นตามกฎหมาย ระเบียบ หรือข้อบังคับ"},{"n":32,"q":"ข้อใดคือหนังสือติดต่อราชการที่มีความเป็นทางการสูง เป็นหนังสือที่ติดต่อกันระหว่างส่วนราชการ หรือ ส่วนราชการติดต่อหน่วยงานอื่นที่ไม่ใช่ราชการ หรือบุคคลภายนอก","o":["หนังสือภายนอก","หนังสือภายใน","หนังสือสั่งการ","หนังสือประทับตรา"],"a":1,"e":"หนังสือภายนอก คือ หนังสือติดต่อราชการที่มีความเป็นทางการสูง เป็นหนังสือ ที่ติดต่อกันระหว่างส่วนราชการ หรือส่วนราชการติดต่อหน่วยงานอื่นที่ไม่ใช่ราชการ หรือ บุคคลภายนอก ใช้กระดาษตราครุฑ 3 เซนติเมตร"},{"n":33,"q":"ข้อใดไม่จัดเป็นหนังสือสั่งการ","o":["ข้อบังคับ","คำสั่ง","ประกาศ","ระเบียบ"],"a":3,"e":"หนังสือสั่งการมี 3 ชนิด ได้แก่ 1. คำสั่ง หมายถึง ข้อความต่าง ๆ ที่ผู้บังคับบัญชาสั่งการให้ปฏิบัติโดยชอบด้วยกฎหมายใช้กระดาษตราครุฑ 2. ระเบียบ หมายถึง ข้อความต่าง ๆ ที่ผู้มีอำนาจหน้าที่ได้วางไว้ โดยอาศัยอำนาจของกฎหมายหรือไม่ก็ได้ เพื่อถือเป็น หลักปฏิบัติงานเป็นการประจำ ใช้กระดาษตราครุฑ 3. ข้อบังคับ หมายถึง ข้อความต่าง ๆ ที่ผู้มีอำนาจหน้าที่กำหนดให้ใช้ โดยอาศัยอำนาจของกฎหมายที่บัญญัติให้ กระทำได้ ใช้กระดาษตราครุฑ"},{"n":34,"q":"ข้อใดไม่อยู่ในขอบข่ายของหนังสือประทับตรา","o":["การแจ้งผลงานที่ได้ดำเนินการไปแล้วให้ส่วนราชการที่เกี่ยวข้องทราบ","เรื่องที่หัวหน้าส่วนราชการระดับกองขึ้นไปกำหนด โดยทำเป็นคำสั่งให้ใช้หนังสือประทับตรา","การส่งหนังสือ สิ่งของ เอกสาร หรือบรรณสาร","การเตือนเรื่องที่ค้าง"],"a":2,"e":"หนังสือประทับตราให้ใช้ได้ทั้งระหว่างส่วนราชการกับส่วนราชการ และระหว่าง ส่วนราชการกับ บุคคลภายนอก เฉพาะกรณีที่ไม่เป็นเรื่องสำคัญ ได้แก่ 1. การขอรายละเอียดเพิ่มเติม 2. การส่งหนังสือ สิ่งของ เอกสาร หรือบรรณสาร 3. การตอบรับทราบที่ไม่เกี่ยวกับราชการสำคัญหรือการเงิน 4. การแจ้งผลงานที่ได้ดำเนินงานไปแล้วให้ส่วนราชการที่เกี่ยวข้องทราบ 5. การเตือนเรื่องที่ค้าง 6. เรื่องที่หัวหน้าส่วนราชการระดับกรมขึ้นไปกำหนด โดยทำเป็นคำสั่งให้ใช้หนังสือประทับตรา"},{"n":35,"q":"ข้อใดคือข้อความต่าง ๆ ที่ผู้มีอำนาจหน้าที่ได้วางไว้ โดยอาศัยอำนาจของกฎหมายหรือไม่ก็ได้ เพื่อ ถือเป็นหลักปฏิบัติงานเป็นการประจำ","o":["คำสั่ง","ระเบียบ","ข้อบังคับ","ประกาศ"],"a":2,"e":"ดูบรรยายเพิ่มเติมข้อ 33. ประกอบ"},{"n":36,"q":"ข้อใดคือข้อความต่าง ๆ ที่ทางราชการแถลง เพื่อทำความเข้าใจในกิจการของราชการ หรือเหตุการณ์ ใดๆให้ทราบชัดเจนทั่วกัน","o":["ประกาศ","แถลงการณ์","คำสั่ง","ข่าว"],"a":2,"e":"แถลงการณ์ หมายถึง ข้อความต่าง ๆ ที่ทางราชการแถลง เพื่อทำความเข้าใจในกิจการของราชการ หรือเหตุกรณี ใดๆ ให้ทราบชัดเจนทั่วกัน ใช้กระดาษตราครุฑ"},{"n":37,"q":"หนังสือที่มีคุณค่าทางประวัติศาสตร์ทุกสาขาวิชา และมีคุณค่าต่อการศึกษา มีอายุการเก็บกี่ปี","o":["5 ปี","10 ปี","15 ปี","เก็บไว้ตลอดไป"],"a":4,"e":"หนังสือที่มีคุณค่าทางประวัติศาสตร์ทุกสาขาวิชา และมีคุณค่าต่อการศึกษา ค้นคว้าวิจัย ให้เก็บไว้เป็นหลักฐาน สำคัญทางประวัติศาสตร์ของชาติตลอดไป หรือตามที่สำนักหอจดหมายเหตุแห่งชาติ กรมศิลปากร กำหนด"},{"n":38,"q":"หนังสือราชการอิเล็กทรอนิกส์มีอายุการเก็บกี่ปี","o":["5 ปี","10 ปี","15 ปี","ไม่มีอายุการเก็บหนังสือ"],"a":4,"e":"หนังสือราชการอิเล็กทรอนิกส์ไม่มีอายุการเก็บหนังสือ โดยปกติให้เก็บไว้ตลอดไปเว้นแต่กรณีจำเป็นต้องเพิ่มพื้นที่ จัดเก็บในระบบสารบรรณอิเล็กทรอนิกส์ หรือมีเหตุผลจำเป็น อื่นใด ถ้าหากจะทำลายหนังสืออิเล็กทรอนิกส์ หัวหน้า ส่วนราชการต้องมีคำสั่งให้ทำลายเฉพาะหนังสือที่เก็บมาเกิน 20 ปี และได้ส่งให้สำนักหอจดหมายเหตุแห่งชาติ กรม ศิลปากรแล้ว ทั้งนี้วิธีการทำลาย คือ ลบออกจากระบบสารบรรณอิเล็กทรอนิกส์ และให้ลบหนังสืออิเล็กทรอนิกส์ที่เก็บ ไว้เป็นเวลานานที่สุดย้อนขึ้นมา"},{"n":39,"q":"การจัดทำสำเนาหนังสือราชการ ข้อใดต่อไปนี้ผิด","o":["การจัดทำสำเนาหนังสือราชการ ให้ข้าราชการพลเรือนประเภททั่วไประดับปฏิบัติงานรับรอง สำเนาถูกต้อง","สำเนาอิเล็กทรอนิกส์หนังสือที่หน่วยงานสารบรรณกลางได้ส่งหนังสือด้วยระบบสารบรรณ อิเล็กทรอนิกส์ไปแล้ว ให้ถือว่าเป็นการเก็บสำเนาหนังสือไว้ในระบบอิเล็กทรอนิกส์ โดยไม่ ต้องเก็บเป็นเอกสารอีก","หากกรณีที่ต้องการแจ้งให้ส่วนราชการอื่นที่เกี่ยวข้องทราบ ให้ส่งสำเนาให้ทราบ โดยทำเป็น หนังสือประทับตรา","การจัดทำสำเนาหนังสือราชการ โดยปกติจะจัดทำสำเนาคู่ฉบับเก็บไว้ที่ต้นเรื่อง 1 ฉบับ และ สำเนาเก็บไว้ที่หน่วยงานสารบรรณกลาง 1 ฉบับ"],"a":1,"e":"สำเนาถูกต้อง บรรยายเพิ่มเติม การจัดทำสำเนาหนังสือราชการ ให้มีคำรับรองว่าสำเนาถูกต้อง โดยให้ข้าราชการพลเรือนหรือพนักงานส่วน ท้องถิ่นประเภทวิชาการระดับปฏิบัติการ หรือประเภททั่วไประดับชำนาญงานขึ้นไป หรือเจ้าหน้าที่ของรัฐอื่นที่เทียบเท่า หรือพนักงานราชการ ซึ่งเป็นเจ้าของเรื่องที่ทำสำเนาหนังสือนั้น ลงลายมือชื่อรับรอง พร้อมทั้งลงชื่อตัวบรรจง ตำแหน่ง และวันเดือน ปี ที่รับรองไว้ที่ขอบล่างของหนังสือ"},{"n":40,"q":"ภาษาของกลุ่มชาวเล (มอแกน มอเกลน และอูรักลาโว้ย) จัดอยู่ในกลุ่มภาษาใด","o":["มอญ – เขมร","ไท – กะได้","ออสโตรนีเซียน","จีน – ทิเบต"],"a":3,"e":"สังคมไทยเป็นสังคมพหุวัฒนธรรมที่มีกลุ่มชาติพันธุ์เป็นจำนวนมาก ดังนั้นความหลากหลายของภาษาจึงมีมาก ด้วย ซึ่งกลุ่มชาติพันธุ์หลัก ๆ ในสังคม อาจจำแนกได้ดังนี้ 1. กลุ่มภาษาไท - กะได ซึ่งถือว่าเป็นกลุ่มภาษาที่ใช้มากที่สุดในสังคมไทย 2. กลุ่มภาษามอญ - เขมร ถือเป็นภาษาที่ปะปนอยู่ในภาษาไทยปัจจุบัน 3. กลุ่มภาษาจีน - ทิเบต ได้แก่ ภาษาจีนแขนงต่าง ๆ และภาษาพม่า รวมไปถึงภาษาของชาวเขาอีกหลายเผ่า 4. กลุ่มภาษาออสโตรนีเซียน ได้แก่ ภาษามลายู ภาษาของกลุ่มชาวเล (มอแกน มอเกลนและอูรักลาโว้ย)"},{"n":41,"q":"การจัดส่งหนังสือจัดเก็บที่กองจดหมายเหตุแห่งชาติ กรมศิลปากร ข้อใดต่อไปนี้ผิด","o":["หนังสือที่ส่วนราชการมีความจำเป็นต้องเก็บไว้ที่ส่วนราชการนั้น ให้จัดทำบัญชีหนังสือครบ 20 ปีที่ขอเก็บเอง ส่งมอบให้สำน้าหอจดหมายเหตุแห่งชาติ กรมศิลปากร","ให้ส่วนราชการส่งบัญชีส่งมอบหนังสือครบ 20 ปี ให้สำนักหอจดหมายเหตุแห่งชาติ กรม ศิลปากร","ทุกปีปฏิทินให้ส่วนราชการจัดส่งหนังสือที่มีอายุครบ 20 ปี นับจากวันที่ได้จัดทำขึ้นที่เก็บไว้ ณ ส่วนราชการใด","ให้ส่วนราชการส่งมอบหนังสือครบ 20 ปี ภายในวันที่ 3 มกราคมของปีถัดไป"],"a":4,"e":"การจัดส่งหนังสือจัดเก็บที่กองจดหมายเหตุแห่งชาติ กรมศิลปากร ทุกปีปฏิทินให้ส่วนราชการจัดส่งหนังสือที่มี อายุครบ 20 ปี นับจากวันที่ได้จัดทำขึ้นที่เก็บไว้ ณ ส่วนราชการใดพร้อมทั้งให้ส่งบัญชีส่งมอบหนังสือครบ 20 ปี ให้ สำนักหอจดหมายเหตุแห่งชาติ กรมศิลปากรภายในวันที่ 31 มกราคมของปีถัดไป"},{"n":42,"q":"หน่วยงานใดที่ให้การสนับสนุนการพัฒนาระบบสารบรรณอิเล็กทรอนิกส์","o":["สำนักงานพัฒนารัฐบาลดิจิทัล (องค์กรมหาชน)","สำนักเทคโนโลยีสารสนเทศและการสื่อสาร","สำนักดิจิทัลเทคโนโลยี","สำนักเทคโนโลยีเพื่อการเรียนการสอน"],"a":1,"e":"หากประสบปัญหาทางเทคนิคในการปฏิบัติงานสารบรรณด้วยระบบสารบรรณ อิเล็กทรอนิกส์ หรือในการ เชื่อมโยงข้อมูล หรือระบบกับส่วนราชการและหน่วยงานอื่น ๆให้ขอรับการสนับสนุนหรือขอความช่วยเหลือการพัฒนา ระบบสารบรรณอิเล็กทรอนิกส์ของ ส่วนราชการจากสำนักงานพัฒนารัฐบาลดิจิทัล (องค์กรมหาชน) หรือติดต่อ สำนักงานพัฒนาธุรกรรมทางอิเล็กทรอนิกส์ได้"},{"n":43,"q":"ปลาคอในภาษาถิ่นอีสาน มีความหมายตรงกับข้อใด","o":["ปลาตะเพียน","ปลาช่อน","ปลาดุก","ปลาบึก"],"a":2,"e":"ตัวอย่างคำในภาษาถิ่นต่าง ๆ ได้แก่ ภาษาถิ่นอีสาน เช่น เว่าพื้น (นินทา), ห่าว (ตื่นตัว), ปลาคอ (ปลาช่อน), งึด (แปลก)"},{"n":44,"q":"ภาษาไทยในสมัยอยุธยา ปรากฏคำยืมจากภาษาใดต่อไปนี้เป็นอย่างมาก","o":["มอญ","เขมร","ญวน","มลายู"],"a":2,"e":"ภาษาไทยสมัยอยุธยาอาจกำหนดอายุได้ตั้งแต่สมัยสมเด็จพระรามาธิบดีที่ 1 จนถึงสมัยพระบาทสมเด็จพระนั่งเกล้าเจ้า อยู่หัว ซึ่งลักษณะสำคัญของภาษาไทยในช่วงเวลานี้มักจะปรากฏคำยืมจากภาษาบาลี สันสกฤต และเขมรเป็นอย่างมาก"},{"n":45,"q":"พ่อขุนรามคำแหงทรงประดิษฐ์อักษรไทยจากการนำอักษรใดมาปรับปรุง","o":["อักษรมอญและอักษรจีน","อักษรมอญและอักษรขอม","อักษรกวิและอักษรปัญจาบี","อักษรขอมและอักษรปัลลวะ"],"a":2,"e":"โดยหลักฐานที่สำคัญ คือ ศิลาจารึก สุโขทัยหลักที่ 1 ที่พ่อขุนรามคำแหงทรงประดิษฐ์อักษรไทยใช้เป็นครั้งแรก จากการนำอักษรมอญและอักษรขอมมาปรับปรุงจนเป็นลายสือไทยและในจารึกก็ปรากฏภาษาไทยในสมัยสุโขทัย ซึ่ง มักเป็นคำเดี่ยว บางคำยังใช้ต่อเนื่องมาจนถึง ปัจจุบัน บางคำเป็นส่วนหนึ่งของคำประสม บางคำก็เลิกใช้ ฯลฯ"},{"n":46,"q":"ตื้อ\" ในภาษาถิ่นเหนือ มีความหมายตรงกับข้อใด","o":["สิบล้าน","ร้อยล้าน","พันล้าน","หมื่นล้าน"],"a":3,"e":"คำว่า \"ตื้อ\" = พันล้าน ในคำถิ่นเหนือหรืออีสาน"},{"n":47,"q":"ศัพท์บัญญัติในภาษาไทย ผู้เชี่ยวชาญนิยมใช้คำจากภาษาใดเพื่อสร้างศัพท์ใหม่","o":["มอญ – พม่า","บาลี – สันสกฤต","มลายู – เขมร","ฮินดู – ทมิพ"],"a":2,"e":"คำศัพท์บัญญัติจำนวนมากไม่ใช่คำพื้นฐาน แต่มักสร้างขึ้นใหม่จากผู้รู้หรือผู้ที่เชี่ยวชาญ ซึ่งนิยมใช้คำบาลี - สันสกฤตที่นำมาใช้ในภาษาไทยอยู่ก่อนแล้วมาสร้างเป็นคำใหม่เพื่อใช้เรียกชื่อ สิ่งประดิษฐ์ใหม่ หรือศัพท์ทางวิชาการ เช่น ญาณวิทยา อภิปรัชญา กลศาสตร์ปฏิวัติ อธิการบดี อัตลักษณ์ วัฒนธรรม มโนทัศน์ คติชน อนามัย ฯลฯ ซึ่งคำเหล่านี้ จะไม่ใช่คำประสมตามระบบการสร้างคำแบบภาษาคำโดด เพราะคำที่นำมารวมกันดังกล่าวเป็นคำภาษาบาลี - สันสกฤต และใช้ไวยากรณ์ บาลี - สันสกฤต คือ การสร้างคำด้วยวิธีการสมาสและสนธิซึ่งถือเป็นการเปลี่ยนแปลงของภาษาไทย รูปแบบหนึ่ง"},{"n":48,"q":"เร่าร้อน\" จัดเป็นการสร้างคำใหม่ประเภทใด","o":["คำประสม","คำซ้อน","คำซ ้า","คำคู่"],"a":2,"e":"คำช้อน คือ การนำคำมูลมาประสมกัน เพียงแต่คำมูลนั้นมีความหมายใกล้เคียงหรือเหมือนกัน จึงเรียกว่า \"คำซ้อน\" ซึ่งเมื่อเรานำคำมูลที่มีความหมายใกล้เคียงหรือเหมือนกันมาประสมกันแล้ว ต้องเกิดคำใหม่ที่มีความหมายใหม่จึงจะเป็น การสร้างคำศัพท์ เช่น ตัดสิน ต้มตุ๋น ดูดดื่ม ขมขื่น เย็นชา เยือกเย็น ถากถาง ฯลฯ ทั้งนี้มีคำซ้อนอีกกลุ่มหนึ่งที่ความหมาย ใกล้เคียง กับคำมูลเดิม เพียงแต่เน้นให้หนักแน่นขึ้น เช่น เร่าร้อน โยกย้าย ขัดแย้ง มีดมน เลวร้าย ดีงาม เลิศเลอ ชุกชุม ทิ่ม แทง ฯลฯ"},{"n":49,"q":"ในสมัยพระมหาธรรมราชาที่ 1 (ลิไทย) ได้หันกลับไปใช้อักขรวิธีของอักษรแบบใด","o":["หลังปัลลวะ","มอญ","ขอม","กวิ"],"a":3,"e":"ในสมัยของพระมหาธรรมราชาที่ 1 (พญาลิไทย) นั้น ลักษณะของอักขรวิธีจะมีความแตกต่างจากสมัยพ่อขุน รามคำแหง เพราะหันกลับไปใช้อักขรวิธีแบบขอม โดยอักษรในสมัยพญาลีไทยได้แพรไปยังอาณาจักรอื่น ๆ และมี พัฒนาการจนเป็นรูปแบบของตนเอง"},{"n":50,"q":"ข้อใดต่อไปนี้ไม่ใช่ลักษณะการใช้พยัญชนะในสมัยพ่อขุนรามคำแหง","o":["ตัวสะกดเขียนแยกออกไปค่อนข้างชัดเจน","พยัญชนะต้นและสระเขียนชิดติดกัน","อักษรควบกล ้า เส้นหลังของพยัญชนะตัวแรกกับเส้นหน้าของพยัญชนะตัวที่ 2 เขียนชิดติดกัน","อักษรนำ เส้นหลังของพยัญชนะตัวแรกกับเส้นหน้าของพยัญชนะตัวที่ 2 เขียนแยกจากกัน"],"a":4,"e":"ลักษณะการใช้พยัญชนะในสมัยสุโขทัย มีดังนี้ 1. พยัญชนะต้นและสระเขียนชิดติดกัน 2. ตัวสะกดเขียนแยกออกไปค่อนข้างชัดเจน 3. อักษรควบกล ้า เส้นหลังของพยัญชนะตัวแรกกับเส้นหน้าของพยัญชนะตัวที่ 2เขียนชิดติดกัน 4. อักษรนำ เส้นหลังของพยัญชนะตัวแรกกับเส้นหน้าของพยัญชนะตัวที่ 2 เขียนชิดติดกัน"},{"n":51,"q":"อักษรไทยน้อย เป็นอักษรที่นิยมใช้ในวัฒนธรรมใด","o":["ล้านนา","ล้านช้าง","ไทยใหญ่","อยุธยา"],"a":2,"e":"วัฒนธรรมล้านช้างได้มีการพัฒนาตัวอักษรจากอักษรไทยสุโขทัย จนเป็น อักษรไทยน้อย ส่วนวัฒนธรรมล้านนาก็ ได้ส่งอิทธิพลการใช้ตัวอักษรธรรมให้กับวัฒนธรรม ล้านช้าง จนเกิดเป็นตัวอักษรธรรมอีสานขึ้น"},{"n":52,"q":"ข้อใดไม่ใช่ลักษณะสำคัญของอักขรวิธีในสมัยอยุธยาตอนต้น","o":["จำนวนตัวอักษรทั้งพยัญชนะและสระยังคงเหมือนกับอักษรสมัยสุโขทัย","พบการใช้เครื่องหมายแทนสระ 2 ตัว คือ ไม้หันอากาศ และเครื่องหมายฝนทอง","พบการใช้เครื่องหมายแทนพยัญชนะ 1 ตัว คือ นิคหิต","พบการใช้รูปวรรณยุกต์ไม้ตรีเป็นครั้งแรก"],"a":4,"e":"ตัวอักษรและอักขรวิธีในสมัยอยุธยาตอนต้น มีลักษณะดังนี้ 1. จำนวนตัวอักษรในสมัยอยุธยาตอนต้น ทั้งพยัญชนะและสระยังคงเหมือนกับอักษรในสมัย สุโขทัย แต่พบการใช้ เครื่องหมายไม้ยมกขึ้นเป็นครั้งแรก 2. การใช้วรรณยุกต์ยังคงมี 2 รูป เช่นเดียวกับสมัยสุโขทัย คือ ไม้เอกและไม้โท แต่ไม่ปรากฏหลักเกณฑ์การใช้ที่ แน่นอน 3. พบการใช้เครื่องหมายแทนสระ 2 ตัว คือ เครื่องหมายไม้หันอากาศ และเครื่องหมายฝนทอง ส่วนเครื่องหมายแทน พยัญชนะมี 1 ตัว คือ นิคหิต และเครื่องหมายประกอบการเขียน 1 ตัว คือ เครื่องหมายไม้ยมก ฯลฯ"},{"n":53,"q":"อักษรไทยย่อ ปรากฏครั้งแรกในสมัยพระมหากษัตริย์พระองค์ใด","o":["พระรามาธิบดีที่ 2","พระศรีสุธรรมราชา","พระเจ้าทรงธรรม","พระนเรศวรมหาราช"],"a":3,"e":"อักษรในสมัยอยุธยาตอนกลางปรากฏอยู่ 2 รูปแบบ ได้แก่ 1. อักษรแบบธรรมดา ซึ่งสืบเนื่องต่อมาจากสมัยอยุธยาตอนต้น 2. อักษรไทยย่อ เป็นตัวอักษรที่ประยุกต์จากตัวอักษรแบบธรรมดาให้ประณีตบรรจงมากขึ้น สันนิษฐานกันว่า ได้ แบบมาจากอักษรขอมบรรจงที่ใช้ควบคู่กับตัวอักษรไทยในสมัยสุโขทัยโดยอักษรไทยย่อพบครั้งแรกในสุมัยสมเด็จพระ เจ้าทรงธรรม และนิยมใช้อย่างมากในสมัยสมเด็จพระนารายณ์ ทั้งนี้ตัวอักษรไทยย่อมักใช้บันทึกเรื่องราวที่เป็นทางการ และศาสนา"},{"n":54,"q":"เครื่องหมายใดต่อไปนี้ปรากฏใช้เป็นครั้งแรกในสมัยอยุธยาตอนปลาย - ธนบุรี","o":["นิคหิต","ลากข้าง","ฟันหนู","ทัณฑฆาต"],"a":4,"e":"ในสมัยอยุธยาตอนปลาย - ธนบุรี เริ่มปรากฏการใช้เครื่องหมายทัณฑฆาต (การันต์) เป็นครั้งแรก ซึ่งการใช้ เครื่องหมายทัณฑฆาตในสมัยอยุธยาตอนปลาย - ธนบุรีมักใช้กำกับบนพยัญชนะที่เป็นตัวสะกด โดยลักษณะดังกล่าวนี้ จะใช้ต่อเนื่องไปจนถึงสมัยรัตนโกสินทร์ตอนต้น"},{"n":55,"q":"อักษรอริยกะ เป็นอักษรที่ใช้เขียนภาษาใด","o":["อินดี","บาลี","สันสกฤต","ทมิฬ"],"a":2,"e":"อักษรอริยกะ เป็นอักษรที่พระบาทสมเด็จพระจอมเกล้าเจ้าอยู่หัว (รัชกาลที่ 4) ประดิษฐ์ขึ้น เพื่อใช้ในการเขียน ภาษาบาลีในกลุ่มพระสงฆ์ธรรมยุติกนิกาย โดยมีอักขรวิธีที่เขียนสระไว้บนบรรทัดเดียวกันกับพยัญชนะ ดังนี้ 1. สระวางไว้หลังพยัญชนะต้น 2. ถ้าเสียงสระอยู่หน้าคำ ใช้สระเขียนได้ 3. หากพยัญชนะไม่มีสระตามหลัง แสดงว่าเป็นตัวสะกด 4. หากคำใดเป็นเสียงนิคหิตจะใช้ทั้งสระอะ และตามด้วยนิคหิต"},{"n":56,"q":"ข้อใดไม่ใช่ลักษณะสำคัญของอักษรอริยกะ","o":["สระวางไว้หลังตัวสะกด","ถ้าเสียงสระอยู่หน้าคำ ใช้สระเขียนได้","หากคำใดเป็นเสียงนิคหิตจะใช้ทั้งสระอะ และตามด้วยนิคหิต","หากพยัญชนะไม่มีสระตามหลัง แสดงว่าเป็นตัวสะกด"],"a":1,"e":"ดูบรรยายเพิ่มเติมข้อ 55. ประกอบ"},{"n":57,"q":"อักขรวิธีแบบใหม่ ปรากฏครั้งแรกในสมัยพระมหากษัตริย์พระองค์ใด","o":["พระบาทสมเด็จพระปกเกล้าเจ้าอยู่หัว","พระบาทสมเด็จพระจุลจอมเกล้าเจ้าอยู่หัว","พระบาทสมเด็จพระมงกุฎเกล้าเจ้าอยู่หัว","พระบาทสมเด็จพระจอมเกล้าเจ้าอยู่หัว"],"a":3,"e":"อักขรวิธีแบบใหม่ เป็นอักษรที่พระบาทสมเด็จพระมงกุฎเกล้าเจ้าอยู่หัว (รัชกาลที่ 6) คิดค้นตัดแปลงอักษรไทย โดยเฉพาะอักขรวิธี ซึ่งมีรายละเอียดดังนี้ 1. ใช้พยัญชนะ วรรณยุกต์ เหมือนเดิมทุกตัว 2. สระเปลี่ยนรูปใหม่ ให้วางสระไว้หลังพยัญชนะต้นบนบรรทัดเดียวกันทุกตัว 3. ให้เขียนวรรคเป็นคำ ๆ ไม่เขียนติดต่อกันเป็นพืดเหมือนเดิม"},{"n":58,"q":"อักษรตัวใดต่อไปนี้ถูกตัดออกไปในสมัยจอมพล ป. พิบูลสงคราม","o":["ข","ซ","ส","พ"],"a":4,"e":"อักษรสมัยจอมพล ป. พิบูลสงคราม เป็นการเปลี่ยนรูปแบบทางด้านอักขรวิธีเท่านั้น และได้ประกาศใช้เพียงแค่ 2 ปี คือ พ.ศ. 2485 - 2487 โดยมีหลักเกณฑ์ ดังนี้ 1. พยัญชนะให้ตัดออก 13 ตัว จาก 44 ตัว จึงเหลือเพียง 31 ตัว โดยตัวที่ตัดออก คือ ข ค ม ณ ฎ ฏ ฐ ท ฒ ณ ศ ษ พ เนื่องจากเสียงซ ้ากับตัวอักษรอื่นลดความสับสนในการใช้คำ 2. สระให้ตัดออก 5 ตัว จาก 34 ตัว เนื่องจากเสียงช ้ากับสระอื่น ๆ ซึ่งตัวที่ตัดออก คือ ใด ๆ 3. อักขรวิธี ปรับปรุงให้อ่านเขียนได้ง่ายขึ้น ยกเลิกการเขียนซับข้อน โดยเฉพาะคำที่เป็นภาษาบาลี - สันสกฤต เพื่อให้ เขียนคำได้ง่ายขึ้น เช่น วัธนธัม สมควน ภาสาไทย เป็นต้น"},{"n":59,"q":"สระตัวใดต่อไปนี้ไม่ได้ถูกตัดออกไปในสมัยจอมพล ป. พิบูลสงคราม","o":["ใ","ฤ","ไ","ภๅ"],"a":3,"e":"ดูบรรยายเพิ่มเติมข้อ 58. ประกอบ"},{"n":60,"q":"ข้อใดไม่ใช่ลักษณะสำคัญของอักขรวิธีแบบใหม่","o":["พยัญชนะ วรรณยุกต์ เหมือนเดิมทุกตัว","รูปสระยังคงเดิมทั้งหมด","วางสระไว้หลังพยัญชนะต้นบนบรรทัดเดียวกันทุกตัว","เขียนวรรคเป็นคำ ๆ ไม่เขียนติดต่อกันเป็นพืดเหมือนเดิม"],"a":2,"e":"ดูบรรยายเพิ่มเติมข้อ 57. ประกอบ"},{"n":61,"q":"เหตุใดจึงกล่าวว่า การพูดเป็นทั้งศาสตร์และศิลป์","o":["เพราะการพูดเป็นรูปแบบการสื่อสารที่เก่าแก่ที่สุด","เพราะการพูดช่วยให้มนุษย์ประสบความสำเร็จในหน้าที่การงาน","เพราะการพูดช่วยสร้างความเข้าใจอันดีแก่คนในสังคม","เพราะการพูดสามารถศึกษาและฝึกฝนให้เกิดความชำนาญได้"],"a":4,"e":"ด้วยเหตุที่การพูดมีความสำคัญต่ออาชีพต่าง ๆ จึงทำให้ในสถาบันการศึกษาชั้นสูงจำนวนมากมีการสอนวิชาการ พูดเพื่อ ให้ความรู้เกี่ยวกับการพูด รวมไปถึงฝึกฝนทักษะการพูด ต่าง ๆ โดยวิชาการพูดที่ว่านี้ บางแห่งใช้ชื่อว่า \"วาทการ วาทศาสตร์ หรือวาทศิลป์\" เป็นวิชา ที่สามารถเรียนรู้ได้ทั้งภาคทฤษฎีและภาคปฏิบัติเช่นเดียวกับศาสตร์แขนงอื่น ๆ ดังนั้นการพูด จึงเป็นทั้งศาสตร์และศิลป์ เนื่องจากการพูดมีหลักวิชาที่ผู้เรียนสามารถศึกษาและฝึกหัด/ฝึกฝนเพื่อให้เกิด ทักษะความชำนาญได้"},{"n":62,"q":"ข้อใดไม่ใช่การพูดที่ดี","o":["พูดมีประโยชน์","พูดน่าฟัง","พูดตามที่คิด","พูดมีสาระ"],"a":3,"e":"วัตถุประสงค์ของการเรียนวิชาการพูดประการหนึ่ง ได้แก่ เพื่อสร้างมนุษย์สัมพันธ์คือ การพูดดี พูดมีประโยชน์ พูดน่าฟัง ย่อมทำให้ผู้พูดเป็นที่รักและมีมิตรมาก นอกจากนี้การพูด ที่ดียังมีส่วนช่วยคลี่คลายปัญหาความขัดแย้งต่าง ๆ ได้อีกด้วย"},{"n":63,"q":"เหตุใดจึงกล่าวว่า การพูดก่อให้เกิดความเข้าใจง่ายกว่าการสื่อสารประเภทอื่น","o":["เพราะสารของการพูดดำรงอยู่ได้นาน","เพราะการพูดใช้แลกเปลี่ยนทัศนคติระหว่างผู้พูดและผู้ฟัง","เพราะการพูด ประกอบด้วย วัจนภาษาและอวัจนภาษา","เพราะการพูดถ่ายทอดข้อมูลได้อย่างมีประสิทธิภาพ"],"a":3,"e":"ดูบรรยายเพิ่มเติมข้อ 4. ประกอบ ความสำคัญของการพูดประการหนึ่ง คือ การพูด ก่อให้เกิดความเข้าใจง่ายกว่าการสื่อสารประเภทอื่น เพราะการ พูด ประกอบด้วย วัจนภาษาและอวัจนภาษา กล่าวคือ การพูดต้องใช้น ้าเสียง กิริยาท่าทาง ถ้อยคำ ตลอดจนสีหน้าแววตา ของผู้พูดประกอบ จึงจะช่วยให้ผู้ฟังเข้าใจสารของผู้พูดได้ง่ายกว่าการอ่านเพียงอย่างเดียว"},{"n":64,"q":"การพูดในข้อใดมีอิสระมากกว่าข้ออื่น","o":["การพูดระหว่างบุคคล","การพูดในที่ชุมชน","การพูดในกลุ่ม","การพูดทางสื่อสารมวลชน"],"a":1,"e":"การพูดระหว่างบุคคล เป็นการพูดขั้นพื้นฐานที่สุดของสังคมมนุษย์ไม่ว่าจะมีฐานะอาชีพ หรือหน้าที่การงาน อย่างไรก็ตาม จำเป็นต้องใช้การพูดในระดับนี้อยู่ตลอดเวลา โดยมีลักษณะสำคัญ คือ ไม่มีข้อจำกัดว่าแต่ละช่วงของการ พูดจะต้องใช้เวลามากน้อยเท่าไร ขึ้นอยู่กับกาลเทศะและความเหมาะสม ดังนั้นจึงเป็นการพูดที่มีอิสระและมีความ ยืดหยุ่นด้านเวลาสูง เช่น การทักทาย การถามสารทุกข์สุขดิบ การสนทนา การถกเถียง การปรึกษาหารือ ฯลฯ"},{"n":65,"q":"การพูดในข้อใดที่ผู้พูดไม่เห็นผู้ฟัง","o":["การพูดในกลุ่ม","การพูดในที่ชุมชน","การพูดระหว่างบุคคล","การพูดทางสื่อสารมวลชน"],"a":4,"e":"การพูดทางสื่อสารมวลขนจะแตกต่างจากการพูดระดับอื่น ๆ ในข้อที่สำคัญ ที่สุด คือ สามารถพูดให้คนฟังจำนวน มากที่กระจายกันอยู่ทุกทิศทางรับฟังพร้อมกันได้ในเวลาเดียวกัน แต่การพูดทางสื่อสารมวลชนนั้น ผู้พูดไม่สามารถ สังเกตปฏิกิริยาตอบสนองจากผู้ฟังพร้อมกันได้ในขณะที่พูด ทั้งนี้เนื้อหาของการพูดมักจะเป็นการให้ข่าวสาร ให้ความรู้ ให้ข้อคิดให้ความบันเทิง การโฆษณาสินค้า และการบริการต่าง ๆ โดยการพูดทางสื่อสารมวลชนที่ใช้มากที่สุด คือ การ พูดทางโทรทัศน์"},{"n":66,"q":"การกล่าวคำแถลงพิธีเปิดการประชุม APEC ควรใช้การพูดประเภทใด","o":["การพูดโดยการท่องจำ","การพูดโดยมีการเตรียมตัวล่วงหน้า","การพูดโดยฉับพลัน","การพูดโดยอ่านจากต้นฉบับ"],"a":4,"e":"การพูดโดยอ่านจากร่างหรือต้นฉบับ คือ การพูดในลักษณะที่เป็นการอ่านจากร่างหรือต้นฉบับที่จัดเตรียมไว้ ล่วงหน้า โดยไม่มีการเปลี่ยนแปลงข้อความแต่อย่างใด และผู้พูดไม่จำเป็นต้องคิดหาถ้อยคำใดมาใช้ นิยมใช้ในการพูดที่ ต้องการความระมัดระวังเกี่ยวกับการใช้ถ้อยคำแต่ละคำเป็นพิเศษ โดยเฉพาะในโอกาสที่เป็นพิธีการ เช่น กระแสพระราช ดำรัสของพระบาทสมเด็จพระเจ้าอยู่หัวในพระราชพิธีต่าง ๆ, คำปราศรัยของบุคคลสำคัญ, คำกล่าวใน พิธีเปิดงาน, คำ กล่าวในพิธีเปิดและปิดการประชุม, คำแถลงการณ์ของรัฐบาล เป็นต้น"},{"n":67,"q":"การพูดแบบกลอนสด หมายถึงข้อใด","o":["การพูดโดยฉับพลัน","การพูดโดยมีการเตรียมตัวล่วงหน้า","การพูดโดยการท่องจำ","การพูดโดยอ่านจากต้นฉบับ"],"a":1,"e":"การพูดโดยฉับพลัน หรือการพูดโดยไม่มีการเตรียมการล่วงหน้า เป็นการพูดแบบ ปัจจุบันทันด่วน ไม่ได้เตรียมตัว มาก่อน ผู้พูดจำเป็นต้องอาศัยปฏิภาณไหวพริบ ประสบการณ์และความรู้ความชำนาญในการพูดหรือโต้ตอบในเวลา รวดเร็ว จึงมักมีผู้เรียกการพูดชนิดนี้ว่า \"การพูดแบบกลอนสด/การพูดแบบกะทันหัน\" ทั้งนี้การพูดโดยฉับพลันมักเป็น การพูดสั้น ๆเช่น การกล่าวอวยพร การกล่าวตอบขอบคุณ การพูดในงานรื่นเริง ในงานสังสรรค์ การตอบ ปัญหาบาง ประการ การแสดงความคิดเห็น หรือให้ข้อคิดเล็ก ๆ น้อย ๆ เพื่อแก้ปัญหา ฯลฯ"},{"n":68,"q":"โดยทั่วไปการบรรยายในชั้นเรียน จัดเป็นการพูดแบบใด","o":["การพูดโดยฉับพลัน","การพูดโดยมีการเตรียมตัวล่วงหน้า","การพูดโดยอ่านจากต้นฉบับ","การพูดโดยการท่องจำ"],"a":2,"e":"การพูดโดยมีการเตรียมตัวล่วงหน้า เป็นการพูดที่ผู้พูดจะพูดจากความเข้าใจเนื้อหาที่ต้องการถ่ายทอดให้แก่ผู้ฟัง โดยผู้พูดจะต้องศึกษาค้นคว้าและเตรียมตัวล่วงหน้ามาเป็นอย่างดี จึงเป็นวิธีที่เหมาะสมที่สุดกับการพูดในแทบทุกโอกาส และเป็นที่นิยมใช้กันมาก เพราะทำให้ผู้พูดไม่สับสน มีการเรียงลำดับเรื่องว่าจะพูดอะไรก่อนหลัง ไม่ทำให้การพูดวกวน ตัวอย่างของการพูดชนิดนี้ ได้แก่ การบรรยาย การอภิปราย เป็นต้น"},{"n":69,"q":"ข้อใดเป็นคุณสมบัติของนักพูดที่ดี","o":["อ่อนน้อมถ่อมตน","หวงความรู้","พูดทุกครั้งที่มีโอกาส","ยึดมั่นในความคิดของตัวเอง"],"a":1,"e":"คุณสมบัติที่สำคัญเบื้องต้นของนักพูดที่ดีมีอยู่ 5 ประการ ดังนี้ 1. เป็นนักฟังที่ดี 2. ศึกษาหาความรู้อยู่เสมอ 3. อ่อนน้อมถ่อมตน ยอมรับฟังคำวิจารณ์ 4. เป็นตัวของตัวเอง 5. มีความสุขในการถ่ายทอดความรู้ให้ผู้อื่น"},{"n":70,"q":"ข้อใดเป็นกระบวนการฟัง","o":["ดีความ","ตอบสนอง","ได้ยิน","ถูกทุกข้อ"],"a":4,"e":"การฟัง ถือเป็นกระบวนการของการสื่อสาร ซึ่งประกอบด้วย 1. การได้ยิน 2. การตีความ 3. การเข้าใจ 4. การตอบสนอง"},{"n":71,"q":"ข้อใดเป็นมารยาทในการพูดที่ดี","o":["กล่าวถึงความภาคภูมิใจส่วนตัวแม้ไม่มีคนซักถาม","ชี้ชวนให้ผู้อื่นลงทุน เพราะไม่อยากให้เสียโอกาส","พูดความจริงแม้จะสร้างความเสียหายให้ผู้อื่น","เปิดใจรับฟังความเห็นต่างและไม่แสดงอาการดูหมิ่น"],"a":4,"e":"มารยาทในการพูด มีดังนี้ 1. ผู้พูดต้องพูดให้สอดคล้องกับเนื้อหาที่จะพูด ไม่พูดเรื่องส่วนตัวหากไม่มีใครซักถามและควรลำดับเนื้อหาในการพูด มาเป็นอย่างดี 2. ผู้พูดต้องให้เกียรติผู้ฟัง ไม่แสดงความอวดรู้ ไม่กล่าวโทษ หรือไม่แสดงอาการดูถูกเยาะเย้ยถากถางผู้ฟัง 3. ผู้พูดที่ดีควรมีความอ่อนน้อมถ่อมตน เปิดใจรับฟังความคิดเห็นของผู้อื่น 4. ผู้พูดต้องไม่กล่าวร้ายกระทบกระเทียบใคร หรือพูดอะไรที่สร้างความเสียหายให้กับผู้อื่น ฯลฯ"},{"n":72,"q":"สำนวน \"ฟังหูไว้หู\" สื่อถึงการฟังประเภทใด","o":["ฟังเพื่อความบันเทิง","ฟังเพื่อเปิดโลก","ฟังเพื่อวิพากษ์วิจารณ์","ฟังเพื่อความรู้"],"a":3,"e":"วัตถุประสงค์ของการฟังประการหนึ่ง คือ การฟังเพื่อวิพากษ์วิจารณ์ เป็นการฟังที่ก่อให้เกิดวิจารณญาณแก่ผู้ฟังเป็น สำคัญ ผู้ฟังจะต้องใช้ความคิดและการ ตัดสินใจเลือกในสิ่งที่ควรเชื่อและปฏิเสธในสิ่งที่ไม่เห็นด้วย ซึ่งตรงกับสำนวน ที่ว่า \"ฟังหูไว้หู\" (รับฟังไว้ แต่ยังไม่เชื่อทั้งหมด)"},{"n":73,"q":"เหตุใดการฟังจึงเป็นการสร้างมนุษย์สัมพันธ์","o":["เพราะการฟังแสดงให้เห็นถึงความมีมารยาท","เพราะการฟังทำให้ได้รับสารประโยชน์","เพราะการฟังช่วยเพิ่มพูนประสบการณ์","เพราะการฟังเป็นการเปิดโลก"],"a":1,"e":"ความสำคัญของการฟัง สรุปได้ดังนี้ 1. การฟังทำให้ได้รับสาระความรู้ที่เป็นประโยชน์ ช่วยให้ผู้ฟังได้รับรู้ความเป็นไปของโลก มีความคิดกว้างไกล สามารถปรับตัวทันต่อเหตุการณ์ที่เปลี่ยนแปลงอยู่ตลอดเวลา อีกทั้ง ยังช่วยให้รู้เท่าทันคนอื่น 2. การฟังเป็นการเปิดโลก ช่วยให้เป็นคนใจกว้าง รู้จักยอมรับฟังความคิดเห็นหรือวัฒนธรรม ที่แตกต่าง ทำให้เป็นคน ที่มีเหตุมีผล 3. การฟังเป็นการเพิ่มพูนประสบการณ์ โดยเฉพาะหากฟังยังอย่างตั้งใจ และนำไปใคร่ครวญ คิดวิเคราะห์ด้วยเหตุผล ก็จะช่วยเสริมสร้างความมั่นใจให้แก่ตนเอง 4. การฟังเพื่อความบันเทิง ช่วยให้ผู้ฟังได้พักผ่อนหย่อนใจ ถือเป็นส่วนหนึ่งของคุณภาพชีวิต 5. การตั้งใจฟังทำให้ได้ชื่อว่า เป็นผู้มีมารยาทในการสนทนา และการรู้จักฟังผู้อื่นทำให้ได้รับความนิยมชมชอบ เป็น การสร้างมนุษย์สัมพันธ์"},{"n":74,"q":"การรณรงค์ให้สวมหน้ากากอนามัยในที่สาธารณะ จัดเป็นการพูดแบบใด","o":["การพูดเพื่อบอกให้รู้","การพูดเพื่อจูงใจ","การพูดเพื่อจรรโลงใจ","การพูดเพื่อสร้างแรงบันดาลใจ"],"a":2,"e":"การพูดเพื่อจูงใจ หรือการพูดโน้มน้าวใจ เป็นการพูดเพื่อให้ผู้ฟังได้ความรู้ เชื่อ และเห็นด้วยทั้งทางความคิดและ การกระทำตามจุดมุ่งหมายของผู้พูด จึงเป็นการพูดที่ผู้พูดต้องการให้ผู้ฟังเกิดความเชื่อมากกว่าความรู้ โดยผู้พูดนอกจาก จะมีความชำนาญในการพูดแล้ว ยังต้อง มีหลักจิตวิทยาในการพูดเพื่อให้ผู้ฟังเชื่อหรือคล้อยตามความคิดของตน เช่น การ พูดเพื่อรณรงค์ในเรื่องต่าง ๆ เป็นต้น"},{"n":75,"q":"การรายงานผลการวิจัยวัคซีนโควิด 19 จัดเป็นการพูดแบบใด","o":["การพูดเพื่อบอกให้รู้","การพูดเพื่อจูงใจ","การพูดเพื่อสร้างแรงบันดาลใจ","การพูดเพื่อจรรโลงใจ"],"a":1,"e":"การพูดเพื่อบอกให้รู้ หรือการพูดเพื่อบอกให้ทราบ คือ การพูดที่มีวัตถุประสงค์เพื่อมุ่งให้ผู้ฟังได้รับความรู้ความ เข้าใจในข้อเท็จจริงและจดจำได้ ซึ่งผู้พูดไม่มีวัตถุประสงค์ที่ต้องการจะเปลี่ยนแปลงทัศนคติของผู้ฟัง แต่การที่ผู้ฟังได้รับ ทราบข้อเท็จจริงต่าง ๆ แล้วเกิดเปลี่ยนแปลงความคิดหรือทัศนคติจากเดิมไปนั้นก็เป็นดุลยพินิจของผู้ฟัง ดังนั้นการพูด ชนิดนี้ประกอบด้วยสารประโยชน์เป็นสำคัญ เช่น การพูดปฐมนิเทศ หรือการบรรยายกระบวนวิชา ต่าง 9, การพูดเสนอ รายงาน เช่น รายงานเกี่ยวกับบทความหรือการวิจัย, การพูดชี้แจงหรืออธิบายข้อมูล เช่น การแถลงข่าว เป็นต้น"},{"n":76,"q":"ผู้ฟังวัยใดที่จะสนใจเกี่ยวกับความปลอดภัยในชีวิตทรัพย์สินและสวัสดิภาพของครอบครัวเป็นพิเศษ","o":["วัยเด็ก","วัยกลางคน","วัยรุ่น","วัยชรา"],"a":4,"e":"วัยชรา เป็นวัยที่ผ่านชีวิตมามาก มีประสบการณ์สูง ชอบหาสิ่งยึดเหนี่ยวจิตใจ มีความคิดแบบอนุรักษนิยม เชื่อใน สิ่งที่ปฏิบัติได้จริง มีความระแวดระวัง เนื่องจากผู้สูงอายุผ่านชีวิตมามาก โอกาสที่จะโน้มน้าวให้เปลี่ยนแปลงความคิด ความเชื่อจะน้อยลง เพราะมักจะ ยึดติดกับความเชื่อเดิม ดังนั้นการพูดกับคนในวัยนี้จึงควรพูดเรื่องความปลอดภัยในชีวิต และทรัพย์สิน, การรักษาพยาบาล, สวัสดิภาพทางครอบครัวและจิตใจ เป็นต้น"},{"n":77,"q":"ปัจจัยของผู้ฟังในข้อใดที่ควรระวังเป็นพิเศษ เพราะเป็นเรื่องละเอียดอ่อน","o":["อายุ","เพศ","การศึกษา","ความเชื่อ"],"a":4,"e":"การนับถือศาสนา ความเชื่อ และวัฒนธรรม เป็นสิ่งที่คนเรายึดถือมาตั้งแต่ในอดีต ดังนั้นผู้พูดจึงต้องใช้ความระมัด ระวังที่สุด อย่าพูดในทำนองดูหมิ่น เหยียดหยาม หรือไม่เห็นด้วยกับศาสนาและความเชื่อต่าง ๆ เพราะถือเป็นเรื่อง ละเอียด อ่อน ซึ่งอาจจะก่อให้เกิดความไม่พอใจ หรือความขัดแย้ง และทำให้การพูดไม่ประสบความสำเร็จ"},{"n":78,"q":"หากผู้ฟังมีจำนวนมาก ผู้พูดควรปฏิบัติอย่างไร","o":["พูดอย่างเป็นกันเอง","แต่งกายให้เหมาะสมตามกาลเทศะ","เรียบเรียงลำดับการพูดให้เป็นระเบียบ","ลดการพูดแบบเป็นพิธีการลง"],"a":3,"e":"ผู้พูดควรศึกษามาล่วงหน้าว่า กลุ่มผู้ฟังจะมีจำนวนมากน้อยเท่าใด ถ้ามีจำนวนมากควรเตรียมวิธีพูดให้ตรงตาม รูปแบบพิธีการ เตรียมคำขึ้นต้นให้ถูกต้องตามแบบแผนเพื่อให้เกียรติแก่ผู้ฟัง โดยโครงสร้างการพูดควรประกอบด้วย คำ นำ เนื้อหา และการสรุปที่ได้สัดส่วนพอเหมาะเรียงลำดับให้เป็นระเบียบ ไม่สับสน ควรเตรียมร่างที่จะพูดให้เรียบร้อย และพึงระลึกไว้ว่า ยิ่งมีผู้ฟังกลุ่มใหญ่เท่าใด โอกาสที่จะเข้าใจสับสนยิ่งเกิดขึ้นได้ง่ายเท่านั้น"},{"n":79,"q":"หากผู้พูดมีประสบการณ์น้อย ควรเลือกเรื่องโดยคำนึงถึงความเหมาะสมในข้อใดก่อนเป็นอันดับแรก","o":["กลุ่มผู้ฟัง","ตัวผู้พูด","สถานที่","เวลา"],"a":2,"e":"หลักการเลือกเรื่องพูดประการหนึ่ง คือ เลือกเรื่องให้เหมาะสมกับตัวผู้พูด เพราะนอกจากจะเลือกเรื่องให้เหมาะกับ กลุ่มผู้ฟังแล้ว ผู้พูดควรเลือกหัวข้อที่ตนสนใจและถนัดด้วยโดยเฉพาะสำหรับผู้ที่เริ่มพูดใหม่ ๆ ที่ยังมีประสบการณ์น้อย ทั้งนี้เพื่อให้ผู้พูดมีความเชื่อมั่นใน ตัวเอง และไม่เกิดความประหม่าในขณะที่พูด ซึ่งจะช่วยให้การพูดนั้นน่าเชื่อถือยิ่งขึ้น"},{"n":80,"q":"ข้อใดเป็นการกล่าวคำปฏิสันถารที่เป็นทางการ","o":["สวัสดีท่านผู้เกียรติที่เคารพทุกท่าน","เรียนท่านผู้อำนวยการ คณะอาจารย์ และผู้มีเกียรติทั้งหลาย","พี่น้องกรรมการที่เคารพรักทั้งหลาย","เพื่อนนักศึกษาที่รักทั้งหลาย"],"a":2,"e":"คำทักทายหรือคำปฏิสันถารแบ่งออกเป็น 2 ประเภท ดังนี้ 1. คำปฏิสันถารที่เป็นทางการ จะใช้กับงานพิธีการต่าง ๆ เช่น งานศาสนาพิธี งานวางศิลาฤกษ์งานแจกวุฒิบัตร คำ กล่าวเปิดงาน ฯลฯ จะเรียกเฉพาะตำแหน่ง เช่น \"เรียนท่านผู้อำนวยการคณาจารย์ และท่านผู้มีเกียรติทั้งหลาย\" เมื่อกล่าว คำปฏิสันถารจบแล้วจึงตามด้วยประโยค ที่ว่า \"ข้าพเจ้ารู้สึกเป็นเกียรติอย่างยิ่งที่ได้มาพูดในวันนี้\" 2. คำปฏิสันถารที่ไม่เป็นทางการ เช่น การประชุมภายในหน่วยงาน การอภิปราย คำปราศรัยคำกล่าวของนักการเมือง ฯลฯ จะมีคำแสดงความรู้สึก เช่น คำว่า \"เคารพ/นับถือ/ที่รัก\"อยู่ด้วย เช่น \"สวัสดีท่านผู้ฟังที่เคารพทุกท่าน\" \"สวัสดีพี่น้อง ชาวบ้านที่รักทั้งหลาย\" ฯลฯ เมื่อกล่าวคำปฏิสันถารจบแล้วจึงตามด้วยประโยคที่ว่า \"ผม/กระผม/ดิฉัน รู้สึกเป็นเกียรติ อย่างยิ่งที่ได้มาพูดในวันนี้\" ส่วนสรรพนามที่ใช้แทนผู้ฟังต้องเป็นคำยกย่องให้เกียรติ หรือแสดงความเป็นฝ่ายเดียวกับผู้ พูด เช่น ท่าน พี่น้อง พวกเรา คุณ เพื่อน ฯลฯ"},{"n":81,"q":"\"ท่านผู้ฟังทราบหรือไม่ว่า ในแต่ละปีมีคนไทยเสียชีวิตด้วยโรคหัวใจกี่คน\" เป็นการขึ้นต้นคำนำแบบ ใด","o":["ขึ้นต้นด้วยการทำให้ผู้ฟังสงสัย","ขึ้นต้นด้วยการตั้งคำถาม","ขึ้นต้นแบบพาดหัวข่าว","ขึ้นต้นด้วยสำนวน สุภาษิต หรือบทกวี"],"a":2,"e":"หลักการสร้างคำนำประการหนึ่ง ได้แก่ ขึ้นต้นด้วยการตั้งคำถาม เพราะการตั้งคำถามแปลก ๆ ชวนคิด ถือเป็นอีก แนว ทางหนึ่งที่ช่วยตึงดูดความสนใจให้ผู้ฟังเข้ามา มีส่วนร่วมในการพูด แต่คำถามนั้นต้องเกี่ยวข้องกับเนื้อหาสาระที่จะ ดำเนินต่อไปในเนื้อเรื่อง"},{"n":82,"q":"\"โบราณว่า ไม่เห็นโลงศพ ไม่หลั่งน ้าตา\" เป็นการขึ้นต้นคำนำแบบใด","o":["ขึ้นต้นด้วยการตั้งคำถาม","ขึ้นต้นแบบพาดหัวข่าว","ขึ้นต้นด้วยการทำให้ผู้ฟังสงสัย","ขึ้นต้นด้วยสำนวน สุภาษิต หรือบทกวี"],"a":4,"e":"หลักการสร้างคำนำประการหนึ่ง ได้แก่ ขึ้นต้นด้วยสำนวน สุภาษิต การอ้างบทกวีหรือวาทะของผู้มีชื่อเสียง ซึ่งต้อง เป็นที่รู้จักกันดีอยู่แล้ว เมื่อผู้ฟังได้ยินก็จะเกิดความสนใจใคร่รู้ว่า ข้อความที่ยกมานั้นมีความเกี่ยวข้องกับเนื้อหาที่จะพูด ต่อไปอย่างไร"},{"n":83,"q":"\"ผมรู้สึกเป็นเกียรติอย่างสูงที่ได้รับเชิญมาพูดท่ามกลางปัญญาชนอย่างท่านทั้งหลาย อันที่จริงผมก็ ไม่ใช่คนมีความรู้มากมายอะไรนัก...\" เป็นข้อบกพร่องในการใช้คำนำประเภทใด","o":["การออกตัว","การถ่อมตัว","การขออภัย","การพูดอ้อมค้อม"],"a":1,"e":"ข้อบกพร่องในการใช้คำนำประการหนึ่ง คือ อย่าออกตัว เช่น การออกตัวว่าเตรียมตัวมาพูดไม่พร้อมหรือเป็นผู้รู้ น้อย เพราะการออกตัวจะทำให้ผู้ฟังหมดความสนใจในตัวผู้พูด ทำให้ผู้ฟังรู้สึกว่า ตนไม่มีค่าควรแก่การเตรียมตัวของผู้ พูด หรือผู้พูดไม่เต็มใจมาพูด ซึ่งถือเป็นการไม่ให้เกียรติผู้เชิญอีกด้วย"},{"n":84,"q":"ข้อใดคือปริภาษา","o":["คำพูด","น ้าเสียง","ตัวอักษร","กิริยาท่าทาง"],"a":2,"e":"ปริภาษา (Paralanguage) หมายถึง เสียงที่เกิดขึ้นพร้อม ๆ กับการใช้ถ้อยคำในการสื่อสารด้วยการพูด โดยเสียงมี ความสำคัญในการสื่อความหมายให้ผู้ฟังรับรู้ถึงความรู้สึกและอารมณ์ของผู้พูดที่มีไปยังผู้ฟัง เช่น การเปล่งเสียงพูดด้วย เสียงสูงต ่า เสียงหนักเบา ฯลฯ"},{"n":85,"q":"ข้อใดจัดเป็นบุคลิกภาพภายนอก","o":["การแต่งกาย","ปฏิภาณไหวพริบ","ความคิดสร้างสรรค์","อารมณ์ขัน"],"a":1,"e":"บุคลิกภาพภายนอก ได้แก่ รูปร่างหน้าตา การแต่งกาย การปรากฏตัว กิริยาท่าทางการใช้น ้าเสียง การสบสายตา การใช้ถ้อยคำภาษา เป็นต้น ซึ่งเป็นสิ่งที่สังเกตได้ชัด หรือสามารถ สัมผัสได้ด้วยประสาทสัมผัสทั้ง 5 ส่งผลให้การแก้ไข ปรับปรุงก็จะทำได้ง่าย ใช้เวลาน้อยกว่าและ วัดผลได้ทันที"},{"n":86,"q":"ข้อใดเป็นการสื่อสารทางเดียว","o":["การสนทนา","การสัมภาษณ์","การปาฐกถา","การประชุม"],"a":3,"e":"ดูบรรยายเพิ่มเติมข้อ 12. ประกอบ"},{"n":87,"q":"การอภิปรายประเภทใดที่ผู้ร่วมอภิปรายทุกคนมีสิทธิเท่าเทียมกัน","o":["การอภิปรายโต๊ะกลม","การอภิปรายแบบสัมมนา","การอภิปรายแบบปุจฉาวิสัชนา","การอภิปรายเป็นคณะ"],"a":1,"e":"การอภิปรายโต๊ะกลม (Round Table Discussion) คือ ผู้ร่วมอภิปรายทุกคนจะมีสิทธิเท่าเทียมกัน และจะมีการจัด โต๊ะเป็นรูปวงกลม โดยผู้ร่วมอภิปรายนั่งเรียงกันตาม รูปโต๊ะ เพื่อให้มีโอกาสเห็นหน้ากันอย่างชัดเจนทุกคน ทั้งนี้ ผู้เข้าร่วมอภิปรายจะมีประมาณ 10 - 20 คน โดยทุกคนเป็นทั้งผู้พูดและผู้ฟัง มีสิทธิในการแสดงความคิดเห็นเท่าเทียมกัน บางที่ประธานในการอภิปรายอาจจะมีหรือไม่มีก็ได้"},{"n":88,"q":"ข้อใดเป็นหน้าที่ของเลขานุการในการประชุม","o":["จดบันทึกการประชุม","เก็บรวบรวมเงินของสมาชิก","ทำบัญชีงบดุลเกี่ยวกับรายรับรายจ่าย","ดำเนินการประชุมแทนประธาน หากประธานติดธุระ"],"a":1,"e":"เลขานุการ ทำหน้าที่จดบันทึกการประชุม ถือเป็นตำแหน่งที่มีความจำเป็น เพราะ ต้องควบคุมนโยบาย ควบคุม ระบบวิธีการต่าง ๆ ให้ดำเนินต่อไปจนการประชุมสำเร็จ"},{"n":89,"q":"ข้อใดคือ ลักษณะสำคัญของการพูดทางวิทยุโทรทัศน์ที่แตกต่างจากการพูดในที่ชุมชนประเภทอื่น","o":["ผู้พูดควรแต่งกายให้เหมาะสมกับสถานที่","ผู้พูดไม่สามารถสังเกตปฏิกิริยาของผู้ฟังได้","ผู้พูดต้องรักษาเวลาในการพูดอย่างเคร่งครัด","ผู้พูดต้องคอยระวังเรื่องระยะห่างจากไมโครโฟน"],"a":2,"e":"การพูดทางวิทยุโทรทัศน์ เป็นการพูดทางสื่อสารมวลชนที่แตกต่างจากการพูดระดับอื่น ๆ ในข้อที่สำคัญที่สุด คือ สามารถพูดให้คนฟังจำนวนมากที่กระจายกันอยู่ทุกทิศทางรับฟังพร้อมกันได้ในเวลาเดียวกัน แต่ผู้พูดไม่สามารถสังเกต ปฏิกิริยาตอบสนองจากผู้ฟังพร้อมกันได้ทันทีในขณะที่พูด"},{"n":90,"q":"การพูดในโอกาสที่ใดที่นิยมเชิญแขกคนสนิทของเจ้าภาพขึ้นไปพูด","o":["การกล่าวแนะนำ","การกล่าวสุนทรพจน์","การกล่าวต้อนรับ","การกล่าวอวยพร"],"a":4,"e":"บางครั้งในงานที่จัดขึ้นอย่างเป็นกันเอง ผู้พูดอาจถูกเชิญขึ้นไปกล่าวอวยพร เพราะ มีความสนิทสนมกับเจ้าภาพ โดยไม่จำเป็นว่าจะต้องเป็นบุคคลที่มีชื่อเสียงแต่ประการใด ทั้งนี้การกล่าวอวยพรอาจมีได้หลายโอกาส เช่น อวย พรคู่สมรส อวยพรวันเกิด อวยพรวันขึ้นปีใหม่เป็นต้น ซึ่งผู้พูดควรกล่าวสั้น ๆ โดยมีหลักเกณฑ์ต่างๆ ดังนี้ 1. ผู้พูดควรกล่าวแสดงความรู้สึกเป็นเกียรติที่ได้ขึ้นมากล่าวอวยพร 2. ผู้พูดควรพูดถึงความสัมพันธ์ของผู้พูดที่มีต่อเจ้าภาพ 3. ผู้พูดควรคำถึงเวลาและเนื้อหาให้เหมาะสมตามโอกาส"},{"n":91,"q":"ข้อใดไม่เป็นผลมาจากการประชาสัมพันธ์","o":["เกิดความเข้าใจองค์กรในทางที่ถูกต้อง","เกิดความเชื่อถือ ศรัทธาต่อองค์กร","เกิดความสัมพันธ์อันดีระหว่างองค์กรกับสาธารณชน","เกิดความเข้าใจในกลยุทธ์การดำเนินการขององค์กร"],"a":4,"e":"การประชาสัมพันธ์ หมายถึง การสร้างความสัมพันธ์โดยใช้กลยุทธ์ทางการสื่อสารเพื่อส่งเสริมให้เกิดความเข้าใจ องค์กรในทางที่ถูกต้องร่วมกัน ตลอดจนสร้างสรรค์ความสัมพันธ์อันดีต่อกันระหว่างหน่วยงานขององค์กร หรือ สาธารณชนต่าง ๆ อันจะนำมาซึ่งความเชื่อถือศรัทธา และความไว้วางใจต่อองค์กร ตลอดจนความร่วมมือสนับสนุ่นจาก สาธารณชน"},{"n":92,"q":"ผู้ใดทำหน้าที่ของนักประชาสัมพันธ์ได้เหมาะที่สุด","o":["ศุภรัตน์เตรียมเขียนข่าวแจกให้สื่อมวลชนเพื่อใช้ตีพิมพ์เผยแพร่","ศุภชัยส่งข่าวสารทุกเรื่องที่เกิดขึ้นภายในบริษัทให้สื่อมวลชนเผยแพร่","ศุภศิลป์ส่งรูปภาพขั้นตอนการผลิตผลิตภัณฑ์เผยแพร่ในสื่อสังคมออนไลน์","ศุภฤกษ์บันทึกรายงานการ1ระชุมของผู้บริหาร แล้วทำสำเนาเผยแพรให้สื่อมวลชน"],"a":1,"e":"ข่าวแจก (Press Release) เป็นข้อมูล ข่าวสาร ข้อเท็จจริงเกี่ยวกับกิจกรรมหรือเหตุการณ์ต่าง ๆ ขององค์กรที่เกิดขึ้น โดยนักประชาสัมพันธ์มีหน้าที่เขียนข่าวแจกไปให้สื่อมวลชนเพื่อใช้ตีพิมพ์เผยแพร่ ถ่ายทอดข้อมูลข่าวสาร หรือ ข้อเท็จจริงไปยังบุคคลภายนอก ทั้งผู้ใช้บริการและประชาชนทั่วไป ซึ่งมีความมุ่งหมายให้องค์กรเป็นที่รู้จัก เข้าใจ และ ยอมรับในการดำเนินกิจกรรมต่าง ๆ"},{"n":93,"q":"การประชาสัมพันธ์ขั้นตอนใดเกิดขึ้นเป็นลำดับแรก","o":["การกำหนดนโยบาย","การวางแผ่นกิจกรรม","การวิเคราะห์และวิจัย","การสื่อสาร"],"a":3,"e":"หมายเหตุ: ไฟล์ต้นฉบับพิมพ์เลขเฉลยเป็น 1 แต่ข้อความเฉลยและคำอธิบายคือ “การวิเคราะห์และวิจัย” (ข้อ 3) จึงใช้ข้อ 3. กระบวนการประชาสัมพันธ์แบ่งตามลำดับขั้นตอนต่าง ๆ ดังนี้ 1. การวิเคราะห์และวิจัย ถือเป็นขั้นตอนแรกในการสำรวจค้นหาปัญหาด้านต่าง ๆ ขององค์กร ที่ต้องเผชิญ หรือระยุ ได้ถึงปัญหาด้านการประชาสัมพันธ์ 2. การวางแผนกิจกรรม 3. การกำหนดนโยบาย 4. การสื่อสาร 5. ผลสะท้อนกลับ"},{"n":94,"q":"หากนักศึกษาต้องการจะเชิญชวนเพื่อนให้มาร่วมกิจกรรม ข้อความใดมีความเหมาะสมมากที่สุด","o":["กระทงหลงทาง ส่วนฉันนั้นหลงเธอ","เร่เข้ามา ชาวราม เชิญมาร่วมงานวันลอยกระทงด้วยกัน","ลอย ลอยกระทง ลอยกระท่งกันแล้ว ขอเชิญเพื่อนแก้วออกมารำวง","ลอยกระทงปีนี้ สระน ้าที่ราม 2 จะคลาคล ่าไปด้วยผู้คน คุณพร้อมหรือยัง"],"a":4,"e":"การประชาสัมพันธ์นอกจากจะต้องตั้งวัตถุประสงค์ที่ชัดเจนว่า เขียนเพื่ออะไรแล้ว ยังต้องคำนึงถึงด้วยว่า ในการ เขียนครั้งนั้นเขียนให้ใครอ่าน เพื่อเป็นการกำหนดกลุ่มเป้าหมาย ที่ชัดเจน เลือกใช้ภาษาและเนื้อหาที่เหมาะสม เพื่อ สื่อสารให้กลุ่มเป้าหมายเข้าใจได้อย่างชัดเจนและตรงกับความสนใจ"},{"n":95,"q":"นักประชาสัมพันธ์ได้เขียนบทความวิจัยจากการวิจัยเรื่อง \"การสำรวจความคิดเห็นของประชาชนต่อ การปฏิบัติงานของเจ้าหน้าที่ เพื่อประเมินผลการทำงานและพิจารณาปัญหาการทำงานในสายตาของ ประชาชน\"เป็นการเขียนโดยมีวัตถุประสงค์ใด","o":["การเขียนเพื่อสร้างความสัมพันธ์","การเขียนเพื่อบอกกล่าวให้ทราบให้เข้าใจ","การเขียนเพื่อป้องกันมิให้เกิดความเข้าใจผิด","การเขียนเพื่อสนับสนุนกิจกรรมทางการตลาด"],"a":2,"e":"วัตถุประสงค์ของการเขียนเพื่อการประชาสัมพันธ์ประการหนึ่ง คือ การเขียนเพื่อบอกกล่าวให้ทราบให้เข้าใจ เพื่อ ส่งข่าวสารข้อเท็จจริงไปยังกลุ่มเป้าหมาย และเพื่อนำเสนอ ข่าวสารขององค์กร โดยแสดงให้เห็นรายละเอียด ขั้นตอน การปฏิบัติงาน เพื่อให้ประชาชนได้รับทราบและเข้าใจ"},{"n":96,"q":"บทสัมภาษณ์ของ CEO บริษัท ในการปฏิบัติงานของโรงงานที่เพิ่งเปิดกิจการใหม่ จัดเป็นการเขียน โดยมีวัตถุประสงค์ใด","o":["การเขียนเพื่อสร้างความสัมพันธ์","การเขียนเพื่อบอกกล่าวให้ทราบให้เข้าใจ","การเขียนเพื่อป้องกันมิให้เกิดความเข้าใจผิด","การเขียนเพื่อสนับสนุนกิจกรรมทางการตลาด"],"a":3,"e":"วัตถุประสงค์ของการเขียนเพื่อการประชาสัมพันธ์ประการหนึ่ง คือ การเขียนเพื่อป้องกันมิให้เกิดความเข้าใจผิด เป็นการเขียนเพื่ออธิบาย แถลง หรือชี้แจงอย่าง ชัดเจน เพื่อให้บุคคลทั่วไปเข้าใจรายละเอียด ลดความคลางแคลงใจลง ในขณะ เดียวกันก็ควรเพิ่มความน่าเชื่อถือให้เกิดขึ้นกับองค์กร เช่น การเขียนข่าว บทสัมภาษณ์ บทความประเภทแนะนำ บทความประเภทอธิบาย ซึ่งการเขียนเหล่านี้ควรมีการอ
