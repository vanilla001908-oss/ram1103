มข้อ 1. ประกอบ"},{"n":3,"q":"ส้มแป้นทำของตกใส่เท้าอาจารย์โรจน์ อาจารย์โรจน์มีสีหน้าเจ็บปวดแต่บอกว่า \"ไม่เจ็บ\" การแสดง อาการ ดังกล่าวมีความขัดแย้งในการสื่อสารหรือไม่","o":["ขัดแย้ง เพราะเป็นการแสดงอวัจนภาษาและวัจนภาษาไม่สัมพันธ์กัน","ไม่ขัดแย้ง เพราะสีหน้าและความรู้สึกกลับแสดงตรงกันข้ามกัน","ขัดแย้ง เพราะเป็นการสื่อสารที่ไม่สามารถบ่งบอกความหมายได้","ไม่ขัดแย้ง เพราะมีทั้งความหมายตรงและความแฝงในการแสดงอยู่แล้ว"],"a":1,"e":"การแสดงวัจนภาษาและอวัจนภาษานั้น ส่วนใหญ่แล้วมักจะมีความคล้อยตามกันแต่บางครั้งก็อาจขัดแย้งกัน ไม่ สัมพันธ์กัน หรือไม่ได้มีความคล้อยตามกันได้ ทั้งนี้มีบริบทของการเกิดขึ้นระหว่างอวัจนภาษาและวัจนภาษาเป็น เงื่อนไขของความหมายที่ขัดแย้งกันด้วย เช่น ส้มแป้นทำของตกใส่เท้าอาจารย์โรจน์ อาจารย์โรจน์มีสีหน้าเจ็บปวด (อวัจ นภาษา) แต่บอกว่า\"ไม่เจ็บ\" (วัจนภาษา) เป็นต้น"},{"n":4,"q":"ข้อใดใช้ภาษาได้เหมาะสมกับระดับบุคคล","o":["\"เก็บของที่ตกพื้นให้หน่อย แม่ นุ้ยกำลังคุยโทรศัพท์\"","\"อาจารย์น่ารักจังค่ะ หนูรู้สึกชิล ๆ กับอาจารย์ขึ้นมาเลย\"","\"คุณลูกค้า ถ้าต้องการจะเปลี่ยนสินค้าก็สามารถเปลี่ยนที่แผนกได้เลย\"","\"อาหารพวกนี้ หลวงพี่กินได้ไหม จะได้ซื้อไปใส่บาตร\""],"a":3,"e":"คณาจารย์ในสาขาวิชาภาษาไทย คณะมนุษยศาสตร์และสังคมศาสตร์ มหาวิทยาลัยขอนแก่น ได้กล่าวถึง ความหมายของระดับภาษาว่า \"ระดับภาษาเป็นเรื่องของความเหมาะสมในการใช้ภาษาตามความสัมพันธ์ระหว่างบุคคลที่ เป็นผู้ส่งสารและผู้รับสาร ตามโอกาสและตามกาลเทศะ เพื่อให้สัมฤทธิ์ผลสมความมุ่งหมาย\""},{"n":5,"q":"การแสดงออกของอวัจนภาษา เรียกอีกอย่างหนึ่งว่าอะไร","o":["ภาษาพูด","ภาษามือ","ภาษาทางการ","ภาษากาย"],"a":4,"e":"ในบางตำรากล่าวว่า การแสดงออกของอวัจนภาษา (Non Verbal Language) นั้นเรียกอีกอย่างหนึ่งว่า \"ภาษากาย\" (Body Language) ทั้งนี้ภาษากายถือว่าเป็นเพียงบางส่วนของอวัจนภาษา แต่เมได้หมายรวมว่าภาษากายจะเป็นอวัจน ภาษาทั้งหมด"},{"n":6,"q":"สีสันของวันตรุษจีนส่วนใหญ่เน้นสีแดง เพราะเป็นสีมงคล","o":["กายภาษา","กาลภาษา","วัตถุภาษา","ปริภาษา"],"a":3,"e":"วัตถุภาษา หมายถึง อวัจนภาษาที่สื่อความหมายถึงข้าวของ และสิ่งของเครื่องใช้ในชีวิตประจำวัน โดยวัตถุภาษา สามารถสื่อถึงรสนิยม ความเป็นตัวตนส่วนบุคคล ตลอดจนอาชีพและสถานภาพ ได้แก่ เครื่องแต่งกายตามอาชีพ (ข้าราชการ/ทหาร/ตำรวจ) กระเป๋าปากกา เสื้อผ้า รองเท้า เครื่องสำอาง ฯลฯ นอกจากนี้วัตถุภาษายังรวมไปถึง องค์ประกอบที่ให้ความรู้สึกในเชิงรูป รส กลิ่น สี เช่น สีดำให้ความรู้สึกน่ากลัว โศกเศร้า, สีแดงให้ความรู้สึก คึกคัก มี พลัง, สีเขียวให้ความรู้สึกสดชื่น สบายตา เป็นต้น หรือวัตถุภาษาที่สื่อผ่านทางกลิ่นเช่น กลิ่นน ้าอบน ้าปรุง ทำให้นึกถึงสิ่ง ลี้ลับ วิญญาณ, กลิ่นธูป ทำให้นึกถึงพิธีกรรม เป็นต้น"},{"n":7,"q":"แดงเบิกตาโพลงทันทีที่เห็นสิ่งหนึ่งแกว่งไกวอยู่ในเงามืด","o":["กายภาษา","กาลภาษา","วัตถุภาษา","ปริภาษา"],"a":1,"e":"กายภาษา หมายถึง การแสดงออกของอวัจนภาษาที่สื่อสารผ่านทางภาษากาย โดยจะแสดงออกผ่านทางสายตา ศีรษะ มือ ปาก รวมไปถึงอวัยวะอื่น ๆ ในร่างกาย เช่น การเบิกตาเพราะตกใจกลัวหรือประหลาดใจ, การพยักหน้าแสดง ความเห็นด้วย, การยิ้มแสดงความพอใจ,การโบกมืออำลาหรือทักทาย เป็นต้น"},{"n":8,"q":"คนในแวดวงสังคมแต่งตัวหรูหรา เพื่อมาร่วมงานกาลาดินเนอร์","o":["กายภาษา","กาลภาษา","วัตถุภาษา","ปริภาษา"],"a":3,"e":"ดูบรรยายเพิ่มเติมข้อ 6. ประกอบ"},{"n":9,"q":"วันที่ 9 เดือน 9 เวลา 19.09 น. จัดนาทีทองลดราคาสินค้า","o":["กายภาษา","กาลภาษา","วัตถุภาษา","ปริภาษา"],"a":2,"e":"กาลภาษา หมายถึง การแสดงออกทางภาษาที่สื่อความหมายถึงเรื่องของเวลา เช่นการยืนตรงเคารพธงชาติ เวลา 8.00 น. และเวลา 18.00 น. บางตำราก็กล่าวว่ารวมถึงเวลา สื่อสารที่ผู้ส่งสารมีการสร้างความหมายพิเศษแก่ผู้รับสาร ดัง ตัวอย่างที่เห็นได้จากสื่อสังคมออนไลน์ในปัจจุบัน เช่น การจัดช่วงเวลาส่งเสริมการขายในวันที่ 9 เดือน 9 เวลา 19.09 น. จัดนาทีทองลดราคาสินค้า เป็นต้น"},{"n":10,"q":"สมใจกำลังนินทาถึงสมสมัย จึงต้องลดเสียงเบาลง","o":["กายภาษา","กาลภาษา","วัตถุภาษา","ปริภาษา"],"a":4,"e":"ปริภาษา หมายถึง อวัจนภาษาที่มีน ้าเสียงมาประกอบการสื่อความหมาย ทำให้สัมผัสได้ถึงอารมณ์ความรู้สึกที่ อาจจะเจือเข้ามาในน ้าเสียง เช่น การตะโกนเสียงดัง แสดงถึงการใช้เสียงให้ผู้รับสารได้ยินชัดเจน และอาจสื่ออารมณ์ ความรู้สึกที่เป็นกลาง หรือสื่ออารมณ์โกรธฉุนเฉียว, การใช้เสียงตวาด แสดงถึงการใช้น ้าเสียงในลักษณะแสดงออกถึง ความไม่พอใจ,การพูดด้วยน ้าเสียงเบา อาจจะหมายถึง การกล่าวถึงบุคคลที่สาม ฯลฯ ซึ่งการแสดงออกของปริภาษานี้ ส่วนใหญ่มักจะแสดงคู่กัน หรือตรงกันข้ามกันกับภาษาพูดก็ได้"},{"n":11,"q":"ภาษากึ่งแบบแผน นิยมใช้ในการพูดการเขียนแบบใด","o":["การประชุม","การปาฐกถา","การเขียนเอกสารราชการ","การพูดสุนทรพจน์"],"a":1,"e":"ภาษากึ่งแบบแผนหรือเรียกว่า ภาษากึ่งทางการ เหมาะสำหรับการใช้ภาษาในกรณีการสนทนาระหว่างผู้ที่ไม่ คุ้นเคยกัน หรือสุภาพบุรุษสนทนากับสุภาพสตรี การพูดในที่ประชุมการใช้ภาษาในการสัมมนา การใช้ภาษาใน สื่อมวลชนประเภทต่าง ๆ โดยเฉพาะในการรายงาน ข่าวที่ไม่ใช่บทความ สารคดี ฯลฯ"},{"n":12,"q":"ข้อใดมีความหมายตรง","o":["ใจเพชร","เสือผู้หญิง","เหล็กกล้า","หัวใจศิลา"],"a":3,"e":"คำที่มีความหมายตรง หมายถึง คำที่มีการแสดงความหมายตรงตามรูปคำไม่ได้มีความหมายอื่นแฝงอยู่ในคำ ดังที่สุนันท์ อัญชลีนูกูล ได้อธิบายความหมายของคำที่มีความหมายตรงเพิ่มเติมอีกว่า คือ คำที่มีความหมายหลักของคำที่ ใช้สื่อสารในชีวิตประจำวันนอกจากนี้เขายังกล่าวว่า คำที่มีความหมายตรง เรียกอีกอย่างหนึ่งได้ว่า \"คำที่มีความหมาย ประจำคำ หรือคำที่มีความหมายนัยตรง (Denotative Meaning or Lexical Meaning)\"เช่น เสือ หมู กล้วย กุหลาบ นกพิราบ เหล็กกล้า ฯลฯ"},{"n":13,"q":"ข้อใดเขียนผิดเพราะออกเสียงผิด","o":["เขาเชื่อเรื่องเครื่องราง","หน้าดูอ่อนเยาเพราะใช้ครีม","อายุเยาวเรศรุ่น","ลางสังหรณ์ทำให้เชื่อหมดใจ"],"a":2,"e":"ตัวอย่างคำที่ออกเสียงผิด เขียนผิด แล้วความหมายเปลี่ยน เช่น คำว่า \"อ่อนเยาว์\"เขียนผิดเป็น อ่อนเย้า (คำว่า \"เยาว์\" = อ่อนวัย รุ่นหนุ่ม รุ่นสาว ส่วน \"เยา\" = เขา อ่อน น้อยเช่น ราคาย่อมเยา)"},{"n":14,"q":"\"เด็กหนุ่มสาววัยรุ่นนั้นเป็นกำลังสำคัญของชาติ\" ประโยคนี้มีข้อบกพร่องคืออะไร","o":["ใช้คำกำกวม","ใช้คำความหมายแฝง","ใช้คำออกเสียงผิด","ใช้คำฟุ่มเฟือย"],"a":4,"e":"คำฟุ่มเฟือย คือ คำที่มีความหมายเดียวกันมาวางไว้ในประโยคเดียวกัน จึงทำให้คำในประโยคเพิ่มขึ้นอย่างไม่ จำเป็น ซึ่งการใช้คำพุ่มเฟือยในการสื่อสารนอกจากจะทำให้ประโยครกรุงรังด้วยคำที่มีความหมายเดียวกันแล้ว ยังทำให้ ความชัดเจนของถ้อยคำลดน ้าหนักลงอีกด้วยเพราะผู้รับสารอาจจะไม่เข้าใจว่าผู้ส่งสารต้องการให้น ้าหนักกับคำหลักที่ สำคัญในประโยค คือคำใด ตัวอย่างการใช้คำฟุ่มเฟือย เช่น เด็กหนุ่มสาววัยรุ่นนั้นเป็นกำลังสำคัญของชาติ ฯลฯ"},{"n":15,"q":"คำตอบข้อใดไม่มีประโยคต่างประเทศ","o":["เขาตัดสินใจที่จะเดินทางไปต่างประเทศอย่างทันที","ม.รามคำแหงจะมีรถไฟฟ้าให้ดินใช้ในอนาคตอันใกล้นี้","การบริหารหน่วยงานต้องขึ้นอยู่กับนโยบายที่มารองรับ","เธอได้รับการต้อนรับอย่างดียิ่งจากคณะผู้จัดสัมมนา"],"a":1,"e":"การใช้สำนวนต่างประเทศ คือ การรับคำมาจากภาษาต่างประเทศ ซึ่งได้รับ อิทธิพลมาจากการสื่อสารที่โยงใยไป ทั่วโลก ทำให้ภาษาจากต่างประเทศเข้ามาสู่ภาษาไทยได้มากกว่าในสมัยอดีต ดังที่จะเห็นได้จากการใช้คำไทยและอังกฤษ ปะปนกัน นอกจากนี้อิทธิพลทางภาษาต่างประเทศอย่างหนึ่งที่เข้ามากระทบต่อการใช้ประโยคในภาษาไทยก็คือ ลักษณะ ของประโยคที่มีสำนวนต่างประเทศ โดยมีคำสำคัญที่พบเห็นเป็นประจำ ได้แก่ คำว่า \"ได้รับ/นำมาซึ่ง/ทำการ/อยู่ภายใต้/ ขึ้นอยู่กับ/ในอนาคตอันใกล้/ในไม่ช้านี้\""},{"n":16,"q":"ถ้านักศึกษาจะพูดให้กำลังใจเพื่อน ฐานน ้าหนักควรอยู่ส่วนใดจะดีที่สุด","o":["ตอนต้น","ตอนกลาง","ตอนปลาย","ตอนใดก็ได้ไม่สำคัญ"],"a":3,"e":"การให้น ้าหนักประโยคหรือที่เรียกว่า ฐานน ้าหนักประโยค เป็นเงื่อนไขสำคัญ ที่จะทำให้การสื่อสารดำเนินไป อย่างราบรื่น เพราะทำให้ผู้รับสารสามารถแปรความหมายทางอารมณ์ของผู้รับสารผ่านการเน้นเสียงได้ ซึ่งปกติถ้าเป็น ภาษาพูดนั้นย่อมไม่มีปัญหา เพราะเราสามารถใช้เสียงแสดงฐานน ้าหนักของประโยคได้ว่า จะให้ความสำคัญหรือให้ น ้าหนักของเสียงอยู่ที่คำใด แต่ถ้าเป็นภาษาเขียนไม่สามารถแสดงอารมณ์ผ่านน ้าเสียงในการพูดได้ โดยประสิทธิ์ภาพย์ กลอนและคณะ ได้กล่าวถึงฐานน ้าหนักประโยคว่า สามารถแบ่งได้เป็น 3 ตอน ได้แก่ 1. ตอนต้นประโยค จะมีน ้าหนักประโยครองลงมาจากตอนท้าย 2. ตอนกลางประโยค จะมีน ้าหนักประโยคน้อยที่สุด 3. ตอนท้ายประโยค จะมีน ้าหนักประโยคมากที่สุดและมีความสำคัญที่สุด"},{"n":17,"q":"หลักในการเขียนย่อหน้าที่ดี ควรทำอย่างไร","o":["เขียนโดยใช้ภาษาอย่างประณีต เพื่อแสดงถึงความรอบรู้ในภาษา","เขียนอธิบายด้วยข้อความที่ยาว ๆ เพื่อให้คนอ่านซึมซับกับรายละเอียด","เขียนย่อหน้าด้วยการใช้ภาษาอย่างเป็นกันเอง เพื่อให้เข้าใจง่าย","เขียนโดยสื่อความคิดสำคัญเพียงหนึ่งเดียว เพื่อความชัดเจน"],"a":4,"e":"หลักในการเขียนย่อหน้าที่ดี ได้แก่ การเขียนย่อหน้าจะมีความสั้นยาวอย่างไรก็ตาม สิ่งสำคัญที่สุด คือ ในแต่ละย่อ หน้าจะต้องมีความคิดสำคัญหรือประโยคใจความสำคัญอยู่เพียงแค่หนึ่งประโยค เพื่อความชัดเจน และเพื่อให้ผู้รับสาร เข้าใจได้อย่างทันทีว่าย่อหน้านั้นต้องการ สื่อสารความคิดสำคัญอะไรมายังผู้รับสาร ดังนั้นย่อหน้าที่มีความคิดสำคัญหรือ ประโยคใจความสำคัญจะทำให้ผู้รับสารสามารถเข้าใจได้อย่างทันที"},{"n":18,"q":"ย่อหน้าที่มีประโยคใจความสำคัญอยู่ตอนท้าย เรียกว่าอะไร","o":["สามเหลี่ยมมียอดบรรจบกัน","สามเหลี่ยมมีฐานบรรจบกัน","สามเหลี่ยมหน้าจั่ว","สามเหลี่ยมหน้าจั่วหัวกลับ"],"a":4,"e":"ย่อหน้าที่มีประโยคใจความสำคัญหรือความคิดสำคัญอยู่ตอนท้าย คือ ย่อหน้า ที่เริ่มต้นจากประโยคขยายความ บอกเล่าไปเรื่อย ๆ จนถึงตอนท้าย และก่อนจะจบย่อหน้า มีประโยคกล่าวถึงความคิดสำคัญหรือประโยคสรุปความคิด สำคัญของย่อหน้า ซึ่งบางครั้งเราเรียกประโยคใจความสำคัญตอนท้ายนี้ว่า \"ประโยคสรุปความ\" ส่วนรูปแบบของย่อหน้า จะเรียกว่า \"ย่อหน้าแบบสามเหลี่ยมหน้าจั่วหัวกลับ\""},{"n":19,"q":"ย่อหน้าที่มีประโยคใจความสำคัญอยู่ตอนกลาง เรียกว่าอะไร","o":["สามเหลี่ยมมียอดบรรจบกัน","สามเหลี่ยมมีฐานบรรจบกัน","สามเหลี่ยมหน้าจั่ว","สามเหลี่ยมหน้าจั่วหัวกลับ"],"a":1,"e":"ย่อหน้าที่มีประโยคใจความสำคัญหรือความคิดสำคัญอยู่ตอนกลาง คือ ย่อหน้า ที่มีประโยคใจความสำคัญหรือ ความคิดสำคัญอยู่ตรงกลางย่อหน้า หรือเรียกว่า \"ตอนกลาง\"โดยย่อหน้านี้จะนำด้วยประโยคขยายความหรือประโยค สนับสนุนไล่มาเรื่อย ๆ จนกระทั่ง ถึงตรงกลางย่อหน้าก็จะเป็นประโยคใจความสำคัญหรือความคิดสำคัญ และถัดจาก ประโยคใจความสำคัญก็จะเป็นประโยคขยายความหรือประโยคสนับสนุนจนจบย่อหน้า ซึ่งเราเรียกย่อหน้าแบบนี้ว่า \"สามเหลี่ยมมียอดบรรจบกัน\""},{"n":20,"q":"ย่อหน้าที่มีประโยคใจความสำคัญอยู่ตอนต้น เรียกว่าอะไร","o":["สามเหลี่ยมมียอดบรรจบกัน","สามเหลี่ยมมีฐานบรรจบกัน","สามเหลี่ยมหน้าจั่ว","สามเหลี่ยมหน้าจั่วหัวกลับ"],"a":3,"e":"ย่อหน้าที่มีประโยคใจความสำคัญหรือความคิดสำคัญอยู่ตอนต้น คือ ย่อหน้าที่มีประโยคใจความสำคัญหรือ ความคิดสำคัญอยู่ตอนต้น ถัดจากประโยคใจความสำคัญหรือความคิดสำคัญก็จะเป็นประโยคขยายความหรือประโยค สนับสนุน ซึ่งเรียกอีกอย่างหนึ่งว่า \"ย่อหน้าแบบสามเหลี่ยมหน้าจั่ว\""},{"n":21,"q":"หลักในการเขียนย่อหน้า คำตอบ ข้อใดหมายถึง การเรียงลำดับความคิดที่มาก่อนมาหลัง","o":["วิสัยภาพ","สัมพันธภาพ","สารัตถภาพ","เอกภาพ"],"a":2,"e":"ลักษณะของการเขียนย่อหน้าที่ดีประการหนึ่ง ได้แก่ สัมพันธภาพ หมายถึงความเกี่ยวเนื่องสอดคล้องหรือ ต่อเนื่องกัน แข่งออกเป็น 2 แบบ ดังนี้ 1. สัมพันธ์ภาพในย่อหน้าเดียวกัน คือ มีการจัดระเบียบความคิด โดยเรียงลำดับว่าความคิดใดมาก่อนและหลัง 2. สัมพันธภาพระหว่างย่อหน้า คือ การเขียนย่อหน้าหลายย่อหน้า เมื่อต้องเขียนอีกย่อหน้าหนึ่งเพื่อเชื่อมโยงย่อหน้าที่ มีมาก่อนหน้า จะต้องมีแนวความคิดของสัมพันธภาพเข้ามาประสานการเขียนให้เกิดความราบรื่นต่อกัน"},{"n":22,"q":"หลักในการเขียนย่อหน้า คำตอบข้อใดหมายถึง การเขียนอย่างเป็นเหตุเป็นผล","o":["วิสัยภาพ","สัมพันธภาพ","สารัตถภาพ","เอกภาพ"],"a":4,"e":"ลักษณะของการเขียนย่อหน้าที่ดีประการหนึ่ง ได้แก่ เอกภาพ หมายถึง การเขียน ย่อหน้าจะเป็นในย่อหน้าเดียวกัน ก็ดี หรือหลายย่อหน้าก็ดี ต้องมุ่งไปที่ประเด็นความคิดหลัก ซึ่งการเขียนประโยคภายในย่อหน้าต้องสอดคล้องกัน เป็น เหตุเป็นผล สนับสนุนความคิดหลักและรวมไปถึงหัวข้อเรื่อง ชื่อเรื่อง"},{"n":23,"q":"ข้อใดอธิบายความหมายของการเขียนตอบข้อสอบอัตนัยที่ชัดเจนที่สุด","o":["การเขียนตอบข้อสอบอัตนัยแสดงถึงความรอบรู้ของผู้ตอบ","การเขียนตอบข้อสอบอัตนัยมีการเขียนส่วนนำ เนื้อเรื่อง สรุป","การเขียนตอบข้อสอบอัตนัยจะต้องใช้ภาษาที่สื่อสารเข้าใจง่าย","การเขียนตอบข้อสอบอัตนัยให้ดีต้องเป็นผู้ที่มีความคิดเป็นระบบระเบียบ"],"a":2,"e":"ข้อสอบอัตนัย เป็นข้อสอบที่วัดความรู้ความสามารถของผู้เรียนในเชิงการเขียนแบบบรรยาย ลักษณะของข้อสอบ อัตนัยจะเน้นให้ผู้เรียนตอบแบบเรียงความ โดยองค์ประกอบของการตอบข้อสอบอัตนัยจะประกอบด้วยส่วนนำ ส่วน เนื้อเรื่อง (ถือเป็นส่วนที่มีความสำคัญที่สุด)และส่วนสรุป โดยมีการลำดับความคิดของคำตอบที่จะเขียน"},{"n":24,"q":"ส่วนใดของคำตอบข้อเขียนอัตนัยที่มีความสำคัญที่สุด","o":["ส่วนนำ","ส่วนเนื้อเรื่อง","ส่วนเสริมความคิด","ส่วนสรุป"],"a":2,"e":"ดูบรรยายเพิ่มเติมข้อ 23. ประกอบ"},{"n":25,"q":"ข้อใดถือว่ามีความสำคัญที่สุดในการเขียนสรุปของข้อสอบอัตนัย","o":["คำตอบที่ชัดเจน","อภิปรายผล","ความคิดเห็น","ข้อแนะนำ"],"a":3,"e":"ส่วนสรุปของข้อสอบอัตนัย คือ ส่วนปิดท้ายหรือปิดเรื่องของคำตอบ มักจะเป็นการกล่าวสรุปเนื้อหาหรือประเด็น ที่ผู้ตอบกล่าวในลักษณะภาพรวม บางครั้งการสรุปก็มีการแสดงความคิดเห็นของผู้ตอบแทรกในระหว่างการสรุป ภาพรวมของคำตอบก็ได้ เพื่อแสดงน ้าหนักที่หนักแน่นของคำตอบ"},{"n":26,"q":"การเขียนข้อความขนาดสั้นในกระดาษนั้น นักศึกษาคิดว่ายังมีความจำเป็นอยู่หรือไม่","o":["จำเป็น เพราะเป็นการฝึกใช้ภาษาในการเขียน","ไม่จำเป็น เพราะมีโทรศัพท์เคลื่อนที่ สามารถกดปุ่มโทรหาผู้ที่ต้องการสนทนา","จำเป็น เพราะเป็นการเขียนข้อความเพื่อติดต่อกิจธุระอื่น ๆ ได้","ไม่จำเป็น เพราะปัจจุบันใช้การสื่อสารไปรษณีย์อิเล็กทรอนิกส์"],"a":3,"e":"การเขียนข้อความขนาดสั้น หรือเรียกว่า \"โน้ตย่อ\" เป็นการเขียนข้อความเพื่อสื่อสารไปยังผู้รับสาร โดยมี จุดมุ่งหมายเพื่อแจ้งความประสงค์ที่ผู้ส่งสารต้องการพบกับ ผู้รับสารด้วยจุดประสงค์อะไร เช่น ปรึกษา รับคำชี้แนะ หรือ ติดต่อกิจธุระอื่น ๆ ซึ่งถึงแม้ว่าในปัจจุบันจะมีการสื่อสารออนไลน์เกิดขึ้น แต่ถ้าอุปกรณ์ชำรุดเสียหาย หรือมีสภาพไม่ พร้อมใช้งาน เช่น ไฟดับ พลังงานสำรองหมด การสื่อสารออนไลน์ก็จะไม่สัมฤทธิ์ผล ดังนั้นการเขียน ข้อความขนาดสั้น ในกระดาษนั้นจึงยังคงมีความจำเป็นอยู่ในปัจจุบัน"},{"n":27,"q":"จุดมุ่งหมายของการเขียนจดหมายเพื่อติดต่อร้านค้า คืออะไร","o":[". เพื่อสื่อสารกับทางร้านค้าให้ได้ของที่ต้องการ","เพื่อฝึกการติดต่อและใช้ภาษาให้ถูกต้องตามที่เรียนมา","เพื่อสร้างมิตรภาพกับเจ้าของร้านไว้ใช้บริการต่อไป","เพื่อเรียนรู้การเขียนจดหมายหลากหลายแนว"],"a":1,"e":"จุดมุ่งหมายของการเขียนจดหมายเพื่อติดต่อร้านค้า คือ เพื่อสื่อสารกับทางร้านค้าให้ได้ของที่ต้องการ โดยผู้เขียน จดหมายต้องแสดงความประสงค์ว่า ต้องการติดต่อกับร้านค้าเพื่อต้องการสินค้า หรืออยากทราบรายละเอียดของสินค้า ชนิดใด เช่น ลักษณะสินค้า จำนวน สินค้า ชนิดและประเภท บางครั้งผู้สั่งซื้อสินค้าอาจได้เห็นสินค้าผ่านทางเว็บไซต์ของ ร้านค้าแต่ต้องการสอบถามข้อมูลเพิ่มเติมก็มี"},{"n":28,"q":"การเขียนจดหมายสมัครงาน ควรใช้กระดาษแบบใด","o":["กระดาษสีขาว ไม่มีเส้น มีกลิ่นหอม","กระดาษสีขาว มีเส้น มีลวดลาย","กระดาษสีขาว ไม่มีเส้น มีตราสัญลักษณ์หน่วยงาน","กระดาษสีขาว มีเส้น ไม่มีตราสัญลักษณ์หน่วยงาน"],"a":1,"e":"ลักษณะของจดหมายสมัครงาน ประกอบด้วย กระดาษสีขาวสะอาด ไม่มีลวดลายหรือไม่มีเส้นบรรทัด และไม่ใช้ กระดาษที่มีตราสัญลักษณ์หน่วยงาน/องค์กรด้วย"},{"n":29,"q":"ข้อมูลสำคัญต่อไปนี้ควรมีอยู่ในจดหมายสมัครงาน แต่จะมีข้อมูลหนึ่งที่ไม่ควรมี คืออะไร","o":["การเรียกเงินเดือน","ความสนใจในงานที่สมัคร","ความสนใจเฉพาะด้าน","การบอกเล่าประวัติส่วนตัว"],"a":1,"e":"ข้อควรระวังของการเขียนจดหมายสมัครงาน คือ ผู้สมัครอย่าใช้ภาษาในลักษณะที่โฆษณาชวนเชื่อหรือกล่าวเกิน ความเป็นจริง ตลอดจนอวดอ้างคุณสมบัติของตนเอง นอกจากนี้อย่าเขียนข้อความในลักษณะการขอความเห็นใจอัน เนื่องมาจากปัญหาส่วนตัว ไม่ควรกล่าวถึงความไม่ดีของอดีตหัวหน้าและสถานที่ทำงานเก่า รวมไปถึงไม่ควรเรียก เงินเดือน แต่ถ้ามีการระบุเงินเดือนในจดหมายสมัครงานควรศึกษาถึงอัตราและขั้นเงินเดือนที่ควรได้รับให้เหมาะสม"},{"n":30,"q":"ข้อมูลใดต่อไปนี้ไม่จำเป็นต้องมีในประวัติย่อ","o":["ประสบการณ์การทำงาน","ชื่อมหาวิทยาลัยที่เรียนจบ","ชื่อโรงเรียนสมัยประถม มัธยม","รางวัลเกียรติบัตร"],"a":3,"e":"องค์ประกอบของการเขียนประวัติย่อ (Resume) ได้แก่ 1. ข้อมูลส่วนตัวที่จำเป็น 2. ประวัติการศึกษา (ต้องเขียนให้เหมาะสมกับกิจกรรมที่ผู้เขียนประวัติย่อมีความเกี่ยวข้องแต่ไม่จำเป็นต้องกล่าวถึง การศึกษาตั้งแต่ระดับชั้นประถมศึกษา มัธยมศึกษา) 3. ประสบการณ์การทำงาน 4. ประสบการณ์การทำกิจกรรม 5. งานอดิเรก 6. รางวัลเกียรติบัตร"},{"n":31,"q":"ข้อใดต่อไปนี้ผิด","o":["คำภาษาไทยเป็นคำโดด","ภาษาไทยเปลี่ยนแปลงรูปคำเพื่อบอกเพศ พจน์ กาล การก วาจก เมื่ออยู่ในประโยค","ภาษาไทยใช้ระดับเสียงเปลี่ยนความหมายของคำ","ภาษาไทยสร้างคำศัพท์ขึ้นใหม่โดยวิธีประสมคำ"],"a":2,"e":"ลักษณะสำคัญของภาษาไทยสามารถพิจารณาเป็นประเด็นต่าง ๆ ได้ดังนี้ 1. คำภาษาไทยเป็นคำโดด 2. ภาษาไทยไม่เปลี่ยนแปลงรูปคำเพื่อบอกเพศ พจน์ กาล การก วาจก เมื่ออยู่ในประโยค 3. ภาษาไทยสร้างคำศัพท์ขึ้นใหม่โดยวิธีประสมคำ 4. ภาษาไทยใช้ระดับเสียงเปลี่ยนความหมายของคำ"},{"n":32,"q":"คำในข้อใดหมายถึง พันล้าน ในคำถิ่นเหนือหรืออีสาน","o":["ติ๋ว","กือ","ตื้อ","อั้ว"],"a":3,"e":"คำว่า \"ตื้อ\" = พันล้าน ในคำถิ่นเหนือหรืออีสาน (ส่วนคำว่า \"ติ๋ว\" = หมื่นล้านในคำถิ่นอีสาน, \"กือ\" = ร้อยล้าน ใน คำถิ่นเหนือหรืออีสาน)"},{"n":33,"q":"ข้อใดต่อไปนี้ผิด","o":["หลักฐานที่เกี่ยวกับภาษาไทย เกิดขึ้นครั้งแรกในสมัยทวารวดี","ภาษาไทยในสมัยสุโขทัยมักเป็นคำเดี่ยว","พ่อขุนรามคำแหงทรงนำอักษรมอญและอักษรขอมมาปรับปรุงจนเป็นลายสือไทย","พ่อขุนรามคำแหงทรงประดิษฐ์อักษรไทยใช้เป็นครั้งแรก"],"a":1,"e":"ในสังคมและวัฒนธรรมไทยเริ่มปรากฏหลักฐานที่เกี่ยวกับภาษาไทยในสมัยสุโขทัยโดยหลักฐานที่สำคัญ คือ จ /ฝึกฝนเพื่อให้เกิด ทักษะความ ชำนาญได้"},{"n":62,"q":"การกล่าวสุนทรพจน์ในพิธีเปิดสำนักงานแห่งใหม่ ถือเป็นการพูดประเภทใด","o":["การพูดในกลุ่ม","การพูดระหว่างบุคคล","การพูดในที่ชุมนุมชน","การพูดทางสื่อสารมวลชน"],"a":3,"e":"การพูดในที่ชุมนุมชน เป็นการพูดหน้าที่ประชุม อาจเป็นเพียงคนเดียวหรืออาจ ร่วมคณะกับคนอื่นก็ได้ โดยจะเป็น การพูดกับกลุ่มผู้ฟังที่มีจำนวนมาก ซึ่งจำนวนผู้ฟังจะมาก น้อยเพียงไรขึ้นอยู่กับโอกาส กาลเทศะ และเงื่อนไขต่าง ๆ ทั้งนี้ การพูดในที่ชุมนุมชนแบ่งได้ชัดเจนว่า ใครเป็นผู้พูดหลัก และใครเป็นผู้ฟัง เช่น การปาฐกถา การอภิปรายในที่สาธารณะ การโฆษณาหาเสียง การปราศรัย การกล่าวต้อนรับ การบรรยายสรุป การชี้แจงต่อที่ประชุมและการพูดในโอกาสพิเศษ ต่าง ๆ ต่อหน้าที่ประชุม (เช่น การกล่าวสุนทรพจน์ในพิธีเปิดงาน)"},{"n":63,"q":"การพูดในลักษณะใดที่มีความยืดหยุ่นด้านเวลาสูง","o":["การพูดระหว่างบุคคล","การพูดในที่ชุมนุมชน","การพูดในกลุ่ม","การพูดทางสื่อสารมวลชน"],"a":1,"e":"การพูดระหว่างบุคคล เป็นการพูดขั้นพื้นฐานที่สุดของสังคมมนุษย์ไม่ว่าจะมีฐานะอาชีพ หรือหน้าที่การงาน อย่างไรก็ตาม จำเป็นต้องใช้การพูดในระดับนี้อยู่ตลอดเวลา โดยมีลักษณะสำคัญ คือ ไม่มีข้อจำกัดว่าแต่ละช่วงของการ พูดจะต้องใช้เวลามากน้อยเท่าไร ขึ้นอยู่กับกาลเทศะและความเหมาะสม ดังนั้นจึงเป็นการพูดที่มีความยืดหยุ่นทางด้าน เวลาสูง เช่นการทักทาย การถามสารทุกข์สุขดิบ การสนทนา การถกเถียง การปรึกษาหารือ ฯลฯ"},{"n":64,"q":"\"ถึงบางพูดพูดดีเป็นศรีศักดิ์ มีคนรักรสถ้อยอร่อยจิต แม้นพูดชั่วตัวตายทำลายมิตร จะชอบผิดใน มนุษย์เพราะพูดจา\" คำกลอนดังกล่าวสื่อถึงวัตถุประสงค์ของการเรียนวิชาการพูดในข้อใด","o":["เพื่อส่งสารไปสู่ผู้ฟังอย่างมีประสิทธิภาพ","เพื่อสร้างมนุษย์สัมพันธ์","เพื่อพัฒนาบุคลิกภาพของผู้พูด","เพื่อฝึกฝนทักษะการแสดงความคิดเห็น"],"a":2,"e":"วัตถุประสงค์ของการเรียนวิชาการพูดประการหนึ่ง ได้แก่ เพื่อสร้างมนุษย์สัมพันธ์คือ การพูดดี มีประโยชน์ น่าฟัง ย่อมทำให้ผู้พูดเป็นที่รักและมีมิตรมาก ซึ่งตรงกับคำกลอนที่ว่า \"ถึงบางพูดพูดดีเป็นศรีศักดิ์ มีคนรักรสถ้อยอร่อยจิต แม้นพูดชั่วตัวตายทำลายมิตร จะชอบผิดในมนุษย์เพราะพูดจา\" หรือตรงกับสำนวนที่ว่า \"พูดดีเป็นศรีแก่ปาก\" (พูดจาดี ย่อมเป็นที่นิยมชมชอบ) นอกจากนี้การพูดที่ดียังมีส่วนช่วยคลี่คลายปัญหาความขัดแย้งต่าง ๆ ได้อีกด้วย"},{"n":65,"q":"การบรรยายในชั้นเรียน จัดเป็นการพูดแบบใด","o":["การพูดโดยฉับพลัน","การพูดโดยมีการเตรียมตัวล่วงหน้า","การพูดโดยอ่านจากต้นฉบับ","การพูดโดยท่องจำ"],"a":2,"e":"การพูดโดยมีการเตรียมตัวล่วงหน้า เป็นการพูดที่ผู้พูดจะพูดจากความเข้าใจเนื้อหาที่ต้องการถ่ายทอดให้แก่ผู้ฟัง โดยผู้พูดจะต้องศึกษาค้นคว้าและเตรียมตัวล่วงหน้ามาเป็นอย่างดี จึงเป็นวิธีที่เหมาะสมที่สุดกับการพูดในแทบทุกโอกาส และเป็นที่นิยมใช้กันมาก เพราะทำให้ผู้พูดไม่สับสน มีการเรียงลำดับเรื่องว่าจะพูดอะไรก่อนหลัง ไม่ทำให้การพูดวกวน ตัวอย่างของการพูดชนิดนี้ ได้แก่ การบรรยาย การอภิปราย เป็นต้น"},{"n":66,"q":"ข้อใดมิใช่คุณสมบัติของนักพูดที่ดี .","o":["มีความเชื่อมั่นในตนเอง","ศึกษาหาความรู้อยู่เสมอ","ยอมรับฟังคำวิจารณ์","มีความสุขในการถ่ายทอดความรู้ให้ผู้อื่น"],"a":1,"e":"คุณสมบัติที่สำคัญเบื้องต้นของนักพูดที่ดีมีอยู่ 5 ประการ ดังนี้ 1. เป็นนักฟังที่ดี 2. ศึกษาหาความรู้อยู่เสมอ 3. ยอมรับฟังคำวิจารณ์ 4. เป็นตัวของตัวเอง 5. มีความสุขในการถ่ายทอดความรู้ให้ผู้อื่น"},{"n":67,"q":"คำกล่าวในพิธีเปิดงานเนื่องในสัปดาห์วิทยาศาสตร์แห่งชาติ ควรใช้การพูดแบบใด","o":["การพูดโดยท่องจำ","การพูดโดยฉับพลัน","การพูดโดยอ่านจากต้นฉบับ","การพูดโดยมีการเตรียมตัวล่วงหน้า"],"a":3,"e":"การพูดโดยอ่านจากร่างหรือต้นฉบับ คือ การพูดในลักษณะที่เป็นการอ่านจากร่างหรือต้นฉบับที่จัดเตรียมไว้ ล่วงหน้า โดยไม่มีการเปลี่ยนแปลงข้อความแต่อย่างใด และผู้พูดไม่จำเป็นต้องคิดหาถ้อยคำใดมาใช้ นิยมใช้ในการพูดที่ ต้องการความระมัดระวังเกี่ยวกับการใช้ถ้อยคำแต่ละคำเป็นพิเศษ โดยเฉพาะในโอกาสที่เป็นพิธีการ เช่น กระแสพระราช ดำรัสของพระบาทสมเด็จพระเจ้าอยู่หัวในพระราชพิธีต่าง ๆ, คำปราศรัยของบุคคลสำคัญ, คำกล่าวใน พิธีเปิดงาน, คำ กล่าวในพิธีเปิดและปิดการประชุม, คำแถลงการณ์ของรัฐบาล เป็นต้น"},{"n":68,"q":"การที่ผู้พูดต้องมีความรับผิดชอบต่อการพูดของตนเอง หมายถึงข้อใด","o":["ผู้พูดต้องไม่พูดปด","ผู้พูดต้องไม่พูดส่อเสียด","ผู้พูดต้องไม่พูดยุแยง","ถูกทุกข้อ"],"a":4,"e":"มารยาทในการพูดประการหนึ่ง ได้แก่ ผู้พูดต้องมีจริยธรรม และ มีความรับผิดชอบต่อการพูดของตนเอง คือ ผู้พูดต้องมี ความจริงใจ มีความรับผิดชอบต่อการพูดที่ทำให้ผู้อื่นเสียใจ หรือไม่สบายใจ เช่น ไม่พูดปด ไม่พูดส่อเสียด ไม่พูดยุแยง"},{"n":69,"q":"ข้อใดตรงกับประโยคที่ว่า \"การฟังเป็นการเปิดโลก\" ที่สุด","o":["การฟังช่วยให้ได้เรียนรู้ในสิ่งที่ไม่เคยรู้","การฟังช่วยให้ได้รับความรู้ที่เป็นประโยชน์","การฟังมีส่วนช่วยพักผ่อนหย่อนใจ","การฟังมีส่วนช่วยสร้างมนุษย์สัมพันธ์"],"a":1,"e":"ความสำคัญของการฟังประการหนึ่ง ได้แก่ การฟังเป็นการเปิดโลก คือ การฟังช่วยให้เป็นคนใจกว้าง รู้จักยอมรับ ฟังความคิดเห็นหรือวัฒนธรรมที่แตกต่าง ช่วยให้ได้เรียนรู้ในสิ่งที่ไม่เคยรู้ และทำให้เป็นคนที่มีเหตุมีผล"},{"n":70,"q":"ข้อใดหมายถึง การฟังอย่างมีวิจารณญาณ","o":["ตั้งใจฟังตั้งแต่ต้นจนจบ","ไม่ตัดสินผู้พูดล่วงหน้า","เตรียมตัวมาฟังเป็นอย่างดี","เลือกตำแหน่งที่นั่งในการฟังให้เหมาะสม"],"a":1,"e":"ลักษณะของการฟังที่ดีประการหนึ่ง ได้แก่ การฟังด้วยความอดทนและ มีวิจารณญาณ กล่าวคือ โดยธรรมชาติ คนเรานั้นมักจะมีพฤติกรรมชอบพูดมากกว่าชอบฟังแต่ในขณะเดียวกันมนุษย์เราก็ควรจะรับฟังความคิดเห็นของผู้อื่น บ้าง ในกรณีเช่นนี้ผู้ฟังควร มีความอดทนที่จะตั้งใจรับฟังการพูดของผู้อื่นจนจบ และใช้วิจารณญาณอย่างสุขุมรอบคอบ เพื่อประเมินความหมายของผู้พูด"},{"n":71,"q":"เดี่ยว 13 ของโน้ต อุดม แต้พานิช จัดเป็นการพูดแบบใด","o":["การพูดเพื่อบอกให้รู้","การพูดเพื่อจูงใจ","การพูดจรรโลงใจ","การพูดเพื่อสร้างแรงบันดาลใจ"],"a":3,"e":"การพูดจรรโลงใจ เป็นการพูดเพื่อความบันเทิง และให้ผู้ฟังเกิดความรู้สึกสนุกสนาน ผ่อนคลายความตึงเครียดจาก สถานการณ์ต่าง ๆ ที่ประสบพบเจอในชีวิตประจำวัน จึงเป็นการ พูดที่ใช้ได้ในหลายโอกาสที่มีการพบปะสังสรรค์ เช่น การพูดในงานชุมนุมสโมสรหรือสมาคม ต่าง ๆ, งานรื่นเริง, การพูดหลังอาหาร, เรื่องเกี่ยวกับสถานที่ท่องเที่ยวต่าง ๆ หรือประสบการณ์ที่น่าสนใจ เป็นต้น"},{"n":72,"q":"การพูดรณรงค์ในหัวข้อ \"ลดการใช้พลาสติก ลดการใช้พลังงาน ฝ่าวิกฤติโลกร้อน\" จัดเป็นการพูด ประเภทใด","o":["การพูดเพื่อบอกให้รู้","การพูดเพื่อจูงใจ","การพูดจรรโลงใจ","การพูดเพื่อสร้างแรงบันดาลใจ"],"a":2,"e":"การพูดเพื่อจูงใจ หรือการพูดโน้มน้าวใจ เป็นการพูดเพื่อให้ผู้ฟังได้ความรู้ เชื่อ และเห็นด้วยทั้งทางความคิดและ การกระทำตามจุดมุ่งหมายของผู้พูด จึงเป็นการพูดที่ผู้พูดต้องการให้ผู้ฟังเกิดความเชื่อมากกว่าความรู้ โดยผู้พูดนอกจาก จะมีความชำนาญในการพูดแล้ว ยังต้อง มีหลักจิตวิทยาในการพูดเพื่อให้ผู้ฟังเชื่อหรือคล้อยตามความคิดของตน เช่น การ พูดเพื่อรณรงค์ในเรื่องต่าง ๆ เป็นต้น"},{"n":73,"q":"ผู้ฟังกลุ่มใดที่เปลี่ยนแปลงทัศนคติได้ยาก เพราะมักจะยึดติดกับความเชื่อเดิม","o":["วัยเด็ก","วัยรุ่น","วัยกลางคน","วัยชรา"],"a":4,"e":"วัยชรา เป็นวัยที่ผ่านชีวิตมามาก มีประสบการณ์สูง ชอบหาสิ่งยึดเหนี่ยวจิตใจ มีความคิดแบบอนุรักษนิยม เชื่อใน สิ่งที่ปฏิบัติได้จริง มีความระแวดระวัง เนื่องจากผู้สูงอายุผ่านชีวิตมามาก โอกาสที่จะโน้มน้าวให้เปลี่ยนแปลงความคิด ความเชื่อจะน้อยลง เพราะมักจะ ยึดติดกับความเชื่อเดิม ดังนั้นการพูดกับคนในวัยนี้จึงควรพูดเรื่องความปลอดภัยในชีวิต และทรัพย์สิน, การรักษาพยาบาล, สวัสดิภาพทางครอบครัวและจิตใจ เป็นต้น"},{"n":74,"q":"ผู้ฟังกลุ่มใดที่อยู่ในช่วงสร้างเนื้อสร้างตัว ต้องการการพูดที่มีเหตุผล หนักแน่น น่าเชื่อถือ จึงจะ สามารถโน้มน้าวให้คล้อยตามได้","o":["วัยเด็ก","วัยรุ่น","วัยกลางคน","วัยชรา"],"a":3,"e":"วัยกลางคน เป็นวัยที่กำลังสร้างเนื้อสร้างตัว มีจุดมุ่งหมายในอาชีพการงานพยายามที่จะสร้างฐานะของตนเอง รัก ความก้าวหน้า มุ่งมั่นที่จะสร้างชื่อเสียง ยึดมั่นในความคิดและอุดมคติของตนเอง มีความคิดและประสบการณ์กว้างขวาง ดังนั้นการพูดกับคนในวัยนี้ ผู้พูดต้องมีการเตรียมตัวที่ดี ใช้คำพูดที่เหมาะสม กระชับ มีเหตุมีผล หนักแน่น น่าเชื่อถือ สามารถที่จะโน้มน้าวให้ผู้ฟังคล้อยตามความคิดเห็นของผู้พูดได้"},{"n":75,"q":"ผู้ฟังกลุ่มใดที่เบื่อง่าย ไม่มีความตั้งใจในการฟังเรื่องได้นาน ชอบเรื่องสนุกสนาน","o":["วัยเด็ก","วัยรุ่น","วัยกลางคน","วัยชรา"],"a":1,"e":"วัยเด็ก เป็นวัยที่มีลักษณะซุกชน ไม่อยู่นิ่ง ไม่มีความตั้งใจในการฟังเรื่องได้นานเบื่อง่าย ชอบแต่เรื่องสนุกสนาน ตื่นเต้น อยากรู้อยากเห็น ชอบการรับประทาน มีพื้นฐานความรู้ ความสนใจ และประสบการณ์น้อย ดังนั้นจึงควรใช้ภาษา ที่ง่ายกว่าการสื่อสารกับ ผู้ใหญ่ และต้องไม่พูดนานจนเกินไป โดยเรื่องที่จะพูดควรเป็นเรื่องสนุกสนาน เร้าอารมณ์สร้าง ความตื่นเต้น น ้าเสียงในการพูดจะต้องแสดงความตื่นเต้นสนุกสนาน แฝงด้วยมุกตลก"},{"n":76,"q":"การขยายความแบบใดที่ช่วยดึงดูดความสนใจของผู้ฟังได้ดี แต่ถ้าหากใช้มากเกินไปจะทำให้ผู้ฟัง ขาดความสนใจในเนื้อหาสาระของผู้พูด","o":["การขยายความโดยการให้นิยาม","การขยายความโดยการยกหลักฐานอ้างอิง","การขยายความโดยการเปรียบเทียบ","การขยายความโดยการใช้โสตทัศนูปกรณ์"],"a":4,"e":"การขยายความโดยการใช้โสตทัศนูปกรณ์ต่าง ๆ เช่น รูปภาพ แผนภูมิ ภาพเลื่อน ตัวอย่างของจริง แบบจำลอง ภาพยนตร์ ฯลฯ ประกอบการพูด นอกจากจะเป็นการประหยัดเวลาแล้ว ยังช่วยให้เกิดความกระจ่างในเนื้อหา ทำให้ผู้ฟัง เข้าใจและจดจำได้ง่ายขึ้น แต่มีข้อที่ควรระวัง คือ ถึงแม้โสตทัศนูปกรณ์จะช่วยดึงดูดความสนใจของผู้ฟังได้ดี แต่หากใช้ มากเกินไปจะทำให้ผู้ฟังขาดความสนใจในเนื้อหาสาระของผู้พูดได้"},{"n":77,"q":"ปัจจัยในการวิเคราะห์ผู้ฟังข้อใดที่เป็นเรื่องละเอียดอ่อน ซึ่งผู้พูดควรต้องระมัดระวังที่สุด","o":["เพศ","อายุ","ความเชื่อ","การศึกษา"],"a":3,"e":"การนับถือศาสนา ความเชื่อ และวัฒนธรรม เป็นสิ่งที่คนเรายึดถือมาตั้งแต่ในอดีต ดังนั้นผู้พูดจึงต้องใช้ความระ มัด ระวังที่สุด อย่าพูดในทำนองดูหมิ่น เหยียดหยาม หรือไม่เห็นด้วยกับศาสนาและความเชื่อต่าง ๆ เพราะถือเป็นเรื่อง ละเอียด อ่อน ซึ่งอาจจะก่อให้เกิดความไม่พอใจ หรือความขัดแย้ง และทำให้การพูดไม่ประสบความสำเร็จ"},{"n":78,"q":"ช่วงเวลาใดที่ผู้พูดไม่ควรพูดยึดเยื้อ เพราะผู้ฟังอาจมีอาการเบื่อหน่ายและองนอน","o":["08.00 - 10.00 น.","10.00 - 12.00 น.","13.00 - 15.00 น.","ไม่มีข้อใดถูก"],"a":3,"e":"ผู้พูดต้องวิเคราะห์ว่าจะพูดในช่วงเวลาใด และจะใช้เวลาพูดนานแค่ไหนเพราะการวิเคราะห์ช่วงเวลาที่พูดจะช่วย ให้ผู้พูดทราบความสนใจของผู้ฟัง เช่น ถ้าหากพูดในช่วงเข้า (08.00 - 10.00 น.) ผู้ฟังจะมีความสนใจมากและมีความ ตื่นตัวในการฟังที่สุด เพราะยังกระปรี้กระเปร่า แต่หากพูดหลังอาหารกลางวัน (13.00 - 15.00 น.) ผู้ฟังมักจะ ง่วงนอน ยิ่ง ถ้าห้องที่พูดนั้นไม่ได้ติดเครื่องปรับอากาศก็จะร้อนอบอ้าว ในกรณีนี้ผู้พูดไม่ควร พูดยึดเยื้อ เพราะจะทำให้ผู้ฟังเกิดความ เบื่อหน่าย ควรจะเตรียมเรื่องเบา ๆ หรือสอดแทรกอารมณ์ขั้นเพื่อช่วยผ่อนคลายความง่วงของผู้ฟัง นอกจากนี้เวลาที่ใช้ ในการพูดก็มีความ สำคัญแม้จะเป็นหัวข้อเดียวกัน"},{"n":79,"q":"ข้อใดเป็นคำปฏิสันถารที่ใช้ในการพูดแบบไม่เป็นทางการ","o":["ท่านประธาน และแขกผู้มีเกียรติทุกท่าน","ท่านผู้ฟังที่เคารพทุกท่าน","ท่านผู้อำนวยการ และคณาจารย์ทุกท่าน","ถูกทุกข้อ"],"a":2,"e":"คำทักทายหรือคำปฏิสันถารแบ่งออกเป็น 2 ประเภท ดังนี้ 1. คำปฏิสันถารที่เป็นทางการ จะใช้กับงานพิธีการต่าง ๆ เช่น งานศาสนพิธี งานวางศิลาฤกษ์งานแจกวุฒิบัตร คำกล่าว เปิดงาน ฯลฯ จะใช้เรียกเฉพาะตำแหน่ง เช่น \"ท่านผู้อำนวยการคณาจารย์ และท่านผู้มีเกียรติทั้งหลาย\" เมื่อกล่าวคำ ปฏิสันถารจบแล้วจึงตามด้วยประโยค ที่ว่า \"ข้าพเจ้ารู้สึกเป็นเกียรติอย่างยิ่งที่ได้มาพูดในวันนี้\" 2. คำปฏิสันถารที่ไม่เป็นทางการ เช่น การประชุมภายในหน่วยงาน การอภิปราย คำปราศรัยคำกล่าวของนักการเมือง ฯลฯ จะมีคำแสดงความรู้สึก เช่น คำว่า \"เคารพ/นับถือ/ที่รัก\"อยู่ด้วย เช่น \"สวัสดีท่านผู้ฟังที่เคารพทุกท่าน\", \"สวัสดีพี่น้อง ชาวบ้านที่รักทั้งหลาย\" ฯลฯเมื่อกล่าวคำปฏิสันถารจบแล้วจึงตามด้วยประโยคที่ว่า \"ผม//กระผม/ดิฉัน รู้สึกเป็นเกียรติ อย่างยิ่งที่ได้มาพูดในวันนี้\" ส่วนสรรพนามที่ใช้แทนผู้ฟังต้องเป็นคำยกย่องให้เกียรติ หรือแสดงความเป็นฝ่ายเดียวกับผู้ พูด เช่น ท่าน พี่น้อง พวกเรา คุณ เพื่อน ฯลฯ"},{"n":80,"q":"ข้อใดเป็นอาการภาษาของผู้พูด","o":["การใช้น ้าเสียงสูงต ่า","การสบตากับผู้ฟัง","การใช้ถ้อยคำสุภาพ","การแสดงท่าทีนอบน้อม"],"a":4,"e":"อาการภาษา คือ การแสดงกิริยาท่าทางประกอบการพูด เช่น การแสดงออกทาง สีหน้า การเคลื่อนไหวร่างกาย การ เคลื่อนไหวของมือ ท่วงท่าอาการ การสัมผัส เป็นต้น ทั้งนี้อาการภาษาที่ผู้พูด ระทำอย่างเหมาะสม มีชีวิตชีวา กลมกลืน กับบุคลิกของผู้พูดและเนื้อหาสาระที่พูดนั้น จะช่วยสร้างความประทับใจและความน่าเชื่อถือให้แก่ผู้พูด"},{"n":81,"q":"\"เลือกตั้ง กทม. คึกคัก คนแห่มาใช้สิทธิ์ลันหลาม\" เป็นการขึ้นต้นคำนำแบบใด","o":["ขึ้นต้นด้วยการตั้งคำถาม","ขึ้นต้นให้สนุกสนาน","ขึ้นต้นแบบพาดหัวข่าว","ขึ้นต้นด้วยการทำให้ผู้ฟังสงสัย"],"a":3,"e":"หลักการขึ้นต้นคำนำประการหนึ่ง คือ ขึ้นต้นแบบพาดหัวข่าว ซึ่งใช้วิธีเดียวกับการพาดหัวข่าวหนังสือพิมพ์ เพื่อดึงดูด ความสนใจของผู้อ่าน โดยเอาผลมาพูดก่อนแล้วจึงอธิบายทีหลัง เช่น \"เลือกตั้ง กทม. คึกคัก คนแห่มาใช้สิทธิ์ล้นหลาม\""},{"n":82,"q":"\"ผมรู้สึกเป็นเกียรติอย่างยิ่งที่ได้รับเชิญมาพูดในวันนี้ แต่ก่อนอื่นต้องขอเรียนให้ทราบว่า กระผมไม่ มีความเชี่ยวชาญในเรื่องนี้มากนัก หากพูดผิดบ้างถูกบ้างต้องขออภัย\" เป็นข้อบกพร่องในการใช้คำนำ ประเภทใด","o":["พูดถ่อมตัว","พูดออกตัว","พูดอ้อมค้อม","พูดขออภัย"],"a":2,"e":"ข้อบกพร่องในการใช้คำนำประการหนึ่ง คือ อย งงานประชาสัมพันธ์ได้อย่างถูกต้อง","o":["การประชาสัมพันธ์เป็นกิจกรรมที่จัดขึ้นตามสถานการณ์ที่เกิดขึ้น","การประชาสัมพันธ์ต้องใช้การวิจัยมาเป็นฐานในการคิดและวางแผน","การประชาสัมพันธ์เป็นการส่งข้อมูลทางเดียวที่ครอบคลุมและทั่วถึงมากที่สุด","การประชาสัมพันธ์มีวัตถุประสงค์เพื่อสร้างภาพลักษณ์ขององค์กรให้โดดเด่น แม้จะเป็นการ โฆษณาชวนเชื่อ"],"a":2,"e":"Guth and Marsh กล่าวถึงการประชาสัมพันธ์ไว้ว่า 1. การประชาสัมพันธ์มีหน้าที่เกี่ยวกับการจัดการประเภทหนึ่ง 4. การประชาสัมพันธ์เป็นงานที่มีฐานมาจากการวิจัย 2. การประชาสัมพันธ์เป็นการสื่อสารแบบสองทาง 5. การประชาสัมพันธ์เป็นความรับผิดชอบต่อสังคม 3. การประชาสัมพันธ์เป็นกิจกรรมที่เกิดจากการวางแผน"},{"n":92,"q":"การออกแบบการสื่อสารให้มีอิทธิพล เพื่อให้เกิดความเข้าใจ ให้ข้อมูล และได้รับผลสะท้อนกลับ จากการ สื่อสาร จัดเป็นองค์ประกอบใดของการประชาสัมพันธ์","o":["เจตนา","การวางแผน","ผลการดำเนินงาน","ประโยชน์สาธารณะ"],"a":1,"e":"องค์ประกอบของการประชาสัมพันธ์ประการหนึ่ง ได้แก่ เจตนา คือ กิจกรรมประชาสัมพันธ์เป็นกิจกรรมที่มี เจตนา มีการออกแบบการสื่อสารเพื่อให้มีอิทธิพลเพื่อให้เกิดความเข้าใจ เพื่อให้ข้อมูล และยังต้องการผลสะท้อนกลับ จากการสื่อสารอีกด้วย"},{"n":93,"q":"การจัดกิจกรรมประยาสัมพันธ์ที่ได้รับผลดีต่อองค์กร และบุคลทั่วไป จัดเป็นองค์ประกอบด้านใด ของการประชาสัมพันธ์","o":["เจตนา","การวางแผน","ผลการดำเนินงาน","ประโยชน์สาธารณะ"],"a":4,"e":"องค์ประกอบของการประชาสัมพันธ์ประการหนึ่ง ได้แก่ ประโยชน์สาธารณะ คือ กิจกรรมการประชาสัมพันธ์ควร เป็นกิจกรรมที่เป็นประโยชน์และได้รับผลดีทั้งต่อองค์กรเองและสาธารณชนหรือบุคคลทั่วไปด้วยเช่นเดียวกัน"},{"n":94,"q":"บริษัทจัดงานเปิดตัวผลิตภัณฑ์อาหารปลาชนิดใหม่ เร่งการเจริญเติบโตอย่างรวดเร็ว รับรองผล 100%แต่เมื่อใช้ไป น ้าเริ่มขุ่น ส่งกลิ่นเน่าเหม็น แหล่งน ้าบริเวณใกล้เคียงได้รับผลกระทบ ประชาชนพยายาม ร้องเรียนไปยังเจ้าของบริษัทผลิตอาหารปลาหลายครั้ง แต่มิได้รับการแก้ไขแต่อย่างใด ยังมุ่งหน้าโฆษณาขาย ผลิตภัณฑ์ของตัวเองต่อไป แสดงว่าบริษัทต้องปรับปรุงองค์ประกอบในการประชาสัมพันธ์ด้านใด","o":["เจตนา","ผลการดำเนินงาน","หน้าที่เชิงจัดการ","การสื่อสารสองทาง"],"a":4,"e":"องค์ประกอบของการประชาสัมพันธ์ประการหนึ่ง ได้แก่ การสื่อสารสองทาง คือ การประชาสัมพันธ์เป็นการ สื่อสารสองทางมากกว่าการสื่อสารทางเดียว เพราะการได้รับผลสะท้อนกลับเป็นสิ่งที่มีความสำคัญ ทำให้รู้ว่า สาธารณชนคิดหรือรู้สึกอย่างไรต่อองค์กร ดังคำกล่าวว่า \"ความรับผิดชอบในลำดับแรก ๆ ของที่ปรึกษาประชาสัมพันธ์ คือ การจัดการหาหรือจัดการเพื่อเข้าใจอารมณ์ความรู้สึกของสาธารณชน\""},{"n":95,"q":"รถยนต์ยี่ห้อฟาร์บิส ประกาศให้นำรถยนต์ทุกคันกลับเข้ามายังศูนย์บริการ เพื่อเปลี่ยนถุงลมนิรภัย ภายในรถ ที่บริษัทสำรวจพบว่า ถุงลมไม่ทำงานเมื่อรถประสบอุบัติเหตุ บริษัทกระทำเช่นนี้ด้วยวัตถุประสงค์ ใด","o":["เพื่อป้องกันรักษาชื่อเสียง","เพื่อสร้างความนิยมศรัทธา","เพื่อสร้างความเข้าใจอันดี","เพื่อสนับสนุนกิจกรรมทางการตลาด"],"a":1,"e":"วัตถุประสงค์ในการประชาสัมพันธ์ประการหนึ่ง ได้แก่ เพื่อป้องกันและรักษาชื่อเสียง คือ ความศรัทธา ความนิยม และความเชื่อถือขององค์กร เป็นสิ่งที่จะต้องคำนึงถึงเป็นอย่างมากหากเกิดความเสื่อมเสียจะทำให้เกิดความเสียหายอย่าง มากตามมา ดังนั้นองค์กรจึงจำเป็นต้อง ก่อกำเนิดคุณความดี มีความชื่อตรง ทำประโยชน์ให้แก่สังคม เพื่อสร้างความนิยม และศรัทธาประชาชนเกิดความไว้วางใจเพื่อรักษาชื่อเสียงขององค์กร"},{"n":96,"q":"“เปลวเทียนให้แสง รามคำแหงให้ทาง\" เป็นการเขียนประชาสัมพันธ์เพื่อวัตถุประสงค์ใด","o":["ให้ประชาชนยอมรับ","สร้างภาพลักษณ์ที่ดี","บอกกล่าวให้ทราบให้เข้าใจ","สนับสนุนกิจกรรมทางการตลาด"],"a":2,"e":"การเขียนประชาสัมพันธ์เพื่อสร้างภาพลักษณ์ที่ดี โดยการนำจุดเด่นขององค์กรมาสื่อสาร เพื่อทำให้เกิดความ เลื่อมใสศรัทธาตามที่องค์กรต้องการ ดังนั้นการเขียนจึง ต้องเลือกสรรคำที่กระตุ้นความรู้สึก กระทบใจ มีพลังต่อผู้อ่าน หากทว่าไม่โอ้อวด หรือไม่ใช้ถ้อยคำโฆษณาชวนเชื่อที่เกินจริง เช่น คำขวัญ บทความแนะนำองค์กร เป็นต้น"},{"n":97,"q":"การเขียน Press Release มีเป้าหมายเพื่อสื่อสารกับบุคคลกลุ่มใด","o":["บุคคลภายนอก เฉพาะกลุ่มลูกค้า","บุคคลภายใน ทั้งพนักงาน และเจ้าหน้าที่ทุกฝ่าย","บุคคลภายใน เฉพาะผู้บริหาร","บุคคลภายนอก ทั้งผู้ใช้บริการ และประชาชนทั่วไป"],"a":4,"e":"ข่าวแจก (Press Release) เป็นข้อมูล ข่าวสาร ข้อเท็จจริงเกี่ยวกับกิจกรรมหรือเหตุการณ์ต่าง ๆ ขององค์กรที่ เกิดขึ้น โดยนักประชาสัมพันธ์ได้ส่งข่าวไปเพื่อให้สื่อมวลชน ถ่ายทอดข้อมูลข่าวสาร หรือข้อเท็จจริงไปยัง บุคคลภายนอก ทั้งผู้ใช้ บริการ และประชาชนทั่วไป ซึ่งมีความมุ่งหมายให้องค์กรเป็นที่รู้จัก เข้าใจ และยอมรับในการ ดำเนินกิจกรรมต่าง ๆ"},{"n":98,"q":"ผู้ใหญ่มักเล่าให้ฟังว่า หากใครรับประทานจิ้งหรีด คนนั้นจะต้องมีเสียงแหล่มเล็ก และเปล่งเสียงร้อง ทั้งคืนเหมือนกับจิ้งหรีด ในวันหนึ่งได้มีบริษัทคิดผลิตขนมขบเคี้ยวด้วยการใช้ธัญพืชที่มีประโยชน์เพื่อเพิ่ม กากใยผสมผงสกัดจากจิ้งหรีด ซึงได้ศึกษาวิจัยมาเป็นอย่างดีว่าให้โปรตีนสูง และไม่มีพิษภัยหรือผลข้างเคียง ใดใดหากทว่าขนมชนิดนี้ยังมียอดจำหน่ายที่ไม่ดีนัก บริษัทควรเร่งประชาสัมพันธ์ผ่านการเขียนด้วย วัตถุประสงค์ในข้อใด","o":["เขียนเพื่อบอกกล่าวให้เข้าใจ","เขียนเพื่อสร้างภาพลักษณ์ที่ดี","เขียนเพื่อให้ประชาชนเกิดการยอมรับ","เขียนเพื่อป้องกันมิให้เกิดความเข้าใจผิด"],"a":4,"e":"การเขียนเพื่อป้องกันมิให้เกิดความเข้าใจผิด คือ การเขียนที่มุ่งให้ประชาชนเข้าใจรายละเอียดและเกิดความเชื่อมั่น อย่างไม่มีข้อเคลือบแคลงใจ ดังนั้นงานเขียนชนิดนี้จึงต้องมีรายละเอียดเพื่ออธิบาย แถลง ชี้แจงประเด็นต่าง ๆ อย่าง ชัดเจน อาจต้องมีการ อ้างอิงแหล่งข้อมูลที่ชัดเจนน่าเชื่อถือมาประกอบการเขียน เช่น การเขียนข่าว บทสัมภาษณ์ บทความแนะนำ บทความอธิบาย เป็นต้น"},{"n":99,"q":"ข้อใดไม่ใช่คุณสมบัติการพาดหัวข่าว","o":["ใช้ข้อความขนาดสั้น","เข้าใจได้ในทันที","นำเสนอมุมมองผู้เขียน","ดึงดูดความสนใจของผู้อ่าน"],"a":3,"e":"พาดหัวข่าว (Headline) เป็นส่วนสำคัญประการแรกที่จะดึงดูดความสนใจของผู้อ่านด้วยข้อความสั้น ๆ ที่ สามารถเข้าใจประเด็นได้โดยทันที ดังนั้นการพาดหัวข่าวจึงเป็นความท้าทายประการหนึ่งของนักประชาสัมพันธ์ที่ จะต้องสื่อความหมายให้ตรงกับเรื่องราวเข้าใจได้ด้วยถ้อยคำไม่มากนัก และดึงดูดให้ผู้อ่านติดตามอ่านข่าวต่อไป"},{"n":100,"q":"เนื้อหาข่าวควรมีคุณสมบัติเช่นไร","o":["บรรจุรายละเอียดของข่าวไว้ทั้งหมด","ตอบคำถามข้อใดข้อหนึ่งใน SWIH","เขียนด้วยข้อความที่ให้ผู้อ่านสามารถตีความได้ตามต้องการ","ผู้เขียนสอดแทรกทัศนคติเกี่ยวกับประเด็นของข่าวได้อย่างเต็มที่"],"a":1,"e":"เนื้อหาข่าว (Body) เป็นส่วนที่บรรจุเนื้อหารายละเอียดของข่าวทั้งหมด โดยตอบคำถาม 5W1H ได้อย่างครบถ้วน"},{"n":101,"q":"ข้อดีของการเขียนข่าวแบบพีระมิดหัวกลับ คือข้อใด","o":["ประหยัดเวลาในการอ่าน","ทำความเข้าใจสาระของเรื่ ึ่งว่า","o":["Billboard","Bud – side","Dimensions","Indoor Poster"],"a":1,"e":"โปสเตอร์ คือ ภาพขนาดใหญ่ พิมพ์บนกระดาษ ออกแบบเพื่อใช้ติดหรือแขวนบนผนังหรือกำแพง โดย โปสเตอร์อาจเป็นภาพพิมพ์และภาพเขียน หรืออาจจะเป็นอย่างใดอย่างหนึ่งโดยเฉพาะ ซึ่งการแบ่งประเภทของโปสเตอร์ มีดังนี้ 1. โปสเตอร์นอกสถานที่ ได้แก่ โปสเตอร์ขนาดใหญ่ที่เรียกว่า \"บิลบอร์ด\" (Billboard) 2. โปสเตอร์ประเภทเคลื่อนที่ได้ ได้แก่ โปสเตอร์ติดตามข้างรถประจำทาง (Bud - side) ท้ายรถประจำทาง (Bud - back) และโปสเตอร์ติดบริเวณที่สาธารณะทั่วไป 3. โปสเตอร์ติดภายใน (Indoor Poster) ได้แก่ โปสเตอร์ติดตามสำนักงาน หรือห้างสรรพสินค้า 4. โปสเตอร์ประเภท 3 มิติ เป็นโปสเตอร์ที่เป็นสื่อผสม (Dimensions) อาจนำคนเข้ามาผสมเน้นสื่อเพื่อสาธารณะ โดยตรง หรือบิลบอร์ดที่มีส่วนที่ยื่นออกมา"},{"n":115,"q":"โปสเตอร์ที่ติดบริเวณสำนักงาน หรือห้างสรรพสินค้า เรียกอีกชื่อหนึ่งว่าอะไร","o":["Billboard","Bud – side","Dimensions","Indoor Poster"],"a":4,"e":"ดูบรรยายเพิ่มเติมข้อ 114. ประกอบ"},{"n":116,"q":"โปสเตอร์เคลื่อนที่ไปกับรถประจำทาง","o":["Billboard","Bud – side","Dimensions","Indoor Poster"],"a":2,"e":"ดูบรรยายเพิ่มเติมข้อ 114. ประกอบ"},{"n":117,"q":"โปสเตอร์ที่เป็นสื่อผสม","o":["Billboard","Bud – side","Dimensions","Indoor Poster"],"a":3,"e":"ดูบรรยายเพิ่มเติมข้อ 114. ประกอบ"},{"n":118,"q":"หากนักศึกษามีข้อความขนาดยาวที่จะสื่อสารผ่านสื่อโฆษณา นักศึกษาจะเลือกใช้สื่อประเภทใดจึง จะเหมาะสม","o":["โปสเตอร์","แผ่นปลิว","แผ่นพับ","แค็ตตาล็อก"],"a":2,"e":"แผ่นปลิว จะพิมพ์ด้วยกระดาษแผ่นเดียว นิยมใช้กระดาษ A4 บรรจุข้อความได้ค่อนข้างมากโดยการเขียนข้อความ ในแผ่นปลิวควรใช้คำง่าย ๆ กะทัดรัด สื่อความหมายได้รวดเร็ว ตรงวัตถุประสงค์อาจใช้ภาพประกอบได้บ้างเพื่อให้ ผู้อ่านเกิดภาพพจน์ และช่วยสื่อความหมายขยายความให้ชัดเจนขึ้น"},{"n":119,"q":"การออกแบบสื่อที่จะต้องแยกส่วนปกและส่วนเนื้อเรื่องออกจากกันอย่างชัดเจน แม้จะพิมพ์ใน กระดาษแผ่นเดียวกัน เป็นสื่อชนิดใด","o":["โปสเตอร์","แผ่นปลิว","แผ่นพับ","แค็ตตาล็อก"],"a":3,"e":"แผ่นพับ หมายถึง กระดาษแผ่นเดียวที่พับแล้วจะมีขนาด 4 x 9 นิ้ว เนื้อที่กระดาษ ค่อนข้างจำกัด จึงบรรจุเนื้อความ ได้น้อย ส่วนที่ให้ข้อมูลจะอยู่ด้านใน const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let wrong=store.get('r1103wrong',{});
let S={view:'home',set:'all',count:20,shuffle:true,mode:'practice',msg:''};
let Q=null;
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const all=()=>D.flatMap((e,ei)=>e.items.map(it=>({...it,k:ei+'-'+it.n,src:e.title})));
const wcount=()=>Object.keys(wrong).length;

function start(kind){
  let p=all();
  if(kind==='wrong')p=p.filter(x=>wrong[x.k]);
  else if(S.set!=='all')p=p.filter(x=>x.k.startsWith(S.set+'-'));
  if(!p.length){S.msg='ยังไม่มีข้อที่เคยตอบผิด';render();return}
  if(S.shuffle||kind==='wrong')p=shuf(p);
  if(S.count>0&&kind!=='wrong')p=p.slice(0,S.count);
  Q={list:p,pos:0,ans:{},kind};S.view='quiz';S.msg='';render();window.scrollTo(0,0);
}
function finish(){
  Q.list.forEach((x,i)=>{const c=Q.ans[i];if(c==null)return;if(c===x.a)delete wrong[x.k];else wrong[x.k]=1});
  store.set('r1103wrong',wrong);S.view='result';render();window.scrollTo(0,0);
}
function qhtml(x){
  const i=x.q.indexOf(' | ');
  const pics=x.im?x.im.map(k=>'<img class="pic" src="'+IM[k]+'" alt="ภาพประกอบโจทย์">').join(''):'';
  return pics+(i>0?'<div class="ctx">'+esc(x.q.slice(0,i))+'</div>':'')+'<div class="q">'+esc(i>0?x.q.slice(i+3):x.q)+'</div>';
}
function home(){
  const chips=(arr,cur,key)=>arr.map(([v,l])=>`<button class="chip ${cur===v?'on':''}" data-k="${key}" data-v="${v}">${l}</button>`).join('');
  return `<h1>ฝึกทำข้อสอบ RAM1103</h1><div class="mu">ภาษาไทยเพื่อการสื่อสารในการทำงาน · ${D.length} ชุด รวม ${D.reduce((n,e)=>n+e.items.length,0)} ข้อ</div>
  <div class="card"><h2 style="margin-top:0">เลือกชุดข้อสอบ</h2><div class="row">${chips([['all','รวมทุกชุด'],...D.map((e,i)=>[String(i),e.title.replace('ปีการศึกษา','ปี')])],S.set,'set')}</div>
  <h2>จำนวนข้อ</h2><div class="row">${chips([[10,'10'],[20,'20'],[50,'50'],[0,'ทั้งหมด']],S.count,'count')}</div>
  <h2>รูปแบบ</h2><div class="row">${chips([['practice','ฝึกทำ (เฉลยทันที)'],['exam','จำลองสอบ (เฉลยตอนจบ)']],S.mode,'mode')}</div>
  <h2>ลำดับข้อ</h2><div class="row">${chips([[true,'สุ่ม'],[false,'เรียงตามต้นฉบับ']],S.shuffle,'shuffle')}</div>
  <div style="margin-top:18px"><button class="btn" data-act="start">เริ่มทำข้อสอบ</button></div></div>
  <div class="card"><b>ข้อที่เคยตอบผิด: ${wcount()} ข้อ</b><div class="mu">ระบบจำข้อที่ผิดไว้ในเบราว์เซอร์เครื่องนี้ และลบออกเมื่อทำถูก</div>
  <div class="row" style="margin-top:10px"><button class="btn alt" data-act="startwrong">ฝึกเฉพาะข้อที่เคยผิด</button>${wcount()?'<button class="btn alt" data-act="clear">ล้างรายการ</button>':''}</div>
  ${S.msg?`<div class="res bad" style="margin-top:8px">${S.msg}</div>`:''}</div>
  <footer class="mu">ใช้เพื่อการฝึกส่วนตัวเท่านั้น · ไฟล์ต้นฉบับระบุห้ามส่งต่อ/เผยแพร่</footer>`;
}
function quiz(){
  const x=Q.list[Q.pos],c=Q.ans[Q.pos],n=Q.list.length,prac=S.mode==='practice',locked=prac&&c!=null,last=Q.pos===n-1;
  const opts=x.o.map((t,i)=>{const v=i+1;let cl='';
    if(locked)cl=v===x.a?'ok':(v===c?'bad':'');else if(c===v)cl='sel';
    return `<button class="opt ${cl}" data-act="pick" data-v="${v}"><b>(${v})</b><span>${esc(t)}</span></button>`}).join('');
  const fb=locked?`<div class="res ${c===x.a?'ok':'bad'}">${c===x.a?'ถูกต้อง ✓':'ตอบผิด · เฉลยคือข้อ '+x.a}</div>${x.e?`<div class="ex">${esc(x.e)}</div>`:''}`:'';
  const un=n-Object.keys(Q.ans).length;
  const next=prac?`<button class="btn" data-act="${last?'finish':'next'}" ${c==null?'disabled':''}>${last?'ดูผลคะแนน':'ถัดไป'}</button>`
    :(last?`<button class="btn" data-act="finish">ส่งคำตอบ${un?` (ยังไม่ตอบ ${un})`:''}</button>`:`<button class="btn" data-act="next">ถัดไป</button>`);
  return `<div class="row" style="justify-content:space-between"><span class="mu">ข้อ ${Q.pos+1} / ${n} · ${esc(x.src)} ข้อ ${x.n}</span><button class="chip" data-act="home">ออก</button></div>
  <div class="bar"><i style="width:${(Q.pos+(locked?1:0))/n*100}%"></i></div>${qhtml(x)}${opts}${fb}
  <div class="nav">${prac?'<span></span>':`<button class="btn alt" data-act="prev" ${Q.pos?'':'disabled'}>ก่อนหน้า</button>`}${next}</div>`;
}
function result(){
  const n=Q.list.length;let ok=0;const bad=[];
  Q.list.forEach((x,i)=>{if(Q.ans[i]===x.a)ok++;else bad.push(i)});
  const pct=Math.round(ok/n*100);
  const items=bad.map(i=>{const x=Q.list[i],c=Q.ans[i];
    return `<div class="card">${qhtml(x)}<div class="res bad">${c==null?'ไม่ได้ตอบ':'คุณตอบ ('+c+') '+esc(x.o[c-1]||'')}</div><div class="res ok">เฉลย ('+x.a+') ${esc(x.o[x.a-1]||'')}</div>${x.e?`<details><summary>ดูคำอธิบาย</summary><div class="ex">${esc(x.e)}</div></details>`:''}<div class="mu">${esc(x.src)} ข้อ ${x.n}</div></div>`}).join('');
  return `<h1>ผลคะแนน</h1><div class="score">${ok} / ${n}</div><div class="mu" style="text-align:center">${pct}%</div>
  <div class="row" style="margin:16px 0;justify-content:center"><button class="btn" data-act="start">ทำชุดใหม่</button>${wcount()?'<button class="btn alt" data-act="startwrong">ฝึกข้อที่เคยผิด ('+wcount()+')</button>':''}<button class="btn alt" data-act="home">หน้าหลัก</button></div>
  ${bad.length?'<h2>ข้อที่ต้องทบทวน ('+bad.length+')</h2>'+items:'<div class="card res ok">ถูกทุกข้อ เยี่ยมมาก!</div>'}`;
}
function render(){$('#app').innerHTML=S.view==='home'?home():S.view==='quiz'?quiz():result()}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const a=b.dataset.act,k=b.dataset.k;
  if(k){const v=b.dataset.v;S[k]=k==='count'?+v:k==='shuffle'?v==='true':v;render();return}
  if(a==='start')start('normal');
  else if(a==='startwrong')start('wrong');
  else if(a==='clear'){wrong={};store.set('r1103wrong',wrong);render()}
  else if(a==='home'){S.view='home';render()}
  else if(a==='pick'){const v=+b.dataset.v;if(S.mode==='practice'&&Q.ans[Q.pos]!=null)return;Q.ans[Q.pos]=v;render()}
  else if(a==='next'){Q.pos++;render();window.scrollTo(0,0)}
  else if(a==='prev'){Q.pos--;render();window.scrollTo(0,0)}
  else if(a==='finish')finish();
});
render();
</script>
</body>
</html>
